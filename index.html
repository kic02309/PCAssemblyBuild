<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조립팀 업무데이터</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#1d2430;--sub:#5f6b7a;--line:#d9dee6;--line2:#eef1f5;
  --blue:#1f5fbf;--blue-soft:#e8f0fc;--yellow:#fff3a3;--yellow-ink:#6b5800;--red:#c62828;--red-soft:#fdecec;
  --green:#1e7a3c;--green-soft:#e6f4ea;--head:#f7f8fa;--memo:#b4c6e7;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Gulim,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9edf2;color:var(--ink);font-family:var(--font);font-size:13.5px}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 12px}
button:hover{border-color:#aab4c3}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--red);border-color:#f0c4c4}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #8fb3ee;outline-offset:-1px;border-color:#8fb3ee}
.hide{display:none!important}
/* 상단 */
header{position:sticky;top:0;z-index:30;background:#1f2a3a;color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;height:48px}
header .logo{font-weight:700;font-size:15px;letter-spacing:-.3px;white-space:nowrap}
header nav{display:flex;gap:2px;margin-left:8px}
header nav button{background:transparent;border:0;color:#c7d0dc;padding:14px 14px;border-radius:0;border-bottom:3px solid transparent}
header nav button.on{color:#fff;border-bottom-color:#6ea2f5;font-weight:700}
header .me{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
header .me b{font-size:16px}
header .me .tag{font-size:11px;background:#3a4a60;border-radius:10px;padding:2px 8px}
header .me button{background:transparent;color:#c7d0dc;border-color:#3a4a60;padding:4px 10px}
.proxy{background:#fff4d6;border-bottom:1px solid #f0d58a;padding:8px 16px;display:flex;gap:10px;align-items:center;font-weight:700;color:#6b4e00}
main{padding:14px 16px 40px;max-width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--line2);color:var(--sub)}
.chip.open{background:var(--green-soft);color:var(--green)}
.chip.closed{background:var(--red-soft);color:var(--red)}
.chip.none{background:#fff0e0;color:#a15c00}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .date{font-size:15px;font-weight:700;padding:5px 8px}
.save-state{font-size:12px;color:var(--sub);min-width:120px}
.save-state.err{color:var(--red);font-weight:700}
.save-state.ing{color:var(--blue)}
/* 요약 */
.stats{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:10px}
.stat{background:#fff;border:1px solid #c9d0da;border-radius:8px;padding:7px 12px}
.stat .k{font-size:12.5px;color:#46505e;font-weight:600}
.stat .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--sub);font-weight:400;margin-left:3px}
.bar{height:6px;border-radius:3px;background:var(--line2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#f2c200}
.bar i.hi{background:#0070c0}.bar i.lo{background:#e53935}
.inputs{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;padding:9px 14px;border-color:#c9d0da}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:12px;color:#46505e;font-weight:600}
.fld .ro{padding:6px 2px;font-weight:700;font-variant-numeric:tabular-nums}
.fld input.min{width:66px;text-align:right;background:#fffbe6}
.sep{width:1px;align-self:stretch;background:var(--line)}
/* 표 */
.gridwrap{background:#fff;border:1px solid #b9c2cf;border-radius:8px;overflow:auto;max-height:calc(100vh - 340px);min-height:320px}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
table.grid th,table.grid td{border-right:1px solid #d3dae3;border-bottom:1px solid #dde2e9;padding:0;height:30px;text-align:center;white-space:nowrap}
table.grid thead th{position:sticky;background:#e9edf2;z-index:3;font-weight:700;color:#1d2430}
table.grid thead tr:nth-child(1) th{top:0;height:28px;font-size:13px;border-bottom:1px solid #b9c2cf}
table.grid thead tr:nth-child(2) th{top:28px;height:38px;white-space:pre-line;line-height:1.15;font-size:12.5px}
table.grid thead tr:nth-child(3) th{top:66px;height:20px;font-size:11px;color:#46505e;font-weight:400;border-bottom:2px solid #6b7686}
/* 구역 색 */
.g0{--gh:hsl(212,62%,84%);--gb:hsl(212,70%,96.5%)}.g1{--gh:hsl(172,45%,80%);--gb:hsl(172,55%,96%)}
.g2{--gh:hsl(24,80%,84%);--gb:hsl(24,85%,96.5%)}.g3{--gh:hsl(196,60%,82%);--gb:hsl(196,70%,96.5%)}
.g4{--gh:hsl(140,42%,82%);--gb:hsl(140,50%,96.5%)}.g5{--gh:hsl(262,48%,86%);--gb:hsl(262,60%,97%)}
.g6{--gh:hsl(338,60%,87%);--gb:hsl(338,70%,97%)}.g7{--gh:hsl(12,62%,86%);--gb:hsl(12,70%,97%)}
.g8{--gh:hsl(96,40%,82%);--gb:hsl(96,50%,96.5%)}.g9{--gh:hsl(290,40%,86%);--gb:hsl(290,50%,97%)}
.g10{--gh:hsl(0,55%,87%);--gb:hsl(0,65%,97%)}
table.grid thead th.gc{background:var(--gh)}
table.grid tbody td.gc{background-color:var(--gb)}
table.grid .gs{border-left:2px solid #6b7686}
table.grid .stk{position:sticky;z-index:2;background-color:#fff}
table.grid thead .stk{z-index:5;background:#dfe5ec}
table.grid .c0{left:0;width:28px;min-width:28px}
table.grid .c1{left:28px;width:30px;min-width:30px;color:#46505e;font-size:12px}
table.grid .c2{left:58px;width:118px;min-width:118px}
table.grid .c3{left:176px;width:50px;min-width:50px;border-right:2px solid #6b7686}
table.grid tbody td.c2,table.grid tbody td.c3{background-color:#fffbe6}
table.grid td input{border:0;border-radius:0;width:100%;height:29px;background:transparent;text-align:center;padding:0 4px;font-size:13px;color:#1d2430}
table.grid td input:focus{outline:2px solid #1f5fbf;outline-offset:-2px;background:#fff}
table.grid td.o input{text-align:left;font-variant-numeric:tabular-nums;letter-spacing:.3px;font-weight:600}
table.grid tbody td.o.memo{background-color:var(--memo)}
table.grid td.mk{width:36px;min-width:36px;cursor:pointer;user-select:none;font-weight:800;font-size:14px}
table.grid td.mk:hover{outline:2px solid #1f5fbf;outline-offset:-2px}
table.grid tbody td.mk.on{background-color:#ffd43b;color:#3d3000}
table.grid td.n{width:36px;min-width:36px}
table.grid td.n input{color:#0b3f86;font-weight:800;font-size:14px}
table.grid tbody td.n.on{background-color:#bcd6ff}
table.grid td.memo-c{min-width:170px;text-align:left}
table.grid td.memo-c input{text-align:left;font-weight:400}
table.grid tbody tr:nth-child(even) td{background-image:linear-gradient(rgba(30,45,70,.055),rgba(30,45,70,.055))}
table.grid tbody tr.b5 td{border-bottom:2px solid #8792a3}
table.grid tbody tr:hover td{background-image:linear-gradient(rgba(31,95,191,.13),rgba(31,95,191,.13))}
table.grid td.x button{border:0;background:transparent;color:#9aa4b2;padding:0;width:100%;height:29px}
table.grid td.x button:hover{color:var(--red)}
table.grid tfoot td{position:sticky;background:#e9edf2;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;z-index:2;border-top:2px solid #6b7686}
table.grid tfoot tr:nth-child(1) td{bottom:28px;height:28px}
table.grid tfoot tr:nth-child(2) td{bottom:0;height:28px;color:#1f5fbf;border-top:1px solid #c9d0da}
table.grid tfoot td.stk{z-index:4;background:#dfe5ec}
table.grid.ro td.mk{cursor:default}
.below{display:flex;gap:10px;align-items:center;margin-top:8px}
/* 일반 표 */
table.list{border-collapse:collapse;width:100%;background:#fff}
table.list th,table.list td{border-bottom:1px solid var(--line2);padding:8px 10px;text-align:left;white-space:nowrap}
table.list th{background:var(--head);font-size:12px;color:var(--sub);position:sticky;top:0}
table.list td.num,table.list th.num{text-align:right;font-variant-numeric:tabular-nums}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:#f5f8ff}
.sat{color:#1f5fbf}.sun{color:var(--red)}
/* 로그인 */
.login{max-width:380px;margin:9vh auto 0}
.login h1{font-size:20px;margin:0 0 4px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:10px 14px;color:var(--sub)}
.tabs button.on{border-bottom-color:var(--blue);color:var(--ink);font-weight:700}
.login .fld{margin-bottom:10px}
.login input,.login select{width:100%;padding:9px 10px;font-size:15px}
.login .pin{letter-spacing:8px;font-size:18px}
.login button.primary{width:100%;padding:11px;font-size:15px;margin-top:6px}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:12px}
/* 모달/토스트 */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;padding:20px;width:360px;max-width:92vw}
.modal h3{margin:0 0 12px;font-size:16px}
.modal .fld{margin-bottom:10px}.modal input,.modal select{width:100%}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2a3a;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s}
table.rt td{padding:4px 8px}table.rt input{padding:4px 6px}table.rt input.rm{width:70px;text-align:right}table.rt input.rtp{width:100%;min-width:380px}table.rt input.chg{background:#fff4c2;border-color:#e0b400;font-weight:700}
.gtbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:8px 12px;background:#fffbe6;border:1px solid #f0e2a8;border-radius:8px;font-size:13px}.gtbar select{padding:3px 6px}
.chks{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 0}.chks label{display:flex;align-items:center;gap:5px;font-size:14px;color:inherit;margin:0}
#perf{position:fixed;right:10px;bottom:6px;font-size:11px;color:#8a94a6;z-index:5;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:var(--red)}
.section-t{font-size:15px;font-weight:700;margin:18px 0 8px}
.lock{background:var(--red-soft);color:var(--red);border:1px solid #f3c7c7;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-weight:700}
.warn{background:#fff4e0;color:#8a5300;border:1px solid #f1d39c;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.progress{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;width:220px}
.progress i{display:block;height:100%;background:var(--blue);width:0}

/* 숫자 선택판 */
#np{position:fixed;z-index:150;background:#fff;border:1px solid #6b7686;border-radius:8px;box-shadow:0 8px 24px rgba(20,30,50,.25);padding:6px;display:none;width:236px}
#np.show{display:block}
#np .t{font-size:11.5px;color:#46505e;margin:0 2px 5px;display:flex;justify-content:space-between}
#np .gp{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#np button{padding:0;height:32px;font-size:14px;font-weight:700;border-color:#c9d0da;border-radius:5px}
#np button:hover{background:#1f5fbf;color:#fff;border-color:#1f5fbf}
#np button.cur{background:#bcd6ff;border-color:#1f5fbf}
#np button.clr{grid-column:span 2;font-size:12.5px;color:var(--red);font-weight:600}
#np button.more{grid-column:span 3;font-size:12.5px;font-weight:600;color:#46505e}
table.grid td.n{position:relative}
table.grid.pad tbody tr:hover td.n::after,table.grid.pad tbody tr:hover td.c3::after{content:"▾";position:absolute;right:2px;bottom:1px;font-size:9px;color:#7d8898;pointer-events:none}
table.grid td.n input,table.grid tbody td.c3 input{cursor:pointer}

/* 개인목표 에너지바 */
.energy{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #c9d0da;border-radius:8px;padding:8px 14px;margin-bottom:10px}
.energy .el{display:flex;align-items:center;gap:8px;white-space:nowrap}
.energy .el b{font-size:14px}.energy .el span{font-size:12px;color:#46505e;font-weight:600}
.energy .el select{font-weight:700;background:#fffbe6}
.energy .eb{flex:1;position:relative;height:30px;border-radius:15px;background:#e6eaf0;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.energy .eb i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:15px;transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.energy .eb i.hi{background:linear-gradient(90deg,#1e63c4,#2f86f0)}
.energy .eb i.mid{background:linear-gradient(90deg,#f2b705,#ffd84d)}
.energy .eb i.lo{background:linear-gradient(90deg,#d32f2f,#f0625d)}
.energy .eb span{position:absolute;inset:0;display:flex;align-items:center;padding-left:14px;font-weight:700;font-size:13.5px;color:#1d2430;text-shadow:0 0 3px rgba(255,255,255,.9)}
.energy .eb em{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed rgba(29,36,48,.35)}
.energy .eb em.m90{left:90%}.energy .eb em.m50{left:50%}
.energy .ep{font-size:26px;font-weight:800;min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.energy .ep.hi{color:#1e63c4}.energy .ep.mid{color:#b58800}.energy .ep.lo{color:#d32f2f}.energy .ep.none{color:#9aa4b2}
.stats{grid-template-columns:repeat(5,minmax(120px,1fr))!important}
.stats.s6{grid-template-columns:repeat(6,minmax(120px,1fr))!important}
/* 제목 설명 말풍선 */
#tip{position:fixed;z-index:160;max-width:340px;background:#1f2a3a;color:#fff;border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.28);pointer-events:none;display:none;white-space:normal}
#tip.show{display:block}
#tip .tm{color:#ffd84d;font-weight:700;margin-left:4px}
#tip div{margin-top:3px;color:#dfe6ef}
table.grid thead th[data-tip]{cursor:help}
table.grid thead th.hastip{text-decoration:underline dotted #46505e;text-underline-offset:3px}

/* 관리 화면 */
.seg{display:inline-flex;border:1px solid #b9c2cf;border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;background:#fff;color:#46505e;font-weight:600}
.seg button+button{border-left:1px solid #b9c2cf}
.seg button.on{background:#1f2a3a;color:#fff}
.sumrow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:10px}
.sumrow>div{background:#fff;border:1px solid #c9d0da;border-radius:8px;padding:8px 12px;display:flex;flex-direction:column}
.sumrow span{font-size:12px;color:#46505e;font-weight:600}.sumrow b{font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.sumrow em{font-style:normal;font-size:12px;color:#46505e}
.t-hi{color:#1e63c4}.t-lo{color:#d32f2f}
table.mlist th.sort{cursor:pointer;user-select:none}table.mlist th.sort:hover{color:#1d2430}table.mlist th.on{color:#1f5fbf}
table.mlist td{padding:7px 10px}table.mlist tbody tr:nth-child(even) td{background:#f7f9fb}table.mlist tbody tr:hover td{background:#eaf1fc}
table.mlist td.acts{white-space:nowrap}table.mlist td.acts button{padding:4px 9px;margin-right:4px;font-size:12.5px}
.rtag{font-size:11px;background:#e6ebf2;color:#46505e;border-radius:9px;padding:1px 7px;margin-left:3px;font-weight:600}
.mini{display:inline-block;width:70px;height:8px;border-radius:4px;background:#e6eaf0;overflow:hidden;vertical-align:middle;margin-right:7px}
.mini i{display:block;height:100%}
.mini i.r-hi,.legend i.r-hi{background:#2f7be6}.mini i.r-mid,.legend i.r-mid{background:#f2c200}.mini i.r-lo,.legend i.r-lo{background:#e5484d}.legend i.r-no{background:#dfe4ea}
.r-hit{color:#1e63c4}.r-midt{color:#9a7400}.r-lot{color:#d32f2f}
.legend{display:flex;gap:16px;align-items:center;margin:0 0 8px;font-size:12.5px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
table.bd{border-collapse:separate;border-spacing:0;font-size:12.5px}
table.bd th,table.bd td{border-right:1px solid #e1e6ec;border-bottom:1px solid #e1e6ec;text-align:center;padding:0;height:34px;min-width:42px;font-variant-numeric:tabular-nums}
table.bd thead th{position:sticky;top:0;background:#e9edf2;z-index:2;font-weight:700;height:40px;line-height:1.1}
table.bd thead th small{display:block;font-size:10.5px;font-weight:400;color:#46505e}
table.bd thead th.sat,table.bd thead th.sat small{color:#1f5fbf}table.bd thead th.sun,table.bd thead th.sun small{color:#d32f2f}
table.bd .bn{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:0 10px;min-width:130px;border-right:2px solid #8792a3}
table.bd thead .bn{z-index:3;background:#dfe5ec}
table.bd .bn small{display:block;font-size:11px;color:#46505e}
table.bd .bt{background:#f4f6f9;min-width:66px;padding:0 6px}
table.bd thead .bt{background:#dfe5ec}
table.bd td[data-d]{cursor:pointer;font-weight:700}
table.bd td[data-d]:hover{outline:2px solid #1f2a3a;outline-offset:-2px}
table.bd td.r-hi{background:#cfe0fb;color:#0d3f8f}table.bd td.r-mid{background:#fff0b3;color:#6b5200}table.bd td.r-lo{background:#fdd3d3;color:#9b1c1c}table.bd td.r-no{background:#eef1f5}
table.bd td.e{background:#fff}
table.bd tfoot td{position:sticky;bottom:0;background:#e9edf2;font-weight:700;border-top:2px solid #8792a3}
table.bd tfoot .bn{z-index:3;background:#dfe5ec}
details.pp{margin-top:12px}details.pp>summary{cursor:pointer;font-size:15px;font-weight:700;padding:8px 2px;list-style:revert}details.pp>.card{margin-top:6px}
.modal.wide{width:min(900px,94vw)}.modal.md{width:min(480px,94vw)}.modal .acts button{white-space:nowrap}
table.imp td{padding:5px 10px}table.imp input[type=date]{padding:3px 5px}
.ist.ok{color:var(--green);font-weight:700}.ist.warn{color:#a15c00;font-weight:700}.ist.bad{color:var(--red);font-weight:700}
.energy .tgv{font-size:15px;padding:3px 10px;background:#eef1f5;border-radius:6px}
table.mlist select.mtg{padding:3px 4px;font-weight:700;background:#fffbe6}
table.bimp td{padding:6px 8px}table.bimp td.bfn{max-width:300px;overflow:hidden;text-overflow:ellipsis}
table.bimp select.bus{max-width:190px}table.bimp select.bus.miss{border-color:var(--red);background:var(--red-soft)}
table.bimp tr.bdet>td{background:#f7f9fb;padding:8px 10px 12px 40px}table.bimp .bdt{padding:3px 8px;font-size:12px}
.modal input[type=checkbox]{width:auto;margin:0}

/* 연차·토요 */
.red{color:var(--red)!important;font-weight:700}
.lvbar .lvym{font-size:16px;min-width:96px;text-align:center}
.lvlegend{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:8px;font-size:12px}

    AJ: 'SSD, 메모리 간단변경', AK: '쌍팬 쿨러 제거후 메모리 변경 / 박스 제외건', AL: '그래픽 탈거후 SSD 변경',

  const OTHER = [['K7', '포장지원'], ['M7', '정리지원'], ['O7', '청 소'], ['Q7', '담당/교육'], ['S7', '불량처리'], ['U7', '기타시간']];

    let s = String(v == null ? '' : v).trim();

  function calcDay(doc, target, mins) {
    const M = minsMap(mins), rt = c => M[c] / 30;
    const r10 = {}, r9 = {}, t = {}; let gq = 0;
    COLS.forEach(x => (r10[x.c] = 0));
    ['C', 'D', 'E', 'F', 'G'].forEach(c => (r9[c] = 0));

      // 엑셀 매크로와 동일 : 주문번호와 수량이 모두 있어야 계산
      if (!row || String(row.o || '').trim() === '' || row.q === '' || row.q == null) return;
      const q = num(row.q), m = row.m || {};
      let typeCol = null, score = 0;
      for (const c of EXCLUSIVE.type) if (m[c]) { typeCol = c; r10[c] += q; break; }
      COLS.forEach(x => {
        if (x.kind === 'type') return;
        const v = m[x.c];
        if (!v) return;
        const n = x.kind === 'ship' ? 1 : x.kind === 'num' ? num(v) : q;

      });

<script>/* =========================================================

(function (root) {

  function dispName(name, l) { return name + (l.t ? '(훈)' : '') + (l.h ? '(' + l.h + ')' : ''); }

  // 자료 묶음 → 빠른 조회용
  function index(data) {
    const S = {}; (data.staff || []).forEach(s => (S[s.id] = s));
    const H = holidayMap(data.kv);
    const byDate = {};                                                 // 날짜 → 연차 목록
    (data.leaves || []).forEach(l => {
      for (let d = l.d1; d <= l.d2; d = addDays(d, 1)) if (isWork(d, H)) (byDate[d] = byDate[d] || []).push(l);
    });
    const duty = {}, alt = {};                                         // 토요일 → 명단, 대체휴무일 → 목록
    (data.duty || []).slice().sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.o - b.o).forEach(u => {
      (duty[u.d] = duty[u.d] || []).push(u);
      if (u.a) (alt[u.a] = alt[u.a] || []).push(u);
    });
    return { S, H, byDate, duty, alt, managers: new Set((data.kv && data.kv.managers) || []) };
  }
  // 하루 칸 : 연차(정렬된 표시 이름) / 대체휴무 / 휴무 인원
  function dayCell(ix, d) {
    const lv = (ix.byDate[d] || []).map(l => ({ l, s: ix.S[l.s], name: dispName((ix.S[l.s] || {}).name || '?', l) })).sort((a, b) => ko(a.name, b.name));
    const al = (ix.alt[d] || []).map(u => ({ u, s: ix.S[u.s], name: (ix.S[u.s] || {}).name || '?' })).sort((a, b) => ko(a.name, b.name));
    return { lv, al, off: lv.length + al.length };
  }
  // 토요일이 그 달 몇 주차인지 (대체휴무 색) : 그 달 표에 없으면 0
  function satWeek(ym, sat) { const i = monthSaturdays(ym).indexOf(sat); return i + 1; }

  // ---------------------------------------------------------------- 토요근무 자동 배정 (M_SatDuty 이식)
  const EXCLUDE_GRADES = ['계약', '영상', '육아휴직', '병가휴가', '근무제외'];
  const LAST_GRADES = ['D'];
  const SORT_ORDER = ['매니저', '파트장', 'A', 'B', 'C', '정리', '안정화', '출력', 'D'];
  const MGR_IN_STAFF = false, LEADER_IN_STAFF = true, LEADER_ALL = true, LAST_GRADE_MIN = 0, MAX_PER_GROUP = 0;
  const gradeGroup = g => { g = (g || '').trim(); if (!g || EXCLUDE_GRADES.includes(g)) return ''; return g === '매니저' ? '매니저' : g === '파트장' ? '파트장' : '사원'; };
  const isLast = g => LAST_GRADES.includes((g || '').trim());
  const fitsSlot = (grp, need) => { if (!grp) return false; if (need === '사원') return grp === '사원' || (grp === '매니저' && MGR_IN_STAFF) || (grp === '파트장' && LEADER_IN_STAFF); return grp === need; };
  const sortRank = g => { const i = SORT_ORDER.indexOf((g || '').trim()); return i < 0 ? 999 : i; };
  const binCmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;

  // P = { roster:[{id,name,grade,grp,off}], slots:[16], weeks:[토요일…], lists:{date:[id…]}, score:{id:n}, rng }
  function makeAssigner(P) {
    const rng = P.rng || Math.random;
    const R = P.roster.slice().sort((a, b) => ko(a.name, b.name));
    const byId = {}; R.forEach(r => (byId[r.id] = r));
    const lists = {}; P.weeks.forEach(w => (lists[w] = (P.lists[w] || []).slice()));
    const sc = r => +(P.score[r.id] || 0);
    const grpOf = r => (r.grp || '').trim() || '(미지정)';
    const gradeKey = r => (r.grade || '').trim();
    const isCand = r => r.name && !(r.off || '').trim() && gradeGroup(r.grade);
    const inPool = r => isCand(r) && !isLast(r.grade) && fitsSlot(gradeGroup(r.grade), '사원');
    const bump = (d, k) => { if (k) d[k] = (d[k] || 0) + 1; };
    const slotRows = P.slots.map(x => (x || '').trim());
    const staffPerWeek = slotRows.filter(x => x && x !== '매니저').length;
    const monthStaffSlots = () => staffPerWeek * P.weeks.length;
    const usedMonth = skip => { const s = new Set(); P.weeks.forEach(w => { if (w !== skip) lists[w].forEach(id => s.add(id)); }); return s; };
    const remainWeeks = w => 1 + P.weeks.filter(x => x !== w && lists[x].length === 0).length;
    const weekOK = () => true;                                         // MAX_PER_GROUP = 0 (제한 없음)

    function pickLow(need, used, gkey, grp, lastOnly) {
      let best = 1e30, tie = [];
      R.forEach(r => {
        if (!isCand(r) || used.has(r.id)) return;
        if (isLast(r.grade) !== lastOnly) return;
        if (!fitsSlot(gradeGroup(r.grade), need)) return;
        if (gkey && gradeKey(r) !== gkey) return;
        const g = grpOf(r); if (grp && g !== grp) return;
        if (!weekOK(g)) return;
        const s = sc(r);
        if (s < best - 1e-7) { best = s; tie = [r]; } else if (Math.abs(s - best) < 1e-7) tie.push(r);
      });
      return tie.length ? tie[Math.floor(rng() * tie.length)] : null;
    }
    function countHave(w) {
      const gOth = {}, pOth = {}, gThis = {}, pThis = {};
      P.weeks.forEach(c => lists[c].forEach(id => {
        const r = byId[id]; if (!r || !inPool(r)) return;
        if (c === w) { bump(gThis, gradeKey(r)); bump(pThis, grpOf(r)); } else { bump(gOth, gradeKey(r)); bump(pOth, grpOf(r)); }
      }));
      return { gOth, pOth, gThis, pThis };
    }
    function pickStaff(need, used, w) {
      const gTot = {}, pTot = {}; let nPool = 0, nLeader = 0;
      R.forEach(r => { if (inPool(r)) { bump(gTot, gradeKey(r)); bump(pTot, grpOf(r)); nPool++; if (gradeKey(r) === '파트장') nLeader++; } });
      if (!nPool) return null;
      const H = countHave(w), Rw = remainWeeks(w);
      let cap = monthStaffSlots() - LAST_GRADE_MIN; if (cap > nPool) cap = nPool; if (cap < 0) cap = 0;
      const capRest = (LEADER_ALL && cap >= nLeader && nPool > nLeader) ? (cap - nLeader) / (nPool - nLeader) : cap / nPool;
      let bestV = -1e30, bestKey = '';
      Object.keys(gTot).forEach(k => {
        if (!pickLow(need, used, k, '', false)) return;
        const q = (k === '파트장' && LEADER_ALL && cap >= nLeader) ? gTot[k] : gTot[k] * capRest;
        const v = (q - (H.gOth[k] || 0)) / Rw - (H.gThis[k] || 0) + rng() * 0.001;
        if (v > bestV) { bestV = v; bestKey = k; }
      });
      if (!bestKey) return null;
      bestV = -1e30; let bestGrp = '';
      Object.keys(pTot).forEach(k => {
        if (!pickLow(need, used, bestKey, k, false)) return;
        const q = (pTot[k] / nPool) * cap;
        const v = (q - (H.pOth[k] || 0)) / Rw - (H.pThis[k] || 0) + rng() * 0.001;
        if (v > bestV) { bestV = v; bestGrp = k; }
      });
      if (!bestGrp) return null;
      return pickLow(need, used, bestKey, bestGrp, false);
    }
    function dSlotsThisWeek(w) {
      const nPool = R.filter(inPool).length, Dm = Math.max(monthStaffSlots() - nPool, LAST_GRADE_MIN);
      if (Dm <= 0) return 0;
      let dOther = 0; P.weeks.forEach(c => { if (c !== w) lists[c].forEach(id => { const r = byId[id]; if (r && isLast(r.grade)) dOther++; }); });
      const remain = Dm - dOther; if (remain <= 0) return 0;
      return Math.floor(remain / remainWeeks(w) + 0.5);
    }
    function managerRotation() {
      return R.filter(r => isCand(r) && gradeGroup(r.grade) === '매니저').sort((a, b) => sc(a) !== sc(b) ? sc(a) - sc(b) : a.name.localeCompare(b.name, 'ko'));
    }
    function sortWeek(w) {
      lists[w].sort((a, b) => { const A = byId[a] || {}, B = byId[b] || {}; return (sortRank(A.grade) - sortRank(B.grade)) || binCmp(A.name || '', B.name || ''); });
    }
    function assignOne(w) {
      lists[w] = [];
      const used = usedMonth(w), mgr = managerRotation(); let mp = 0;
      let staffSlots = slotRows.filter(x => x === '사원').length, dNeed = Math.min(dSlotsThisWeek(w), staffSlots), staffIdx = 0;
      const short = [];
      for (let pass = 1; pass <= 2; pass++) {
        slotRows.forEach(need => {
          if (!need) return;
          if (!((pass === 1 && need !== '사원') || (pass === 2 && need === '사원'))) return;
          let pick = null;
          if (need === '매니저') {
            while (mp < mgr.length && used.has(mgr[mp].id)) mp++;
            if (mp < mgr.length) pick = mgr[mp++];
            else pick = mgr.find(r => !lists[w].includes(r.id)) || null;
          } else if (need === '사원') {
            staffIdx++;
            if (staffIdx > staffSlots - dNeed) { pick = pickLow(need, used, '', '', true) || pickStaff(need, used, w); }
            else { pick = pickStaff(need, used, w) || pickLow(need, used, '', '', true); }
          } else pick = pickStaff(need, used, w);
          if (pick) { lists[w].push(pick.id); used.add(pick.id); }
          else short.push(need);
        });
      }
      sortWeek(w);
      return { week: w, filled: lists[w].length, short };
    }
    function summary() {
      const nUp = R.filter(inPool).length; let doneUp = 0, doneD = 0; const g = {}, seen = new Set();   // 같은 사람 두 번은 한 명으로
      P.weeks.forEach(w => lists[w].forEach(id => { const r = byId[id]; if (!r || seen.has(id)) return; seen.add(id); if (isLast(r.grade)) doneD++; else if (inPool(r)) { doneUp++; bump(g, gradeKey(r)); } }));
      return { nUp, doneUp, doneD, byGrade: g };

    return { lists, assignOne, sortWeek, summary, nextEmpty: () => P.weeks.find(w => lists[w].length === 0) || null };
  }

  // ---------------------------------------------------------------- 엑셀 셀 쓰기 도우미
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const colN = c => { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
  const colL = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  // vals : {ref: 숫자 | 글자 | null}. 칸이 없으면 만들고, 서식(s)은 그대로 둠
  function setCells(xml, vals) {
    const byRow = {};
    for (const ref in vals) { const m = ref.match(/^([A-Z]+)(\d+)$/); (byRow[m[2]] = byRow[m[2]] || {})[m[1]] = vals[ref]; }
    const cellXml = (ref, attrs, v) => {
      attrs = (attrs || '').replace(/\s+t="[a-zA-Z]+"/, '');
      if (v === null || v === undefined || v === '') return '<c r="' + ref + '"' + attrs + '/>';
      if (typeof v === 'number') return '<c r="' + ref + '"' + attrs + '><v>' + v + '</v></c>';
      return '<c r="' + ref + '"' + attrs + ' t="inlineStr"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';
    };
    for (const r in byRow) {
      const set = byRow[r];
      const re = new RegExp('<row r="' + r + '"([^>]*?)(/>|>([\\s\\S]*?)</row>)');
      const m = xml.match(re);
      const cells = [];
      if (m && m[3] !== undefined) {
        const cre = /<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>[\s\S]*?<\/c>)/g; let cm;
        while ((cm = cre.exec(m[3]))) cells.push({ c: cm[1], attrs: cm[2], xml: cm[0] });
      }
      for (const c in set) {
        const i = cells.findIndex(x => x.c === c);
        if (i >= 0) cells[i].xml = cellXml(c + r, cells[i].attrs, set[c]);
        else cells.push({ c, attrs: '', xml: cellXml(c + r, '', set[c]) });
      }
      cells.sort((a, b) => colN(a.c) - colN(b.c));
      const rowXml = '<row r="' + r + '"' + (m ? m[1].replace(/\s+spans="[^"]*"/, '') : '') + '>' + cells.map(x => x.xml).join('') + '</row>';
      if (m) xml = xml.replace(m[0], rowXml);
      else {                                                           // 행이 없으면 순서에 맞게 끼움
        const rows = [...xml.matchAll(/<row r="(\d+)"/g)];
        const after = rows.find(x => +x[1] > +r);
        if (after) xml = xml.slice(0, after.index) + rowXml + xml.slice(after.index);
        else xml = xml.replace('</sheetData>', rowXml + '</sheetData>');
      }
    }
    return xml;
  }

  // ---------------------------------------------------------------- 엑셀 만들기
  // info : { year, months:['2026-03',…], staff, leaves, duty, kv, batchYm }
  async function buildXlsx(JSZip, b64, info) {
    const tpl = await JSZip.loadAsync(b64, { base64: true });
    const T = p => tpl.file(p).async('string');
    const [satT, startT, monthT, endT] = await Promise.all([T('tpl/sat.xml'), T('tpl/start.xml'), T('tpl/month.xml'), T('tpl/end.xml')]);
    const ix = index(info), kv = info.kv || {};
    const zone = s => { const g = (s && s.grp) || ''; return /^[12]그룹$/.test(g) ? 0 : /^[34]그룹$/.test(g) ? 1 : 2; };
    const warn = [];
    const sheets = [];

    // [토요] 시트
    const roster = info.staff.filter(s => s.roster).sort((a, b) => ko(a.name, b.name)).slice(0, 100);
    const org = info.staff.slice().sort((a, b) => ((a.seq == null ? 1e9 : a.seq) - (b.seq == null ? 1e9 : b.seq)) || ko(a.name, b.name));
    const sv = {};
    roster.forEach((s, i) => { sv['A' + (2 + i)] = s.name; sv['B' + (2 + i)] = s.grade || null; sv['G' + (2 + i)] = s.off || null; });
    org.forEach((s, i) => {
      const r = 2 + i;
      sv['AA' + r] = s.rank || null; sv['AB' + r] = s.name; sv['AC' + r] = s.empno ? (/^\d+$/.test(s.empno) ? +s.empno : s.empno) : null;
      sv['AD' + r] = s.grp || null; sv['AE' + r] = s.title || null; sv['AF' + r] = s.level || null; sv['AG' + r] = s.status || null;
      sv['AH' + r] = s.job || null; sv['AI' + r] = s.seq == null ? null : s.seq;
    });
    const slots = (kv.slots || []).slice(0, 16);
    slots.forEach((x, i) => (sv['I' + (5 + i)] = x || null));
    const bYm = info.batchYm || info.months[info.months.length - 1];
    const batch = ((kv.batches || {})[bYm] || monthSaturdays(bYm)).slice(0, 5);
    batch.forEach((d, k) => {
      const nc = 11 + 2 * k; sv[colL(nc) + '2'] = mdLabel(d);
      const ids = (ix.duty[d] || []).map(u => u.s).filter(id => ix.S[id]);
      ids.sort((a, b) => (sortRank(ix.S[a].grade) - sortRank(ix.S[b].grade)) || binCmp(ix.S[a].name, ix.S[b].name));
      const rows = []; slots.forEach((x, i) => { if ((x || '').trim()) rows.push(5 + i); });
      ids.slice(0, rows.length).forEach((id, i) => { sv[colL(nc) + rows[i]] = ix.S[id].name; sv[colL(nc + 1) + rows[i]] = ix.S[id].grade || null; });
    });
    sheets.push({ name: '토요', xml: setCells(satT, sv) });
    sheets.push({ name: '시작', xml: startT });

    // 월 시트
    for (const ym of info.months) {
      const v = {}, blocks = excelBlocks(ym), f = monthFirst(ym), l = monthLast(ym);
      v.A3 = serial(f);
      const onCal = new Set();
      blocks.forEach((b, bi) => {
        const r0 = 7 + 9 * bi;
        b.days.slice(0, 5).forEach((d, di) => {
          if (!d) return; onCal.add(d);
          const c = 4 + 3 * di, cell = dayCell(ix, d);
          cell.lv.forEach((x, i) => { if (i < 16) v[colL(c + (i < 8 ? 0 : 1)) + (r0 + (i % 8))] = x.name; else warn.push(ym + ' ' + d + ' 연차 칸 부족: ' + x.name); });
          cell.al.forEach((x, i) => { if (i < 8) v[colL(c + 2) + (r0 + i)] = x.name; else warn.push(ym + ' ' + d + ' 대체휴무 칸 부족: ' + x.name); });
        });
      });
      // 이 달 토요근무 표 (AO~AX) + 달력 밖 대체휴무(51행~)
      const spill = { 1: [], 2: [], 3: [], 4: [], 5: [] };
      blocks.forEach((b, bi) => {
        const sat = b.days[5]; if (!sat) return;
        const nc = 41 + 2 * bi;
        (ix.duty[sat] || []).forEach((u, i) => {
          const s = ix.S[u.s]; if (!s) return;
          if (i < 26) { v[colL(nc) + (7 + i)] = s.name; if (u.a) v[colL(nc + 1) + (7 + i)] = serial(u.a); }
          else warn.push(ym + ' ' + sat + ' 토요 표 칸 부족: ' + s.name);
          if (u.a && !onCal.has(u.a) && dow(u.a) >= 1 && dow(u.a) <= 5) spill[dow(u.a)].push(s.name);
        });
      });
      for (let w = 1; w <= 5; w++) spill[w].sort(ko).slice(0, 6).forEach((nm, i) => (v[colL(4 + 3 * (w - 1) + 2) + (51 + i)] = nm));
      // 연차 사유 기록부 (3구역)
      const recs = [[], [], []];
      info.leaves.filter(x => x.d2 >= f && x.d1 <= l).forEach(x => { const s = ix.S[x.s]; if (s) recs[zone(s)].push({ x, s }); });
      recs.forEach((list, zi) => {
        list.sort((a, b) => ko(a.s.name, b.s.name) || ko(a.x.d1, b.x.d1));
        const c = [22, 28, 34][zi];
        list.forEach((it, i) => {
          if (i >= 44) { warn.push(ym + ' 사유 기록부 칸 부족: ' + it.s.name); return; }
          const r = 7 + i;
          v[colL(c) + r] = it.s.name; v[colL(c + 1) + r] = serial(it.x.d1); v[colL(c + 2) + r] = serial(it.x.d2);
          v[colL(c + 3) + r] = (it.x.r || '') + (it.x.h ? ' (' + it.x.h + ' 반차)' : '');
        });
      });
      ((kv.managers || []).slice(0, 8)).forEach((nm, i) => (v['AZ' + (7 + i)] = nm));
      sheets.push({ name: ym.slice(2, 4) + '년_' + (+ym.slice(5)) + '월', xml: setCells(monthT, v) });
    }
    sheets.push({ name: '끝', xml: endT });

    // 통합문서 조립
    const out = new JSZip();
    const F = (p, d) => out.file(p, d, { createFolders: false });
    for (const p of ['xl/styles.xml', 'xl/theme/theme1.xml', 'xl/sharedStrings.xml']) F(p, await T(p));
    let wbS = '', wbR = '', ct = '';
    sheets.forEach((s, i) => {
      const n = i + 1;

      ct += '<Override PartName="/xl/worksheets/sheet' + n + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    });
    const k = sheets.length;
    wbR += '<Relationship Id="rId' + (k + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '<Relationship Id="rId' + (k + 2) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>' +
      '<Relationship Id="rId' + (k + 3) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>';
    const active = Math.max(0, sheets.length - 2);
    F('xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><workbookPr defaultThemeVersion="166925"/><bookViews><workbookView xWindow="0" yWindow="0" windowWidth="28800" windowHeight="12180" tabRatio="712" activeTab="' + active + '"/></bookViews><sheets>' + wbS + '</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>');

  const unesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#10;/g, '\n').replace(/&amp;/g, '&');

  // 원본 연차관리 파일 → {staff, leaves, duty, kv, info}
  async function parseWorkbook(JSZip, data) {
    const book = await readBook(JSZip, data);
    const sat = book.find(s => s.name === '토요');
    if (!sat) throw new Error('[토요] 시트가 없습니다. 연차관리 원본 파일이 맞는지 확인하세요');
    const str = v => v == null ? '' : String(v).trim();
    const staff = {}, order = [];
    const get = nm => { nm = str(nm); if (!nm) return null; if (!staff[nm]) { staff[nm] = { id: 'T' + (order.length + 1), name: nm, grade: '', grp: '', title: '', status: '', off: '', roster: false, rank: '', empno: '', level: '', job: '', seq: null }; order.push(nm); } return staff[nm]; };
    const C = sat.cells;
    for (let r = 2; r <= 300; r++) {
      const nm = str(C['A' + r]);

      const on = str(C['AB' + r]);

          if (!d1) { warn.push(s.name + ' ' + colL(col) + r + ' ' + nm + ' : 날짜 없음 → 건너뜀'); continue; }
          const key = nm + '|' + d1 + '|' + d2 + '|' + reason; if (seenL.has(key)) continue; seenL.add(key);

    ownFirst.sort((a, b) => (b.own - a.own));

        }

        d = cands.sort((a, b) => Math.abs(diffDays(lastYm + '-15', a)) - Math.abs(diffDays(lastYm + '-15', b)))[0];
      } else if (typeof C[colL(11 + 2 * k) + '2'] === 'number') d = fromSerial(C[colL(11 + 2 * k) + '2']);
      if (!d) continue;
      planDates.push(d);
      if (duty.some(u => u.d === d)) continue;
      let o = 0;
      for (let r = 3; r <= 22; r++) { const nm = str(C[colL(11 + 2 * k) + r]); if (!nm) continue; const st = get(nm); duty.push({ d, s: st.id, o: o++, a: null }); }
    }
    if (planDates.length) {
      const cnt = {}; planDates.forEach(d => (cnt[ymOf(d)] = (cnt[ymOf(d)] || 0) + 1));
      const bym = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || (a < b ? 1 : -1))[0];

    }

    const ix = index({ staff: Object.values(staff), leaves, duty, kv: {} });
    const calOnly = [], seenC = new Set();
    for (const { s, ym } of months) {
      excelBlocks(ym).forEach((b, bi) => b.days.slice(0, 5).forEach((d, di) => {
        if (!d) return;
        const have = new Set((ix.byDate[d] || []).map(l => ix.S[l.s].name));
        for (let k = 0; k < 2; k++) for (let r = 0; r < 8; r++) {
          const raw = str(s.cells[colL(4 + 3 * di + k) + (7 + 9 * bi + r)]); if (!raw) continue;
          const nm = raw.replace(/\((훈|오전|오후)\)$/, '');
          const key = d + '|' + nm;

  }

<script>/* ============================================================
 * 연차·토요근무 화면
 * ============================================================ */
(function () {
  'use strict';
  const LC = window.LeaveCore;
  let A = null;                                                       // app.js 가 넘겨주는 공통 도구
  const L = { tab: 'cal', ym: null, data: null, year: null, ix: null, drag: null };
  const GRADES = ['파트장', 'A', 'B', 'C', 'D', '정리', '안정화', '출력', '매니저', '영상', '계약', '육아휴직', '병가휴가', '근무제외'];
  const OFFS = ['', '직무제외', '계약', '육아휴직', '병가', '근무제외'];
  const REASONS = ['개인정비', '병원 진료', '건강검진', '경조사', '가족 행사', '여행', '이사', '예비군 훈련', '민방위 훈련'];
  const md = d => (+d.slice(5, 7)) + '/' + (+d.slice(8, 10));
  const mdw = d => md(d) + '(' + LC.WD[LC.dow(d)] + ')';
  const ymLab = ym => ym.slice(0, 4) + '년 ' + (+ym.slice(5)) + '월';
  const nextYm = (ym, k) => { const d = LC.toD(ym + '-01'); d.setMonth(d.getMonth() + k); return LC.ymOf(LC.ymd(d)); };

  function init(app) { A = app; }
  async function load(year, force) {
    if (!force && L.data && L.year === year) return;
    const r = await A.api('lvGet', { year });
    L.data = r; L.year = year; reindex();
  }
  function reindex() { L.ix = LC.index(L.data); }
  const D = () => L.data;
  const kv = () => L.data.kv || {};
  const staffById = id => L.ix.S[id];
  const staffList = () => L.data.staff.slice().sort((a, b) => LC.ko(a.name, b.name));
  const capOf = d => { const c = (kv().caps || {})[LC.dow(d)]; return c ? +c : 0; };
  const isMgr = name => L.ix.managers.has(name);

  async function render(main) {
    L.main = main;
    L.ym = L.ym || A.S.today.slice(0, 7);
    const y = +L.ym.slice(0, 4);
    if (!L.data || L.year !== y) {
      main.innerHTML = '<div class="muted" style="padding:30px">불러오는 중…</div>';
      try { await load(y); } catch (e) { main.innerHTML = '<div class="warn">' + A.esc(e.message) + '</div>'; return; }
    }
    draw();
  }
  function draw() {
    const d = D(), own = !d.all, main = L.main;
    if (own && !['cal', 'sum'].includes(L.tab)) L.tab = 'cal';
    if (!d.canEdit && L.tab === 'set') L.tab = 'cal';
    const tabs = own ? [['cal', '📅 내 연차·토요'], ['sum', '📊 내 합계']]
      : [['cal', '📅 달력'], ['rec', '📋 사유 기록부'], ['sat', '🗓 토요근무'], ['sum', '📊 개인별 합계']].concat(d.canEdit ? [['set', '⚙ 인원·설정']] : []);
    main.innerHTML = `
      <div class="toolbar lvbar">
        <button id="lvp">◀</button><b class="lvym">${ymLab(L.ym)}</b><button id="lvn">▶</button><button id="lvt">이번 달</button>
        <div class="seg">${tabs.map(([k, t]) => `<button data-lt="${k}" class="${L.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>
        <span style="flex:1"></span>
        ${own ? '<span class="muted">본인 연차와 토요근무만 보입니다</span>' : ''}
        ${d.canEdit ? '<button id="lvimp" title="기존 연차관리 엑셀(xlsm)을 읽어 전체를 바꿉니다">📥 원본 엑셀 가져오기</button>' : ''}
        ${!own ? `<button id="lvxl">⬇ 엑셀 (${String(L.year).slice(2)}년 전체)</button>` : ''}
      </div>
      <div id="lvbody"></div>`;
    const go = k => { const ny = +nextYm(L.ym, k).slice(0, 4); L.ym = nextYm(L.ym, k); if (ny !== L.year) render(main); else draw(); };
    A.$('#lvp').onclick = () => go(-1); A.$('#lvn').onclick = () => go(1);
    A.$('#lvt').onclick = () => { L.ym = A.S.today.slice(0, 7); render(main); };
    A.$$('[data-lt]').forEach(b => (b.onclick = () => { L.tab = b.dataset.lt; draw(); }));
    if (A.$('#lvimp')) A.$('#lvimp').onclick = importXlsx;
    if (A.$('#lvxl')) A.$('#lvxl').onclick = exportXlsx;
    ({ cal: drawCal, rec: drawRec, sat: drawSat, sum: drawSum, set: drawSet })[L.tab]();
  }
  const body = () => A.$('#lvbody');

  // ------------------------------------------------------------ 달력
  function drawCal() {
    const d = D(), ym = L.ym, H = L.ix.H, weeks = LC.screenWeeks(ym), tsat = LC.tableSaturdays(ym);
    const wkColor = sat => { const i = tsat.indexOf(sat); return i >= 0 ? LC.WEEK_COLORS[i] : '#e8e8e8'; };
    const chip = (x, alt) => {
      if (alt) return `<span class="lc alt${isMgr(x.name) ? ' mgr' : ''}" style="background:${wkColor(x.u.d)}" data-u="${x.u.d}|${x.u.s}" title="${A.esc(x.name)} · ${md(x.u.d)} 토요근무 대체휴무">${A.esc(x.name)}</span>`;
      const nm = x.s ? x.s.name : '?';
      return `<span class="lc${x.l.t ? ' tr' : ''}${isMgr(nm) ? ' mgr' : ''}${x.l.h ? ' half' : ''}" data-l="${x.l.id}" title="${A.esc(nm)} ${md(x.l.d1)}${x.l.d2 !== x.l.d1 ? '~' + md(x.l.d2) : ''} ${A.esc(x.l.r || '')}">${A.esc(nm)}${x.l.t ? '<small>(훈)</small>' : ''}${x.l.h ? '<small>' + x.l.h + '</small>' : ''}</span>`;
    };
    let html = `<div class="lvlegend"><span class="lc">연차</span><span class="lc tr">이름(훈) 훈련</span><span class="lc half">반차</span><span class="lc mgr">매니저</span>
      ${tsat.map((s, i) => `<span class="lc alt" style="background:${LC.WEEK_COLORS[i]}">${md(s)} 토요 → 대체휴무</span>`).join('')}
      ${d.canEdit ? '<span class="muted">· 날짜 칸을 누르거나 <b>끌어서</b> 기간을 고르면 연차 등록 · 이름을 누르면 수정</span>' : '<span class="muted">· 이름을 누르면 사유가 보입니다</span>'}</div>
      <div class="lvcal"><div class="lvhd">${['월', '화', '수', '목', '금', '토'].map(w => `<div class="${w === '토' ? 'sat' : ''}">${w}요일</div>`).join('')}</div>`;
    weeks.forEach(days => {

    body().innerHTML = html;
    A.$$('.lvcal .lc[data-l]').forEach(el => (el.onclick = ev => { ev.stopPropagation(); const l = d.leaves.find(x => x.id === el.dataset.l); if (l) leaveModal({ edit: l }); }));
    A.$$('.lvcal .lc[data-u]').forEach(el => (el.onclick = ev => { ev.stopPropagation(); const [sd, sid] = el.dataset.u.split('|'); A.toast((staffById(sid) || {}).name + ' : ' + mdw(sd) + ' 토요근무 → ' + mdw(el.closest('[data-d]').dataset.d) + ' 대체휴무'); }));
    A.$$('.lvcal [data-sat]').forEach(el => (el.onclick = () => { if (d.all) { L.tab = 'sat'; L.satFocus = el.dataset.sat; draw(); } }));
    if (d.canEdit) bindDrag();
  }
  function bindDrag() {
    const cells = A.$$('.lvcal .lvd[data-d]');
    const paint = () => { const [a, b] = L.drag ? [L.drag.a, L.drag.b].sort() : ['', '']; cells.forEach(c => c.classList.toggle('selc', !!L.drag && c.dataset.d >= a && c.dataset.d <= b)); };
    cells.forEach(c => {
      c.onmousedown = ev => { if (ev.button !== 0 || ev.target.closest('.lc')) return; ev.preventDefault(); L.drag = { a: c.dataset.d, b: c.dataset.d }; paint(); };

    });
    document.onmouseup = () => { if (!L.drag) return; const [a, b] = [L.drag.a, L.drag.b].sort(); L.drag = null; paint(); if (A.$('.lvcal')) leaveModal({ d1: a, d2: b }); };
  }

  // ------------------------------------------------------------ 연차 등록·수정 창

        <div style="margin:8px 0 4px" class="muted">사유</div><div>${A.esc(ed.r || '-')}</div>
        <div class="muted" style="margin-top:10px;font-size:12px">입력: ${A.esc(ed.by || '')} ${A.esc(ed.at || '')}</div>

      </div>

      <label class="lvchk"><input type="checkbox" id="lvtr" ${ed && ed.t ? 'checked' : ''}> 훈련 (달력에 <b>이름(훈)</b> 으로 표시)</label>
      <div id="lvinfo" class="lvinfo"></div>
      <div class="acts" style="justify-content:space-between"><div>${ed ? '<button class="danger" data-del>삭제</button>' : ''}</div><div style="display:flex;gap:8px"><button data-n>취소</button><button class="primary" data-y>저장</button></div></div>`, (bg, close) => {
      const $ = s => A.$(s, bg);
      const drawPick = () => {
        $('#lvpk').innerHTML = picked.map(id => { const s = staffById(id) || {}; return `<span class="lc big">${A.esc(s.name || '?')} <small>${A.esc(s.grp || '')}</small>${ed ? '' : `<b data-rm="${id}">✕</b>`}</span>`; }).join('') || '<span class="muted">이름을 입력하세요</span>';
        A.$$('[data-rm]', bg).forEach(x => (x.onclick = () => { picked.splice(picked.indexOf(x.dataset.rm), 1); drawPick(); info(); }));
      };
      const addName = () => {
        const v = $('#lvnm').value.trim(); if (!v) return;
        let hit = S.filter(s => s.name === v);
        if (!hit.length && /그룹$|^(라인|제조|안정화|지원|출력|영상)$/.test(v)) hit = S.filter(s => s.grp === v && s.roster);   // 그룹 이름이면 그 그룹 전체

        if (hit.length !== 1 && !hit.every(s => s.grp === v)) { A.toast(hit.length ? '여러 명이 맞습니다. 목록에서 고르세요' : '없는 이름입니다 (인원·설정에서 먼저 추가)', true); return; }
        hit.forEach(s => { if (!picked.includes(s.id)) picked.push(s.id); });
        $('#lvnm').value = ''; drawPick(); info();
      };

      A.$$('[data-q]', bg).forEach(b => (b.onclick = () => { $('#lvr').value = b.dataset.q; if (/훈련/.test(b.dataset.q)) $('#lvtr').checked = true; info(); }));

        const n = LC.leaveDays({ d1, d2, h: h.value }, L.ix.H); let hol = 0, msgs = [];
        for (let x = d1; x <= d2; x = LC.addDays(x, 1)) {
          if (L.ix.H[x] && LC.dow(x) >= 1 && LC.dow(x) <= 5) hol++;
          if (!LC.isWork(x, L.ix.H)) continue;
          const cap = capOf(x), cnt = LC.dayCell(L.ix, x).off + picked.filter(id => !(ed && id === ed.s && x >= ed.d1 && x <= ed.d2)).length;
          if (cap && cnt > cap) msgs.push(mdw(x) + ' 휴무 ' + cnt + '명 (상한 ' + cap + '명)');

        const satHit = []; picked.forEach(id => (d.duty || []).forEach(u => { if (u.s === id && u.a && u.a >= d1 && u.a <= d2) satHit.push((staffById(id) || {}).name + ' ' + md(u.a) + ' 대체휴무'); }));
        $('#lvinfo').innerHTML = `<b>평일 ${n}일</b>${hol ? ' <span class="muted">(공휴일 ' + hol + '일 제외)</span>' : ''}${picked.length > 1 ? ' × ' + picked.length + '명' : ''}` +
          (msgs.length ? `<div class="lvw">⚠ 요일별 상한 초과 — 그대로 저장되며 달력에 빨갛게 표시됩니다<br>${msgs.join(' · ')}</div>` : '') +
          (dup.length ? `<div class="lvw">⚠ 이미 등록된 연차와 겹침 : ${A.esc(dup.join(', '))}</div>` : '') +
          (satHit.length ? `<div class="lvw">⚠ 같은 날 대체휴무 : ${A.esc(satHit.join(', '))}</div>` : '');
      };
      ['#lvd1', '#lvd2', '#lvh'].forEach(s => ($(s).onchange = () => { if (s === '#lvd1' && $('#lvd2').value < $('#lvd1').value) $('#lvd2').value = $('#lvd1').value; info(); }));
      drawPick(); info();
      $('[data-n]').onclick = close;
      $('[data-y]').onclick = async () => {
        if (!ed && $('#lvnm').value.trim()) addName();

        const req = { d1: $('#lvd1').value, d2: $('#lvd2').value, half: $('#lvh').value, reason: $('#lvr').value.trim(), train: $('#lvtr').checked };

          const r = ed ? await A.api('lvSaveLeave', Object.assign(req, { id: ed.id, staffId: ed.s })) : await A.api('lvSaveLeave', Object.assign(req, { staffIds: picked }));
          if (ed) d.leaves = d.leaves.filter(x => x.id !== ed.id);
          d.leaves = d.leaves.concat(r.leaves); reindex(); close(); A.toast((ed ? '수정' : r.leaves.length + '명 등록') + ' 완료'); draw();
        } catch (e) { A.toast(e.message, true); }

        try { await A.api('lvDelLeave', { id: ed.id }); d.leaves = d.leaves.filter(x => x.id !== ed.id); reindex(); close(); A.toast('삭제했습니다'); draw(); } catch (e) { A.toast(e.message, true); }

  }

  // ------------------------------------------------------------ 사유 기록부 (엑셀 V~AM 과 같은 3구역)
  function drawRec() {
    const d = D(), f = LC.monthFirst(L.ym), l = LC.monthLast(L.ym), H = L.ix.H;

    const satCnt = {}; LC.monthSaturdays(L.ym).forEach(sd => (L.ix.duty[sd] || []).forEach(u => (satCnt[u.s] = (satCnt[u.s] || 0) + 1)));
    const Z = [[], [], []];
    d.leaves.filter(x => x.d2 >= f && x.d1 <= l).forEach(x => { const s = staffById(x.s); if (s) Z[zone(s)].push({ x, s }); });
    const q = (L.recQ || '').trim();

  const cumScore = (weeks) => { const sc = {}, y = weeks[0] ? weeks[0].slice(0, 4) : String(L.year); (D().duty || []).forEach(u => { if (!weeks.includes(u.d) && u.d.slice(0, 4) === y) sc[u.s] = (sc[u.s] || 0) + 1; }); return sc; };

      }

    };
    const col = w => {
      const list = (L.ix.duty[w] || []);
      return `<div class="card lvsc${L.satFocus === w ? ' focus' : ''}" data-w="${w}"><div class="lvst"><b>${mdw(w)}</b> <span class="muted">${list.length}명</span>
        ${can ? `<span style="flex:1"></span><button data-re="${w}" title="이 주만 규칙대로 다시 뽑기">다시 뽑기</button><button data-clr="${w}">비우기</button>` : ''}</div>
        <div class="lvsl">${list.map(u => { const s = staffById(u.s) || {}, n = cnt[u.s] || 0; return `<div class="lvsr" data-s="${u.s}"><span class="gb g-${A.esc(s.grade || '')}">${A.esc(s.grade || '-')}</span>

          ${can ? `<select class="alt" data-w="${w}" data-s="${u.s}">${altOpts(w, u.a)}</select><b class="x" data-w="${w}" data-s="${u.s}">✕</b>` : (u.a ? `<span class="muted">→ ${mdw(u.a)}</span>` : '')}</div>`; }).join('') || '<div class="muted" style="padding:10px">비어 있음</div>'}</div>
        ${can ? `<div class="lvsa"><input list="lvsn" data-add="${w}" placeholder="+ 이름 추가 (매니저·번외 등)"></div>` : ''}</div>`;
    };
    const around = []; for (let k = -1; k <= LC.monthSaturdays(L.ym).length; k++) { const base = LC.monthSaturdays(L.ym)[0] || LC.monthFirst(L.ym); around.push(LC.addDays(base, 7 * k)); }
    body().innerHTML = `
      <div class="toolbar">
        <b>배정 묶음 (${ymLab(L.ym)})</b>${around.map(s => `<label class="lvchk sm"><input type="checkbox" data-bd="${s}" ${weeks.includes(s) ? 'checked' : ''} ${can ? '' : 'disabled'}> ${md(s)}</label>`).join('')}
        <span style="flex:1"></span>
        ${can ? '<button class="primary" id="lvaN">빈 주 자동 배정</button><button id="lvaA">전체 다시 배정</button>' : ''}

      <div class="lvsum">D 위 인원 <b>${sm.doneUp} / ${sm.nUp}</b>명 배정${sm.nUp - sm.doneUp > 0 ? ' <span class="muted">(미배정 ' + (sm.nUp - sm.doneUp) + '명 → 다음 달 우선)</span>' : ''} · D등급 ${sm.doneD}명 · 등급별 ${Object.entries(sm.byGrade).map(([k, v]) => k + ' ' + v).join(' · ')}
        <span class="muted"> · 이름 색 : <b class="c2">2회</b> <b class="c3">3회 이상</b> · 주당 구성 ${((kv().slots || []).filter(Boolean)).length}칸</span></div>
      <div class="lvsg">${weeks.map(col).join('') || '<div class="warn">배정 묶음에 토요일이 없습니다. 위에서 토요일을 고르세요.</div>'}</div>
      <datalist id="lvsn">${staffList().map(s => `<option value="${A.esc(s.name)}">${A.esc(s.grade || '')} ${A.esc(s.grp || '')}</option>`).join('')}</datalist>`;
    if (!can) return;
    const save = async ws => {
      const days = ws.map(w => ({ d: w, list: (L.ix.duty[w] || []).map(u => ({ s: u.s, a: u.a || '' })) }));
      try { await A.api('lvSetDuty', { days }); } catch (e) { A.toast(e.message, true); await load(L.year, true); }
      drawSat();
    };
    const setList = (w, ids, keepAlt) => {
      const old = {}; (L.ix.duty[w] || []).forEach(u => (old[u.s] = u.a));
      d.duty = d.duty.filter(u => u.d !== w).concat(ids.map((id, i) => ({ d: w, s: id, o: i, a: keepAlt ? old[id] || null : null })));
      reindex();
    };
    A.$$('[data-bd]').forEach(c => (c.onchange = async () => {
      const set = new Set(weeks); if (c.checked) set.add(c.dataset.bd); else set.delete(c.dataset.bd);
      const b = Object.assign({}, kv().batches || {}); b[L.ym] = [...set].sort();
      try { await A.api('lvSetKv', { k: 'batches', v: b }); d.kv.batches = b; drawSat(); } catch (e) { A.toast(e.message, true); }
    }));
    const run = async all => {
      const lists = Object.fromEntries(weeks.map(w => [w, all ? [] : (L.ix.duty[w] || []).map(u => u.s)]));
      const as = LC.makeAssigner({ roster, slots: kv().slots || [], weeks, lists, score: cumScore(weeks) });
      const todo = all ? weeks : weeks.filter(w => !lists[w].length);
      if (!todo.length) return A.toast('빈 주가 없습니다. [전체 다시 배정] 또는 주별 [다시 뽑기]를 쓰세요', true);
      if (!(await A.confirmBox((all ? '이 묶음의 <b>모든 주를 지우고</b> 처음부터 다시 뽑습니다.' : '빈 주 ' + todo.length + '개를 배정합니다.') + '<br><span class="muted">등급 균등 · 그룹 균형 · 올해 누적 낮은 사람 우선 · 파트장 1회 보장 · D등급은 남는 칸 (원본 매크로 규칙)</span>', '배정'))) return;
      const res = todo.map(w => as.assignOne(w));
      todo.forEach(w => setList(w, as.lists[w], false));
      const short = res.filter(r => r.short.length);
      A.toast(todo.length + '주 배정' + (short.length ? ' · 후보 부족 ' + short.map(r => md(r.week)).join(',') : ''), !!short.length);
      await save(todo);
    };
    A.$('#lvaN').onclick = () => run(false); A.$('#lvaA').onclick = () => run(true);
    A.$$('[data-re]').forEach(b => (b.onclick = async () => {
      const w = b.dataset.re;
      if ((L.ix.duty[w] || []).length && !(await A.confirmBox(mdw(w) + ' 명단을 지우고 다시 뽑습니다.<br><span class="muted">직접 넣은 사람과 대체휴무도 지워집니다.</span>', '다시 뽑기'))) return;
      const as = LC.makeAssigner({ roster, slots: kv().slots || [], weeks, lists: Object.fromEntries(weeks.map(x => [x, (L.ix.duty[x] || []).map(u => u.s)])), score: cumScore(weeks) });
      const r = as.assignOne(w); setList(w, as.lists[w], false);
      if (r.short.length) A.toast('후보 부족 : ' + r.short.join(','), true);
      await save([w]);
    }));
    A.$$('[data-clr]').forEach(b => (b.onclick = async () => { if (!(await A.confirmBox(mdw(b.dataset.clr) + ' 명단을 모두 지울까요?', '비우기'))) return; setList(b.dataset.clr, [], false); await save([b.dataset.clr]); }));
    A.$$('.lvsr .x').forEach(x => (x.onclick = async () => { const w = x.dataset.w; setList(w, (L.ix.duty[w] || []).map(u => u.s).filter(id => id !== x.dataset.s), true); await save([w]); }));
    A.$$('select.alt').forEach(sel => (sel.onchange = async () => {
      const u = (L.ix.duty[sel.dataset.w] || []).find(x => x.s === sel.dataset.s); if (!u) return;
      u.a = sel.value || null;
      const lv = sel.value && d.leaves.find(l => l.s === u.s && l.d1 <= sel.value && l.d2 >= sel.value);
      if (lv) A.toast('같은 날 연차가 이미 있습니다 (' + md(lv.d1) + ')', true);
      reindex(); await save([sel.dataset.w]);
    }));
    A.$$('[data-add]').forEach(inp => {
      const add = async () => {
        const w = inp.dataset.add, s = d.staff.find(x => x.name === inp.value.trim()); if (!s) return;
        const ids = (L.ix.duty[w] || []).map(u => u.s);
        if (ids.includes(s.id)) { A.toast('이미 있습니다', true); inp.value = ''; return; }
        if (weeks.some(x => x !== w && (L.ix.duty[x] || []).some(u => u.s === s.id))) A.toast(s.name + ' : 이 묶음에 이미 다른 주가 있습니다 (2회)', true);
        setList(w, ids.concat(s.id), true); await save([w]);
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') add(); }); inp.addEventListener('change', add);
    });
  }

  // ------------------------------------------------------------ 개인별 합계 (올해)
  function drawSum() {
    const d = D(), y = String(L.year), f = y + '-01-01', l = y + '-12-31', H = L.ix.H;
    const rows = staffList().map(s => {
      const lv = d.leaves.filter(x => x.s === s.id && x.d2 >= f && x.d1 <= l);
      const days = lv.filter(x => !x.t).reduce((a, x) => a + LC.leaveDays(x, H, f, l), 0);
      const tr = lv.filter(x => x.t).reduce((a, x) => a + LC.leaveDays(x, H, f, l), 0);
      const du = (d.duty || []).filter(u => u.s === s.id && u.d.slice(0, 4) === y);
      return { s, days, half: lv.filter(x => x.h).length, tr, sat: du.length, alt: du.filter(u => u.a).length, grant: s.grant, rem: s.grant != null ? s.grant - days : null, n: lv.length };
    }).filter(r => d.all ? (r.s.roster || r.n || r.sat) : true);
    const k = L.sumSort || 'name';
    const SK = { name: r => r.s.name, grp: r => (r.s.grp || '') + r.s.name, days: r => -r.days, sat: r => -r.sat, rem: r => r.rem == null ? 1e9 : r.rem };

      ${rows.map(r => `<tr class="click" data-s="${r.s.id}"><td><b>${A.esc(r.s.name)}</b></td><td>${A.esc(r.s.grp || '')}</td><td>${A.esc(r.s.grade || '')}</td><td class="num"><b>${r.days || ''}</b></td><td class="num">${r.half || ''}</td><td class="num">${r.tr || ''}</td><td class="num">${r.sat || ''}</td><td class="num">${r.alt || ''}</td><td class="num">${r.grant == null ? '' : r.grant}</td><td class="num ${r.rem != null && r.rem < 0 ? 'red' : ''}">${r.rem == null ? '' : r.rem}</td></tr>`).join('')}
      </tbody></table></div>`;
    A.$$('.lvsum2 th.sort').forEach(h => (h.onclick = () => { L.sumSort = h.dataset.k; drawSum(); }));
    A.$$('.lvsum2 tr[data-s]').forEach(tr => (tr.onclick = () => {
      const s = staffById(tr.dataset.s), lv = d.leaves.filter(x => x.s === s.id && x.d2 >= f && x.d1 <= l).sort((a, b) => LC.ko(a.d1, b.d1));
      const du = (d.duty || []).filter(u => u.s === s.id && u.d.slice(0, 4) === y);
      A.modal(`<h3>${A.esc(s.name)} <span class="muted" style="font-size:13px">${y}년</span></h3>
        <div style="max-height:60vh;overflow:auto"><table class="list"><thead><tr><th>기간</th><th class="num">일수</th><th>사유</th></tr></thead><tbody>
        ${lv.map(x => `<tr class="click" data-l="${x.id}"><td>${mdw(x.d1)}${x.d2 !== x.d1 ? ' ~ ' + mdw(x.d2) : ''}${x.h ? ' ' + x.h : ''}${x.t ? ' (훈)' : ''}</td><td class="num">${LC.leaveDays(x, H, f, l)}</td><td>${A.esc(x.r || '')}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">연차 없음</td></tr>'}</tbody></table>
        <div style="margin-top:10px"><b>토요근무 ${du.length}회</b> <span class="muted">${du.map(u => md(u.d) + (u.a ? '→' + md(u.a) : '')).join(' · ')}</span></div></div>

          <div style="max-height:calc(100vh - 330px);overflow:auto"><table class="list lvst2"><thead><tr><th>이름</th><th>그룹</th><th>직책</th><th>등급</th><th>토요제외</th><th>토요명단</th><th>상태</th><th>부여일수</th><th>사번</th><th>직급</th><th>레벨</th><th>세부직무</th><th>순번</th><th></th></tr></thead>
          <tbody>${list.map(row).join('')}</tbody></table></div>

            <div class="row" style="gap:8px;margin-top:8px">${['월', '화', '수', '목', '금'].map((w, i) => `<label class="fld"><span>${w}</span><input class="capi w4" data-w="${i + 1}" value="${caps[i + 1] || ''}" inputmode="numeric"></label>`).join('')}<button id="lvcap">저장</button></div></div>

          <div class="card"><b>매니저 표시 명단</b> <span class="muted">(파란 글씨 · 엑셀 AZ열)</span>

            <div class="lvhol">${hol.map((h, i) => `<span class="lc big">${md(h.d)} ${A.esc(h.n)} <b data-hd="${h.d}">✕</b></span>`).join('')}</div>

    };
  }

  // ------------------------------------------------------------ 엑셀 내보내기 (원본 양식)
  async function exportXlsx() {
    const d = D(), y = String(L.year), months = new Set();
    d.leaves.forEach(x => { for (let t = x.d1; t <= x.d2; t = LC.addDays(t, 1)) if (t.slice(0, 4) === y) months.add(LC.ymOf(t)); });
    (d.duty || []).forEach(u => { if (u.d.slice(0, 4) === y) months.add(LC.ymOf(u.d)); });
    if (A.S.today.slice(0, 4) === y) months.add(A.S.today.slice(0, 7));
    if (!months.size) return A.toast('내보낼 자료가 없습니다', true);
    const sorted = [...months].sort(), list = []; for (let m = sorted[0]; m <= sorted[sorted.length - 1]; m = nextYm(m, 1)) list.push(m);
    const bym = Object.keys(kv().batches || {}).filter(k => k.slice(0, 4) === y).sort().pop() || L.ym;
    try {
      A.toast('엑셀 만드는 중…');
      const r = await LC.buildXlsx(JSZip, LEAVE_TPL_B64, { year: L.year, months: list, staff: d.staff, leaves: d.leaves, duty: d.duty, kv: d.kv, batchYm: bym });
      const blob = await r.zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      A.saveBlob(blob, y.slice(2) + '년 연차관리.xlsx');
      A.toast(list.length + '개월 엑셀을 받았습니다' + (r.warn.length ? ' · 칸 부족 ' + r.warn.length + '건(엑셀 칸 수 한계)' : ''));
      if (r.warn.length) console.warn('[연차 엑셀] 칸 부족', r.warn);
    } catch (e) { A.toast('엑셀 만들기 실패 : ' + e.message, true); }
  }

  // ------------------------------------------------------------ 원본 엑셀 가져오기
  function importXlsx() {
    const fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.xlsm,.xlsx';
    fi.onchange = async () => {
      const f = fi.files[0]; if (!f) return;
      let p; try { p = await LC.parseWorkbook(JSZip, await f.arrayBuffer()); } catch (e) { return A.toast('읽기 실패 : ' + e.message, true); }
      const co = p.info.calOnly;
      A.modal(`<h3>원본 엑셀 가져오기</h3><div class="muted">${A.esc(f.name)}</div>
        <table class="list" style="margin:10px 0"><tbody>
          <tr><td>월 시트</td><td><b>${p.info.months.length}개</b> <span class="muted">${p.info.months.map(m => +m.slice(5) + '월').join(', ')}</span></td></tr>
          <tr><td>인원</td><td><b>${p.staff.length}명</b> <span class="muted">(토요 명단 ${p.info.roster}명 · 등급·사번·그룹 포함)</span></td></tr>
          <tr><td>연차 기록</td><td><b>${p.leaves.length}건</b> <span class="muted">(사유 기록부 기준, 월이 겹친 중복 제거)</span></td></tr>
          <tr><td>토요근무</td><td><b>${p.duty.length}건</b> <span class="muted">(토요일 ${new Set(p.duty.map(u => u.d)).size}개 · 대체휴무 ${p.duty.filter(u => u.a).length}건)</span></td></tr>
          <tr><td>설정</td><td>주당 구성표 ${p.kv.slots.filter(Boolean).length}칸 · 매니저 ${p.kv.managers.length}명${Object.keys(p.kv.batches).length ? ' · 배정 묶음 ' + Object.keys(p.kv.batches).join(',') : ''}</td></tr>
        </tbody></table>
        ${co.length ? `<label class="lvchk"><input type="checkbox" id="lvco" checked> 기록부에는 없고 <b>달력에만 적힌 ${co.length}건</b>도 연차로 넣기 <span class="muted">(사유 "달력 직접 입력")</span></label><div class="muted" style="font-size:12px;margin:2px 0 8px">${A.esc(co.slice(0, 12).map(x => md(x.d) + ' ' + x.name).join(' · '))}${co.length > 12 ? ' …' : ''}</div>` : ''}
        ${p.info.warn.length ? `<div class="warn" style="font-size:12px">${A.esc(p.info.warn.slice(0, 6).join(' / '))}${p.info.warn.length > 6 ? ' …' : ''}</div>` : ''}
        <div class="warn">⚠ 지금 웹에 있는 <b>연차·토요 자료가 모두 이 파일 내용으로 바뀝니다.</b> (업무데이터는 그대로)<br>계속하려면 아래에 <b>가져오기</b> 를 입력하세요.</div>
        <input id="lvcf" placeholder="가져오기"><div class="acts"><button data-n>취소</button><button class="primary" data-y>가져오기</button></div>`, (bg, close) => {
        A.$('[data-n]', bg).onclick = close;
        A.$('[data-y]', bg).onclick = async () => {
          const leaves = p.leaves.slice();
          if (A.$('#lvco', bg) && A.$('#lvco', bg).checked) co.forEach(x => { const s = p.staff.find(z => z.name === x.name); if (s) leaves.push({ s: s.id, d1: x.d, d2: x.d, r: '달력 직접 입력', h: '', t: x.train }); });
          const kv2 = { slots: p.kv.slots, managers: p.kv.managers, batches: p.kv.batches };
          try {
            const r = await A.api('lvImport', { confirm: A.$('#lvcf', bg).value.trim(), data: { staff: p.staff, leaves, duty: p.duty, kv: kv2 } });
            close(); A.toast('가져오기 완료 : 인원 ' + r.staff + ' · 연차 ' + r.leaves + ' · 토요 ' + r.duty);
            L.ym = p.info.months[p.info.months.length - 1]; L.data = null; render(L.main);
          } catch (e) { A.toast(e.message, true); }
        };
      }, 'md');
    };
    fi.click();
  }

  window.Leave = { init, render, reset: () => { L.data = null; L.year = null; } };
})();
</script>

    const el = $('#perf'); if (!el || !S.me || S.me.role !== '관리자') return;
    el.textContent = '응답 ' + (ms / 1000).toFixed(2) + '초' + (sms != null ? ' (서버 ' + (sms / 1000).toFixed(2) + ')' : '') + ' · ' + action;
  }
  async function api(action, data) {
    if (!SB_URL || SB_URL.indexOf('__') === 0) throw new Error('설치가 끝나지 않았습니다: index.html 의 SB_URL / SB_KEY 를 설정하세요');
    const body = JSON.stringify({ req: Object.assign({ action, token: S.token }, data || {}) });
    const tries = SAFE_RETRY.has(action) ? 3 : 1;
    let res = null, last = '', fatal = '';
    for (let t = 0; t < tries && !res && !fatal; t++) {
      if (t) await new Promise(r => setTimeout(r, 600 * t + Math.random() * 400));
      const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 20000), t0 = performance.now();
      try {
        const r = await fetch(SB_URL + '/rest/v1/rpc/api', { method: 'POST', headers: API_HEADERS(), body, signal: ac.signal });
        const txt = await r.text(); let j = null;
        try { j = JSON.parse(txt); } catch (e) { }
        if (r.ok && j && typeof j === 'object' && 'ok' in j) { res = j; perf(action, performance.now() - t0, j._ms); }
        else if (r.status === 401 || r.status === 403) fatal = '서버 접속 키가 맞지 않습니다 (index.html 의 SB_KEY 확인)';
        else if (r.status === 404) fatal = '서버 기능이 설치되지 않았습니다 (Supabase SQL 설치 확인)';
        else { last = 'server'; console.warn('[업무데이터] 서버 응답 오류', r.status, txt.slice(0, 300)); }
      } catch (e) { last = navigator.onLine === false ? 'offline' : e.name === 'AbortError' ? 'timeout' : 'net'; console.warn('[업무데이터] 연결 오류', e); }
      finally { clearTimeout(tm); }
    }
    if (fatal) throw new Error(fatal);
    if (!res) {
      if (last === 'offline') throw new Error('인터넷이 끊겼습니다. 연결을 확인해 주세요');
      if (tries === 1) throw new Error('서버 연결이 잠시 불안정합니다. 결과를 확인한 뒤 다시 눌러주세요');
      throw new Error('서버 연결이 잠시 불안정합니다 (자동 재시도 ' + tries + '회 실패). 잠시 후 다시 해주세요');
    }
    if (!res.ok) {
      if (/로그인이 (필요|만료)/.test(res.msg || '')) {
        // 로그인 만료 때 저장 못 한 입력은 잠시 보관했다가 다시 로그인하면 복구
        try { if (S.dirty && S.day && S.day.canEdit) sessionStorage.setItem('pending', JSON.stringify({ uid: who().id, date: S.date, doc: S.day.doc })); } catch (e) { }
        logout(true);
      }
      throw new Error(res.msg || '오류');

    return res;
  }

  function impStatus(x, all, existing) {
    if (!x.date) return { k: 'bad', t: '날짜 확인 필요', dis: true };
    if (!periodOf(x.date)) return { k: 'bad', t: '월 기간 없음', dis: true };
    if (all.filter(y => y.date === x.date).length > 1) return { k: 'warn', t: '날짜 중복', dis: false, off: true };
    if (x.date > S.today) return { k: 'warn', t: '미래 날짜 — 시트 이름 확인', dis: false, off: true };
    if (existing.has(x.date)) return { k: 'warn', t: '이미 웹에 있음', dis: false, off: true, exist: true };
    return { k: 'ok', t: '새로 넣음', dis: false };
  }
  function matchUser(fname, users) {
    const base = fname.replace(/\.[^.]+$/, '').replace(/\s+/g, '');
    let best = [], len = 0;
    users.forEach(u => { const n = u.name.replace(/\s+/g, ''); if (n && base.indexOf(n) >= 0) { if (n.length > len) { best = [u]; len = n.length; } else if (n.length === len) best.push(u); } });
    return best.length === 1 ? best[0] : null;
  }
  async function existingFor(uid, items) {
    const ds = items.map(x => x.date).filter(Boolean).sort();
    if (!ds.length || !uid) return new Set();
    const en = ds[ds.length - 1], st = ds[0] < C.addDays(en, -85) ? C.addDays(en, -85) : ds[0];
    return new Set((await api('listDates', { userId: uid, start: st, end: en })).dates);
  }
  function bulkImport() {

      const close = modal('<h3>📥 여러 명 엑셀 가져오기</h3><div id="banal" class="muted">파일 분석 중… 0/' + files.length + '</div>', null, 'wide');
      const list = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i], el = $('#banal'); if (el) el.textContent = '파일 분석 중… ' + (i + 1) + '/' + files.length + ' ' + f.name;
        const it = { file: f.name, user: matchUser(f.name, users), items: [], existing: new Set(), err: '' };
        try { it.items = (await C.parseWorkbook(JSZip, await f.arrayBuffer(), S.today)).sort((a, b) => (a.date || '9') < (b.date || '9') ? -1 : 1); if (!it.items.length) it.err = '날짜 시트 없음'; }
        catch (e) { it.err = '파일을 읽지 못함'; }
        if (it.user && !it.err) { try { it.existing = await existingFor(it.user.id, it.items); } catch (e) { it.err = e.message; } }
        list.push(it);

      close(); showBulk(list, users);

    fi.click();

    modal(`<h3>📥 엑셀 가져오기 — ${esc(u.name)} (${esc(u.group)})</h3>
      <div class="muted" style="margin-bottom:8px">${esc(fname)} · 날짜 시트 ${items.length}개 · 체크한 날짜만 저장됩니다. 날짜가 틀리면 직접 고칠 수 있습니다.</div>
      <div style="max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px">

      <div class="row" style="margin-top:10px"><span class="muted" id="icnt"></span><span style="flex:1"></span><span class="progress hide" id="ipg"><i></i></span><span class="muted" id="ipt"></span></div>
      <div class="acts"><button data-c>닫기</button><button class="primary" data-s>가져오기</button></div>`, (bg, close) => {

            }

          };
        });
      };
      bind(); cnt();
      $('#iall', bg).onchange = e => { items.forEach(x => { if (!st(x, items).dis) x.on = e.target.checked; }); $('#ibody', bg).innerHTML = rowsHtml(); bind(); cnt(); };
      $('[data-c]', bg).onclick = () => { close(); loadDay(S.date); };
      $('[data-s]', bg).onclick = async () => {
        const sel = items.filter(x => x.on && x.date);

        const dup = sel.map(x => x.date).filter((d, i, a) => a.indexOf(d) !== i);

          try { await api('saveDay', { userId: u.id, date: x.date, doc: x.doc, sum: C.daySummary(x.doc, minsOf(x.date)) }); ok++; existing.add(x.date); x.on = false; }
          catch (e) { fails.push(dLabel(x.date) + ': ' + e.message); }

        $('#ibody', bg).innerHTML = rowsHtml(); bind(); cnt(); btn.disabled = false;
        if (fails.length) toast('일부 실패: ' + fails[0], true); else toast(ok + '일을 가져왔습니다');

  // ---- 숫자 선택판 (클릭으로 숫자 고르기, 직접 입력도 가능) ----
  let padFor = null, padHold = false, padBig = false;
  function showPad(inp) {
    const np = $('#np'); padFor = inp;
    const isQ = inp.dataset.f === 'q';
    const label = isQ ? '수량' : (C.COL[inp.dataset.n].label.replace('\n', '') + ' 개수');
    const max = padBig ? 50 : 20, cur = String(inp.value);
    let h = '<div class="t"><b>' + esc(label) + '</b><span>클릭 또는 숫자 입력</span></div><div class="gp">';
    for (let k = 1; k <= max; k++) h += '<button data-v="' + k + '" class="' + (String(k) === cur ? 'cur' : '') + '">' + k + '</button>';
    h += '<button class="clr" data-v="">지우기</button><button class="more" data-more>' + (padBig ? '1~20만 보기' : '21~50 더보기') + '</button></div>';
    np.innerHTML = h;
    const r = inp.getBoundingClientRect();
    np.classList.add('show');
    const ph = np.offsetHeight, pw = np.offsetWidth;
    let top = r.bottom + 2; if (top + ph > window.innerHeight - 6) top = r.top - ph - 2;
    let left = r.left; if (left + pw > window.innerWidth - 6) left = window.innerWidth - pw - 6;
    np.style.top = top + 'px'; np.style.left = left + 'px';
  }
  function hidePad() { $('#np').classList.remove('show'); padFor = null; }
  (function initPad() {
    const np = $('#np');
    np.addEventListener('mousedown', e => { padHold = true; e.preventDefault(); });
    np.addEventListener('mouseup', () => setTimeout(() => (padHold = false), 0));
    np.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || !padFor) return;
      if (b.hasAttribute('data-more')) { padBig = !padBig; return showPad(padFor); }
      const inp = padFor;
      inp.value = b.dataset.v;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      hidePad(); inp.blur();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePad(); });
    document.addEventListener('scroll', () => padFor && document.activeElement === padFor && showPad(padFor), true);
  })();

  // ---- 제목 칸 설명 말풍선 ----
  (function initTip() {
    document.addEventListener('mouseover', e => {
      const th = e.target.closest && e.target.closest('th[data-tip]'), tp = $('#tip');
      if (!th) { tp.classList.remove('show'); return; }
      tp.innerHTML = th.dataset.tip; tp.classList.add('show');
      const r = th.getBoundingClientRect(), w = tp.offsetWidth;
      let left = r.left + r.width / 2 - w / 2; left = Math.max(6, Math.min(left, window.innerWidth - w - 6));
      tp.style.left = left + 'px'; tp.style.top = (r.bottom + 6) + 'px';
    });
  })();
  function colIdx(c) { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; }

  function onGridInput(e) {
    const t = e.target, tr = t.closest('tr'); if (!tr) return;
    const r = S.day.doc.rows[+tr.dataset.i];
    if (t.dataset.f === 'q') { r.q = t.value.trim() === '' ? '' : C.num(t.value); }
    else if (t.dataset.f === 'memo') { r.memo = t.value; tr.querySelector('td.o').classList.toggle('memo', !!t.value); }
    else if (t.dataset.f === 'o') { r.o = t.value; }
    else if (t.dataset.n) {
      if (!String(r.o).trim() && t.value) { toast('주문번호부터 입력하세요', true); t.value = ''; return; }
      const v = C.num(t.value); if (v) r.m[t.dataset.n] = v; else delete r.m[t.dataset.n];
      t.parentNode.classList.toggle('on', !!v);
    }
    changed();
  }
  function onGridChange(e) {
    const t = e.target; if (t.dataset.f !== 'o') return;
    const tr = t.closest('tr'), r = S.day.doc.rows[+tr.dataset.i];
    const v = C.normOrder(t.value); t.value = v; r.o = v;
    const q = tr.querySelector('input[data-f="q"]');
    if (v && (r.q === '' || r.q == null)) { r.q = 1; q.value = 1; }
    if (!v) { if (r.q !== '' || Object.keys(r.m).length) clearRow(+tr.dataset.i, true); }
    changed();
  }
  function toggle(td) {
    const tr = td.closest('tr'), i = +tr.dataset.i, r = S.day.doc.rows[i], c = td.dataset.c, x = C.COL[c];
    if (!String(r.o).trim()) return toast('주문번호부터 입력하세요', true);
    if (r.q === '' || r.q == null) return toast('수량을 먼저 입력하세요', true);
    if (x.kind !== 'type' && !C.EXCLUSIVE.type.some(k => r.m[k]) && !r.m[c]) return toast('조립구분(일반~반조)을 먼저 선택하세요', true);
    if (r.m[c]) { delete r.m[c]; if (x.kind === 'type' && !C.EXCLUSIVE.type.some(k => r.m[k])) { /* 조립구분 해제 */ } }
    else {
      const ex = C.EXCLUSIVE[x.kind];
      if (ex) ex.forEach(k => { if (r.m[k]) { delete r.m[k]; const o = tr.querySelector(`td.mk[data-c="${k}"]`); o && (o.classList.remove('on'), (o.textContent = '')); } });
      r.m[c] = 1;
    }
    td.classList.toggle('on', !!r.m[c]); td.textContent = r.m[c] ? 'V' : '';
    changed();
  }
  async function clearRow(i, silent) {
    const r = S.day.doc.rows[i];
    if (!silent && (String(r.o).trim() || Object.keys(r.m).length) && !(await confirmBox((i + 1) + '번 줄의 데이터를 지울까요?', '지우기'))) return;
    S.day.doc.rows[i] = { o: '', q: '', m: {}, memo: '' };
    const tr = $(`#grid tr[data-i="${i}"]`);
    $$('input', tr).forEach(x => (x.value = ''));

    tr.querySelector('td.o').classList.remove('memo');
    changed();
  }

  function refreshCalc() {
    const D = S.day, MN = C.minsMap(minsOf(S.date)), c = C.calcDay(D.doc, D.target, MN);

      <div class="stat"><div class="k">평가 평균</div><div class="v">${f2(c.f7)}</div></div>

      <div class="stat"><div class="k">수량 (일반+특수+추천)</div><div class="v">${c.g2}</div></div>

    $('#e4').textContent = c.e4 + '분';
    $('#w7').textContent = c.w7 ? f2(c.w7) : '-';
