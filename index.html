<script>/* 인사평가 — 업무데이터 사이트 안의 메뉴 (관리자 · 담당 매니저) */
(function () {
  let A = null;
  const H = window.HRC, SLOTS = 10, num = H.num;
  const $ = s => document.querySelector(s);
  const esc = v => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const f1 = (v, d = 1) => { const n = num(v); return n === null ? '-' : (Math.round(n * 10 ** d) / 10 ** d).toString(); };
  const pct = v => { const n = num(v); return n === null ? '-' : (n * 100).toFixed(1) + '%'; };
  const dash = v => (v === null || v === undefined || v === '') ? '-' : esc(v);
  const ymLab = m => m ? m.slice(0, 4) + '년 ' + (+m.slice(5)) + '월' : '';
  const toast = (m, e) => A.toast(m, !!e);
  const TPL_B64 = typeof HR_TPL_B64 !== 'undefined' ? HR_TPL_B64 : '';
  const ST = { tab: null, month: null, part: null, data: null, sel: null, dirty: false, timer: null, meta: null, synced: {} };
  let META = null, CFG = null;
  const admin = () => !!(META && META.admin);

  function init(app) { A = app; window.addEventListener('beforeunload', e => { if (ST.dirty) { e.preventDefault(); e.returnValue = ''; } }); }

  // 엑셀 라이브러리는 인사평가에서 쓸 때만 불러옴
  const LIBS = { XLSX: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', ExcelJS: 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js' };
  function loadLib(k) {
    if (window[k]) return Promise.resolve();
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = LIBS[k]; s.onload = res; s.onerror = () => rej(new Error('엑셀 기능을 불러오지 못했습니다. 인터넷 연결 확인 후 다시 시도하세요')); document.head.appendChild(s); });
  }
  const libs = (...ks) => Promise.all(ks.map(loadLib));

  function busy(on, msg) {
    let b = $('#hrBusy');
    if (on) { if (!b) { b = document.createElement('div'); b.id = 'hrBusy'; b.className = 'hr-busy'; document.body.appendChild(b); } b.textContent = msg || '처리 중…'; }
    else if (b) b.remove();
  }
  function bigModal(html) {
    const o = document.createElement('div'); o.className = 'hr-ov hrw';
    o.innerHTML = `<div class="hr-modal"><button class="x no-print">닫기</button>${html}</div>`;
    o.addEventListener('mousedown', e => { if (e.target === o) o.remove(); });
    o.querySelector('.x').onclick = () => o.remove();
    document.body.appendChild(o);
    return o;
  }

  // ------------------------------------------------------------ 서버
  const api = (a, b) => A.api(a, b || {});
  async function getMonth(month, part) {
    const r = await api('hrMonth', { month, part: part || '' });
    const b = H.build(r);
    META = r.meta;
    return { month: r.month, part: r.part, locked: r.locked, items: b.items, list: b.list, order: H.orderRows(r.order, r.list.map(e => e.person)), rawSrc: r.rawSrc };
  }

  // 관리자 : 업무데이터(웹) → 그 달 원본으로 반영 (엑셀로 올린 달은 그대로 둠)
  async function syncWeb(month, force) {
    const p = (A.S.periods || []).find(x => x.ym === month);
    if (!p || !admin()) return null;
    const r = await api('listUsers', { ym: month });
    const C = A.C, rows = [];
    r.users.forEach(u => {
      if (!u.items.length) return;
      const m = C.calcMonth(u.items, u.target, A.minsYm(month));
      let qty = 0, conv = 0;
      u.items.forEach(it => { const s = it.sum || {}, r10 = s.r10 || {}; qty += C.num(r10.C) + C.num(r10.D) + C.num(r10.E) + C.num(r10.F) + C.num(r10.G); conv += C.sumDay(s, A.minsOf(it.date)).e2; });
      rows.push(H.webRow(u, m, qty, conv));
    });
    if (!rows.length) return { count: 0 };
    const x = await api('hrUpload', { month, rows, src: 'web' });
    ST.synced[month] = Date.now(); if (x.meta) META = x.meta;
    return x;
  }
  async function autoSync(month) {
    if (!admin() || (META.locks || {})[month]) return;
    if (ST.synced[month] && Date.now() - ST.synced[month] < 10 * 60000) return;
    try {
      const probe = await api('hrMonth', { month, part: (META.parts[0] || {}).name || '' });
      const src = probe.rawSrc || {};
      if (src.n && src.src === 'upload') { ST.synced[month] = Date.now(); return; }
      await syncWeb(month);
    } catch (e) { /* 기간이 없거나 자료가 없으면 건너뜀 */ }
  }

  // ------------------------------------------------------------ 틀
  const TABS_ADMIN = [['overview', '현황'], ['eval', '평가 입력'], ['att', '근태'], ['data', '데이터'], ['cfg', '기준 · 명단'], ['close', '마감 · 다운로드'], ['log', '수정기록']];
  const TABS_MGR = [['eval', '평가 입력'], ['att', '근태'], ['mypart', '우리 파트 현황']];
  async function render(main, tab) {
    if (!(await guard())) return;                                   // 같은 메뉴를 다시 눌러도 저장 안 한 점수 확인
    main.innerHTML = '<div class="ph"><h1>인사평가</h1></div><div class="muted" style="padding:30px">불러오는 중…</div>';
    try { META = await api('hrMeta'); } catch (e) { main.innerHTML = '<div class="ph"><h1>인사평가</h1></div><div class="warn" style="margin:20px">' + esc(e.message) + '</div>'; return; }
    ST.month = ST.month || META.current || META.months[0];
    if (!META.months.includes(ST.month) && META.months.length) ST.month = META.months[0];
    if (!ST.part || !(admin() ? META.parts.some(p => p.name === ST.part) : META.myParts.includes(ST.part))) ST.part = admin() ? (META.parts[0] || {}).name : META.myParts[0];
    if (admin()) { const ld = main.querySelector('.muted'); if (ld) ld.textContent = '업무데이터 반영 중…'; await autoSync(ST.month); }   // 탭을 누르기 전에 끝냄
    const tabs = admin() ? TABS_ADMIN : TABS_MGR;
    if (tab && tabs.some(t => t[0] === tab)) ST.tab = tab;
    if (!ST.tab || !tabs.some(t => t[0] === ST.tab)) ST.tab = tabs[0][0];
    main.innerHTML = `<div class="ph"><h1>인사평가</h1><select id="hrMonth" style="width:auto">${monthOpts()}</select><span id="hrLock"></span>
        <span style="flex:1"></span><span class="muted">${admin() ? '관리자' : esc(META.myParts.join(', ')) + ' · ' + esc(A.S.me.name)}</span></div>
      <nav class="hrt" id="hrTabs">${tabs.map(([k, t]) => `<button data-hrt="${k}" class="${k === ST.tab ? 'on' : ''}">${t}</button>`).join('')}</nav>
      <div id="hrb" class="pgb hrw"></div>`;
    $('#hrTabs').querySelectorAll('[data-hrt]').forEach(b => (b.onclick = () => go(b.dataset.hrt)));
    $('#hrMonth').onchange = async e => {
      const v = e.target.value; e.target.value = ST.month;
      if (!(await guard())) return;
      ST.month = v; e.target.value = v; ST.sel = null; lockChip();
      if (admin()) { body().innerHTML = '<div class="muted" style="padding:20px">업무데이터 반영 중…</div>'; await autoSync(v); }
      go(ST.tab);
    };
    lockChip();
    go(ST.tab);
  }
  function monthOpts() { return (META.months || []).map(m => `<option value="${m}" ${m === ST.month ? 'selected' : ''}>${ymLab(m)}${(META.locks || {})[m] ? ' 🔒' : ''}</option>`).join(''); }
  function lockChip() { const el = $('#hrLock'); if (el) el.innerHTML = (META.locks || {})[ST.month] ? '<span class="chip closed">🔒 마감</span>' : '<span class="chip open">진행중</span>'; }
  function refreshMonthSel() { const s = $('#hrMonth'); if (s) s.innerHTML = monthOpts(); lockChip(); }

  async function go(tab) {
    if (!(await guard())) return;
    ST.dirty = false; ST.tab = tab;
    document.querySelectorAll('#hrTabs [data-hrt]').forEach(b => b.classList.toggle('on', b.dataset.hrt === tab));
    if (!admin() && !['eval', 'att', 'mypart'].includes(tab)) tab = 'eval';
    ({ overview: viewOverview, eval: viewEval, mypart: viewMyPart, att: viewAtt, data: viewData, cfg: viewCfg, close: viewClose, log: viewLog })[tab]();
  }
  const body = () => $('#hrb');

  // ---------- 이동 전 저장 확인
  function askSave() {
    return new Promise(res => {
      A.modal(`<h3>저장하지 않은 내용이 있습니다</h3><div class="muted" style="margin-bottom:6px">입력한 내용을 저장하고 이동할까요?</div>
        <div class="acts"><button data-a="cancel">취소</button><button class="danger" data-a="discard">저장하지 않고 이동</button><button class="primary" data-a="save">저장하고 이동</button></div>`, (bg, close) => {
        bg.querySelectorAll('[data-a]').forEach(b => (b.onclick = () => { close(); res(b.dataset.a); }));
      });
    });
  }
  async function guard() {
    if (!ST.dirty) return true;
    const a = await askSave();
    if (a === 'cancel') return false;
    if (a === 'save') return await save(null, true);
    ST.dirty = false; clearTimeout(ST.timer); return true;
  }

  // ============================================================ 평가 입력
  const getSortMode = () => { try { return localStorage.getItem('hrSort') || 'name'; } catch (e) { return 'name'; } };
  const setSortMode = m => { try { localStorage.setItem('hrSort', m); } catch (e) { } };
  function cmpPeople(a, b, mode) {
    const pa = a.person, pb = b.person;
    const la = pa.role === '파트장' ? 0 : 1, lb = pb.role === '파트장' ? 0 : 1;
    if (la !== lb) return la - lb;
    if ((mode || getSortMode()) === 'join') { const ja = pa.join || '9999', jb = pb.join || '9999'; if (ja !== jb) return ja < jb ? -1 : 1; }
    return pa.name.localeCompare(pb.name, 'ko');
  }
  const recTotal = x => x.rec && x.rec['합계'] !== '' && x.rec['합계'] !== undefined ? x.rec['합계'] : null;
  const usedItems = (items, person) => items.filter(it => it.use && (it.target === '전체' || it.target === person.role));
  const stBadge = st => st === '완료' ? '<span class="badge done">완료</span>' : st === '작성중' ? '<span class="badge draft">작성중</span>' : '<span class="badge none">미작성</span>';

  async function viewEval(keepSel) {
    const parts = admin() ? META.parts.map(p => p.name) : META.myParts;
    const partSel = parts.length > 1 ? `<select id="partSel" style="width:auto">${parts.map(p => `<option ${p === ST.part ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>` : `<b>${esc(ST.part)}</b>`;
    body().innerHTML = `<div id="evalBanner"></div><div class="grid-eval"><section class="card plist" id="plist"><div class="muted">불러오는 중…</div></section>
      <div id="editor"><div class="card muted">왼쪽에서 인원을 선택하세요.</div></div></div>`;
    try { ST.data = await getMonth(ST.month, ST.part); } catch (e) { toast(e.message, 1); body().innerHTML = '<div class="warn">' + esc(e.message) + '</div>'; return; }
    const d = ST.data;
    $('#evalBanner').innerHTML = (d.locked ? `<div class="banner lock">🔒 ${ymLab(d.month)}은(는) 마감되었습니다. ${admin() ? '관리자는 수정할 수 있습니다.' : '수정이 필요하면 관리자에게 요청하세요.'}</div>` : '') +
      (!d.list.some(x => x.data.hasData) ? `<div class="banner warn">이 달의 업무데이터가 아직 반영되지 않았습니다. 참고 점수가 비어 있어도 직접 입력은 가능합니다.</div>` : '');
    ST.partSelHtml = partSel;
    d.list.sort((a, b) => cmpPeople(a, b));
    renderPList();
    if (keepSel && ST.sel && d.list.some(x => x.person.name === ST.sel)) selectPerson(ST.sel, true);
    else if (d.list.length) selectPerson(d.list[0].person.name, true);
  }

  function renderPList() {
    const d = ST.data;
    const done = d.list.filter(x => x.rec && x.rec['상태'] === '완료').length, draft = d.list.filter(x => x.rec && x.rec['상태'] === '작성중').length;
    const rows = d.list.map(x => {
      const t = recTotal(x), dt = x.data, low = dt.달성률 !== null && dt.달성률 < 1;
      return `<tr class="${x.person.name === ST.sel ? 'on' : ''}" data-n="${esc(x.person.name)}">
        <td class="nm">${esc(x.person.name)}${x.person.role === '파트장' ? ' <span class="badge lead">파트장</span>' : ''}</td>
        <td class="c">${esc(x.person.grade || '-')}</td><td class="c sc">${t !== null ? esc(t) : '-'}</td>
        <td class="c">${dt.일평균 === null ? '-' : f1(dt.일평균)}</td><td class="c ${low ? 'low' : ''}">${dt.달성률 === null ? '-' : Math.round(dt.달성률 * 100) + '%'}</td>
        <td class="c">${stBadge(x.rec ? x.rec['상태'] : '')}</td></tr>`;
    }).join('');
    const sc = d.list.map(recTotal).filter(v => v !== null).map(Number), av = d.list.map(x => x.data.일평균).filter(v => v !== null);
    const avg = a => a.length ? a.reduce((p, q) => p + q, 0) / a.length : null;
    const sm = getSortMode();
    $('#plist').innerHTML = `<div class="plh">${ST.partSelHtml}<span class="muted">${d.list.length}명 · 완료 ${done} · 작성중 ${draft}</span><span style="flex:1"></span>
        <span class="sortsw"><button class="sm ${sm === 'name' ? 'on' : ''}" data-sort="name">가나다</button><button class="sm ${sm === 'join' ? 'on' : ''}" data-sort="join">입사순</button></span></div>
      <table class="sum"><thead><tr><th>이름</th><th>등급</th><th>점수</th><th>일평균</th><th>달성</th><th>상태</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="muted">인원이 없습니다.</td></tr>'}</tbody>
      <tfoot><tr><td>파트 평균</td><td></td><td class="c">${sc.length ? f1(avg(sc)) : '-'}</td><td class="c">${av.length ? f1(avg(av)) : '-'}</td><td></td><td class="c">${done}/${d.list.length}</td></tr></tfoot></table>`;
    $('#plist').querySelectorAll('tbody tr[data-n]').forEach(el => (el.onclick = () => selectPerson(el.dataset.n)));
    $('#plist').querySelectorAll('[data-sort]').forEach(b => (b.onclick = () => { setSortMode(b.dataset.sort); d.list.sort((p, q) => cmpPeople(p, q)); renderPList(); }));
    if ($('#partSel')) $('#partSel').onchange = async e => { const v = e.target.value; e.target.value = ST.part; if (!(await guard())) return; ST.part = v; ST.sel = null; viewEval(); };
  }
  const curPerson = () => ST.data.list.find(x => x.person.name === ST.sel);

  const MAXC = 80;   // 총평 한 칸 = 엑셀 한 줄
  async function selectPerson(name, force) {
    if (!force && name !== ST.sel && !(await guard())) return;
    ST.dirty = false; clearTimeout(ST.timer); ST.sel = name;
    document.querySelectorAll('#plist tr[data-n]').forEach(el => el.classList.toggle('on', el.dataset.n === name));
    const x = curPerson(); if (!x) return;
    const d = ST.data, p = x.person, rec = x.rec || {};
    const items = usedItems(d.items, p);
    const locked = d.locked && !admin();
    const partInfo = META.parts.find(q => q.name === p.part) || {};
    const mgrs = [...new Set([...(META.managers || []), partInfo.manager].filter(Boolean))];
    const mgrVal = rec['관리자'] || partInfo.manager || '';
    const rows = items.map(it => {
      const k = it.no - 1, ref = x.refs[k], note = x.notes[k] || '';
      const val = rec['점수' + it.no] !== undefined && rec['점수' + it.no] !== '' ? rec['점수' + it.no] : '';
      const isMinus = it.sign < 0;
      return `<tr data-no="${it.no}" class="${isMinus ? 'minus' : ''}">
        <td class="grp">${esc(it.group)}</td>
        <td class="nm"><b>${esc(it.name)}</b><span>${esc(it.desc)}</span></td>
        <td class="c mx">${isMinus ? '감점' : esc(it.max)}</td>
        <td class="c inp"><input type="number" step="0.5" min="0" inputmode="decimal" data-no="${it.no}" value="${esc(val)}" ${locked ? 'disabled' : ''} placeholder="${isMinus ? '감점' : '점수'}"></td>
        <td class="ref">${ref === null ? '' : `<b>${isMinus && ref ? '-' : ''}${ref}${isMinus ? '' : '점'}</b><button class="sm" data-apply="${it.no}" ${locked ? 'disabled' : ''}>넣기</button>`}<span>${esc(note)}</span></td></tr>`;
    }).join('');
    const ln = (id, k, ph) => `<div class="ln"><input type="text" id="${id}" maxlength="${MAXC}" value="${esc(rec[k])}" placeholder="${esc(ph || '')}" ${locked ? 'disabled' : ''}><em id="${id}c"></em></div>`;
    const dt = x.data;
    $('#editor').innerHTML = `<section class="card ed">
      <div class="edh"><h2>${esc(p.name)}</h2><span class="chipg">${esc(p.part)}</span>${p.role === '파트장' ? '<span class="badge lead">파트장</span>' : ''}
        <span class="chipg">등급 ${esc(p.grade || '없음')}</span>${p.memo ? `<span class="chipg">${esc(p.memo)}</span>` : ''}${rec['상태'] ? stBadge(rec['상태']) : ''}
        <span style="flex:1"></span><button id="histBtn">지난 기록</button><button id="pvBtn">미리보기</button></div>
      ${rec['저장시각'] ? `<div class="muted" style="margin:-4px 0 8px">마지막 저장 ${esc(rec['저장시각'])} · ${esc(rec['작성자'])}</div>` : ''}
      <div id="side"></div>
      <div class="gt">평가 점수<span style="flex:1"></span><button class="sm primary" id="applyAll" ${locked ? 'disabled' : ''}>참고 점수 전체 적용</button></div>
      <table class="score"><thead><tr><th style="width:74px">구분</th><th>평가 요소 · 기준</th><th class="c" style="width:56px">배점</th><th class="c" style="width:96px">입력</th><th style="width:320px">참고 점수</th></tr></thead><tbody id="scoreBody">${rows}</tbody></table>
      <div class="total"><span class="muted">가점(미래성과평가)은 엑셀 평가표에서 입력</span><span>합계</span><b id="totalVal">-</b></div>
      <div class="gt">월간 총평 <span class="muted" style="font-weight:500">엑셀 평가표와 같은 칸 · 한 칸 = 엑셀 한 줄 (최대 ${MAXC}자)</span></div>
      <table class="ctb"><tr><th>관 리 자</th><td class="v"><select id="fMgr" ${locked ? 'disabled' : ''}><option value=""></option>${mgrs.map(m => `<option ${m === mgrVal ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></td><th rowspan="2">업무평가</th><td>${ln('fW1', '업무평가1', '여기에 입력')}</td></tr>
        <tr><th>월 목 표</th><td class="v">${dt.개인목표 === null ? '-' : f1(dt.개인목표) + '대'}</td><td>${ln('fW2', '업무평가2')}</td></tr>
        <tr><th>결&nbsp;&nbsp;&nbsp;&nbsp;과</th><td class="v">${dt.일평균 === null ? '-' : f1(dt.일평균, 2) + '대'}</td><th>건강관리</th><td>${ln('fH', '건강관리')}</td></tr>
        <tr><th>달 성 률</th><td class="v">${pct(dt.달성률)}</td><th>특이사항</th><td>${ln('fS', '특이사항')}</td></tr></table>
      <div class="svbar"><span id="saveState" class="savest"></span><span class="muted">입력 후 30초가 지나면 자동 저장됩니다</span><span style="flex:1"></span>
        <button class="primary big" id="saveDone" ${locked ? 'disabled' : ''}>작성 완료</button></div></section>`;
    renderSide(x);
    const bd = $('#scoreBody');
    bd.querySelectorAll('input').forEach(inp => (inp.oninput = () => { touch(); updTotals(); }));
    bd.querySelectorAll('[data-apply]').forEach(b => (b.onclick = () => { const no = +b.dataset.apply; bd.querySelector(`input[data-no="${no}"]`).value = x.refs[no - 1]; touch(); updTotals(); }));
    $('#applyAll').onclick = () => { items.forEach(it => { const r = x.refs[it.no - 1]; if (r !== null) bd.querySelector(`input[data-no="${it.no}"]`).value = r; }); touch(); updTotals(); toast('참고 점수를 넣었습니다. 확인 후 [작성 완료]를 누르세요'); };
    const cnt = id => { const el = $('#' + id), c = $('#' + id + 'c'); if (el && c) { c.textContent = el.value.length + '/' + MAXC; c.classList.toggle('full', el.value.length >= MAXC); } };
    ['fW1', 'fW2', 'fH', 'fS'].forEach(id => { cnt(id); $('#' + id).addEventListener('input', () => { cnt(id); touch(); }); });
    $('#fMgr').addEventListener('input', touch);
    $('#saveDone').onclick = () => save('완료');
    setSaveState(rec['저장시각'] ? '저장됨 · ' + String(rec['저장시각']).slice(5, 16) : '아직 저장 안 됨', rec['저장시각'] ? 'ok' : '');
    $('#pvBtn').onclick = () => openPreview(x);
    $('#histBtn').onclick = () => openHistory(p.name);
    updTotals();
  }

  function readScores() {
    const arr = new Array(SLOTS).fill('');
    document.querySelectorAll('#scoreBody input[data-no]').forEach(i => (arr[+i.dataset.no - 1] = i.value));
    return arr;
  }
  function updTotals() {
    const x = curPerson(); if (!x) return;
    const items = usedItems(ST.data.items, x.person);
    let t = 0, any = false;
    document.querySelectorAll('#scoreBody tr').forEach(tr => {
      const no = +tr.dataset.no, it = items.find(i => i.no === no);
      const v = num(tr.querySelector('input').value), ref = x.refs[no - 1];
      if (v !== null) { t += it.sign * v; any = true; }
      tr.classList.toggle('diff', v !== null && ref !== null && v !== ref);
    });
    $('#totalVal').textContent = any ? (Math.round(t * 10) / 10) + '점' : '-';
    const cell = document.querySelector('#plist tr.on .sc'); if (cell) cell.textContent = any ? Math.round(t * 10) / 10 : '-';
  }
  const AUTO_MS = 30000;
  function touch() {
    if (ST.data && ST.data.locked && !admin()) return;
    ST.dirty = true; setSaveState('저장 안 됨 · 30초 뒤 자동 저장', 'wait');
    clearTimeout(ST.timer); ST.timer = setTimeout(() => save(null, true), AUTO_MS);
  }
  function setSaveState(t, cls) { const el = $('#saveState'); if (el) { el.textContent = t; el.className = 'savest ' + (cls || ''); } }
  const hhmm = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const fields = () => ({ 관리자: $('#fMgr').value, 업무평가1: $('#fW1').value, 업무평가2: $('#fW2').value, 건강관리: $('#fH').value, 특이사항: $('#fS').value });

  // status : '완료' = 작성 완료 버튼 / null = 자동 저장 (기존 상태 유지)
  async function save(status, auto) {
    clearTimeout(ST.timer);
    const x = curPerson(); if (!x || !$('#scoreBody')) return true;
    const items = usedItems(ST.data.items, x.person);
    const sc = readScores();
    if (status === '완료') {
      const empty = items.filter(it => it.sign > 0 && num(sc[it.no - 1]) === null);
      if (empty.length && !(await A.confirmBox(`비어 있는 점수가 있습니다: <b>${esc(empty.map(i => i.name).join(', '))}</b><br>그래도 작성 완료로 저장할까요?`, '작성 완료'))) return false;
    }
    for (const it of items) {
      const v = num(sc[it.no - 1]), mx = num(it.maxv !== null ? it.maxv : it.max);
      if (v !== null && v < 0) { toast(`${it.name}: 0 이상으로 입력하세요 (감점은 숫자만)`, 1); setSaveState('저장 안 됨 · 점수를 확인하세요', 'err'); return false; }
      if (v !== null && it.sign > 0 && mx !== null && v > mx) { toast(`${it.name}: 최대 ${mx}점입니다`, 1); setSaveState('저장 안 됨 · 점수를 확인하세요', 'err'); return false; }
    }
    const st = status || (x.rec && x.rec['상태']) || '작성중';
    const diffs = items.filter(it => { const v = num(sc[it.no - 1]), r = x.refs[it.no - 1]; return v !== null && r !== null && v !== r; });
    const data = {}; ['총수량', '총수량순위', '일평균', '평균순위', '개인목표', '전월평균', '근무일수', '당일연차', '지각', '조퇴', '결근', '품질지적', '지시불이행', '미오발송', '오조립', '파손', '달성률'].forEach(k => (data[k] = x.data[k]));
    setSaveState('저장 중…', 'wait');
    try {
      const r = await api('hrSave', { month: ST.data.month, name: x.person.name, scores: sc, status: st, fields: fields(), data, refs: x.refs });
      x.rec = r.saved; ST.dirty = false;
      renderPList();
      if (auto) setSaveState('자동 저장됨 · ' + hhmm(), 'ok');
      else { selectPerson(x.person.name, true); toast(`작성 완료 저장됨 (합계 ${r.total}점)${diffs.length ? ` · 참고와 다른 칸 ${diffs.length}개` : ''}`); }
      return true;
    } catch (e) { toast(e.message, 1); setSaveState('저장 실패 · ' + e.message, 'err'); return false; }
  }

  function renderSide(x) {
    const d = x.data, a = d.근태기록 || {};
    const g = arr => arr.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
    const attNote = Object.keys(a).length ? '근태 기록 ' + Object.keys(a).map(k => k + ' ' + a[k]).join(' · ') : '근태 기록 없음';
    $('#side').innerHTML = `${d.hasData ? '' : '<div class="banner warn" style="margin-bottom:8px">이 인원의 업무데이터가 없습니다 (이름이 다르면 기준 · 명단 → 원본이름)</div>'}
      <div class="dstrip"><div class="dbox p"><div class="h">실적 <span>${ST.data.rawSrc && ST.data.rawSrc.src === 'web' ? '업무데이터 자동' : '업무통계 엑셀'}</span></div><div class="g">${g([
        ['총수량', d.총수량 === null ? '-' : f1(d.총수량)], ['일평균', d.일평균 === null ? '-' : f1(d.일평균, 2)], ['달성률', pct(d.달성률)],
        ['총량 순위', d.총수량순위 ? d.총수량순위 + '위' : '-'], ['평균 순위', d.평균순위 ? d.평균순위 + '위' : '-'], ['파트 내', d.파트순위 ? d.파트순위 + ' / ' + d.파트인원 : '-'],
        ['근무일', dash(d.근무일수)], ['개인목표', d.개인목표 === null ? '-' : f1(d.개인목표)], ['전월평균', d.전월평균 === null ? '-' : f1(d.전월평균, 2)]])}</div></div>
      <div class="dbox a"><div class="h">근태 <span>매니저 기록</span></div><div class="g g4">${g([['지각', dash(d.지각)], ['조퇴', dash(d.조퇴)], ['결근', dash(d.결근)], ['당일연차', dash(d.당일연차)]])}</div>
        <div class="dn">${esc(attNote)} · <a href="#" id="attGo">근태 탭</a></div></div>
      <div class="dbox x"><div class="h">사고 <span>사고 파일</span></div><div class="g">${g([['품질지적', dash(d.품질지적)], ['미/오발송', dash(d.미오발송)], ['오조립', dash(d.오조립)],
        ['파손', dash(d.파손)], ['지시불이행', dash(d.지시불이행)]])}</div></div></div>`;
    $('#attGo').onclick = e => { e.preventDefault(); go('att'); };
  }

  // ---------- 지난 기록
  const parseItems = rec => { try { return JSON.parse(rec['항목설정'] || '[]'); } catch (e) { return []; } };
  async function openHistory(name) {
    let list;
    try { list = (await api('hrHistory', { name })).list; } catch (e) { toast(e.message, 1); return; }
    const html = list.slice().reverse().map(r => {
      const its = parseItems(r);
      return `<details><summary><b>${esc(r['평가월'])}</b><span>합계 <b>${dash(r['합계'])}</b>점</span><span>일평균 ${r['일평균'] === '' || r['일평균'] === undefined ? '-' : f1(r['일평균'], 2) + '대'}</span>
        <span class="tag">${r['기준구분'] === '구' ? '구 기준' : '신 기준'}</span>${stBadge(r['상태'])}<span class="muted">${esc(r['작성자'])}</span></summary>
        <div class="body"><table><tr>${its.map(i => `<th>${esc(i.name)}<div class="muted">${i.sign < 0 ? '감점' : esc(i.max) + '점'}</div></th>`).join('')}<th>합계</th></tr>
          <tr>${its.map(i => `<td class="c">${dash(r['점수' + i.no])}</td>`).join('')}<td class="c"><b>${dash(r['합계'])}</b></td></tr></table>

  // ---------- 미리보기 (엑셀 인사평가표 모양)
  function monthCols(month) {
    const [y, m] = month.split('-').map(Number);
    return Array.from({ length: 12 }, (_, i) => { const mm = i + 1, yy = mm > m ? y - 1 : y; return { mm, key: `${yy}-${String(mm).padStart(2, '0')}`, last: yy < y }; });
  }
  function lineSvg(vals, color, fmt, min, max) {
    const W = 560, Hh = 245, L = 46, R = 14, T = 34, B = 26, iw = W - L - R, ih = Hh - T - B;
    const nums = vals.filter(v => v !== null);
    if (min === undefined) { const lo = nums.length ? Math.min(...nums) : 0, hi = nums.length ? Math.max(...nums) : 1; min = Math.floor(lo - 1); max = Math.ceil(hi + 1); }
    else { if (nums.length) { min = Math.min(min, Math.floor(Math.min(...nums) / 10) * 10); max = Math.max(max, Math.ceil(Math.max(...nums) / 10) * 10); } }
    const step = (max - min) / 5;
    const x = i => L + iw * (i + 0.5) / 12, y = v => T + ih * (1 - (v - min) / (max - min));
    let g = '';
    for (let k = 0; k <= 5; k++) { const v = min + step * k, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#dfe3e6"/><text x="${L - 4}" y="${yy + 3}" font-size="9" text-anchor="end" fill="#555">${fmt(v)}</text>`; }
    for (let i = 0; i < 12; i++) g += `<text x="${x(i)}" y="${Hh - 8}" font-size="9" text-anchor="middle" fill="#555">${i + 1}월</text>`;
    let path = '', dots = '';
    vals.forEach((v, i) => { if (v === null) return; path += (path ? 'L' : 'M') + x(i) + ' ' + y(v) + ' '; dots += `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${color}"/><text x="${x(i)}" y="${y(v) - 7}" font-size="9" text-anchor="middle">${fmt(v)}</text>`; });
    return { g, path, dots, W, H: Hh };
  }

  // ============================================================ 관리자 — 데이터
const normH = s => String(s === null || s === undefined ? '' : s).replace(/\s+/g, '');
function findHeader(aoa, must) {
  for (let r = 0; r < Math.min(aoa.length, 40); r++) {
    const row = (aoa[r] || []).map(normH);
    if (must.every(m => row.some(c => c === m))) return r;
  }
  return -1;
}
function colMap(row) { const m = {}; row.forEach((c, i) => { const k = normH(c); if (k && m[k] === undefined) m[k] = i; }); return m; }

function parseWork(ws) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  const hr = findHeader(aoa, ['이름', '평가평균']);
  if (hr < 0) throw new Error('"이름", "평가평균" 제목이 있는 줄을 찾지 못했습니다. 업무데이터 시트가 맞는지 확인하세요.');
  const m = colMap(aoa[hr]);
  const pick = (row, ...keys) => { for (const k of keys) if (m[k] !== undefined) return row[m[k]]; return ''; };
  const out = {}, order = [];
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r]; const name = String(pick(row, '이름') || '').trim();
    if (!name || name === '이름' || /^[\d.]+$/.test(name)) continue;
    const k = normH(name); if (out[k]) continue;
    let ach = num(pick(row, '달성_%', '달성율', '달성률')); if (ach !== null && ach > 3) ach = ach / 100;
    out[k] = {
      이름: name, 원본그룹: pick(row, '그룹'), 직위: pick(row, '직위'), 조립수량: num(pick(row, '조립수량')), 목표수량: num(pick(row, '목표수량')),
      평가평균: num(pick(row, '평가평균')), 실제평균: num(pick(row, '실제평균')), 근무일수: num(pick(row, '총근무일', '근무일')), 총량: num(pick(row, '총량(환산)', '총량')),
      달성률: ach, 순위: num(pick(row, '순위(평가)')), 조퇴: num(pick(row, '조퇴')), 지각: num(pick(row, '지각')), 당일연차: num(pick(row, '당일연차')),
      결근: num(pick(row, '결근')), 지시불이행: num(pick(row, '지시불이행')), 원본등급: pick(row, '등급'),
      품질지적: 0, 미발송: 0, 오발송: 0, 오조립: 0, 파손: 0
    };
    order.push(k);
  }
  return { rows: out, order };
}

const ACC_KINDS = { '품질지적': '품질지적', '지시불이행': '지시불이행', '미발송': '미발송', '오발송': '오발송', '오배송': '오발송', '오조립': '오조립', '파손': '파손' };
function parseAcc(ws) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  const hr = findHeader(aoa, ['이름', '구분']);
  if (hr < 0) throw new Error('"이름", "구분" 제목이 있는 줄을 찾지 못했습니다. 사고 시트가 맞는지 확인하세요.');
  const m = colMap(aoa[hr]); const out = {}; let n = 0;
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r]; const name = String(row[m['이름']] || '').trim(); const kind = ACC_KINDS[normH(row[m['구분']])];
    if (!name || !kind) continue;
    const k = normH(name); out[k] = out[k] || { 이름: name }; out[k][kind] = (out[k][kind] || 0) + 1; n++;
  }
  return { rows: out, count: n };
}

  async function loadCfg() { CFG = await api('hrCfg'); CFG.headers = {}; ['설정', '파트', '명단', '항목', '등급목표', '점유율표', '감점기준', '보고순서'].forEach(t => (CFG.headers[t] = H.HEADERS[t])); return CFG; }
  const COL_OPTS = { '사용': ['Y', 'N'], '계산방식': ['목표수량', '성장', '순위표', '품질감점', '근태감점', '수동'], '합산': ['더하기', '빼기'], '대상': ['전체', '사원', '파트장'],
    '직책': ['사원', '파트장'], '등급': ['', 'A', 'B', 'C', 'D'], '구분@감점기준': ['품질', '근태'] };
  function rowHtml(table, r, opts = {}) {
    const cols = opts.cols || CFG.headers[table];
    const cell = h => {
      let o = COL_OPTS[h + '@' + table] || COL_OPTS[h];
      if (h === '파트' && table === '명단') o = ['', ...CFG['파트'].map(p => p['파트'])];
      const v = r[h] === undefined ? '' : r[h], w = (opts.w && opts.w[h]) || 90;
      if (opts.readonly && opts.readonly.includes(h)) return `<td><input type="text" data-h="${h}" value="${esc(v)}" readonly style="background:#f4f6fa;width:${w}px"></td>`;
      if (o) return `<td><select data-h="${h}">${[...new Set([...o, v])].map(x => `<option ${String(x) === String(v) ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></td>`;
      return `<td><input type="text" data-h="${h}" value="${esc(v)}" style="width:${w}px"></td>`;

        META = (await api('hrLock', { month: m, locked: v })).meta; refreshMonthSel(); viewClose(); toast(v ? '마감했습니다' : '마감을 풀었습니다');

    $('#dlAll').onclick = downloadAll;
  }
function exportRows(month, list) {
  const rd = (v, n) => v === null || v === undefined ? '' : Math.round(v * 10 ** n) / 10 ** n;
  return list.map((x, i) => {
    const r = x.rec || {}, dt = x.data;
    const o = { No: i + 1, 이름: x.person.name, 파트: x.person.part, 직책: x.person.role, 등급: x.person.grade, 평가월: month };
    for (let k = 1; k <= SLOTS; k++) o['점수' + k] = r['점수' + k] === undefined ? '' : r['점수' + k];
    o.합계 = r['합계'] ?? '';
    o.관리자 = r['관리자'] || '';
    o.월목표 = dt.개인목표 ?? ''; o.결과 = rd(dt.일평균, 2); o.달성률 = rd(dt.달성률, 3);
    o.업무평가 = [r['업무평가1'], r['업무평가2']].filter(Boolean).join('\n'); o.건강관리 = r['건강관리'] || ''; o.특이사항 = r['특이사항'] || '';
    o.총수량 = rd(dt.총수량, 1); o.총수량순위 = dt.총수량순위 ?? ''; o.일평균 = rd(dt.일평균, 2); o.평균순위 = dt.평균순위 ?? ''; o.개인목표 = dt.개인목표 ?? ''; o.전월평균 = rd(dt.전월평균, 2);
    ['근무일수', '당일연차', '지각', '조퇴', '결근', '품질지적', '지시불이행', '미오발송', '오조립', '파손'].forEach(k => o[k] = dt[k] ?? '');
    o.상태 = r['상태'] || '미작성';

}

// 보고 순서표 순서로 정렬 (순서표에 없는 인원은 파트 → 이름순으로 뒤에)
function sortByOrder(list, order) {
  const pos = {}; order.forEach((r, i) => { if (r['이름']) pos[String(r['이름']).replace(/\s+/g, '')] = i; });
  const key = x => pos[x.person.name.replace(/\s+/g, '')];
  return list.slice().sort((a, b) => { const ka = key(a), kb = key(b);
    if (ka !== undefined && kb !== undefined) return ka - kb; if (ka !== undefined) return -1; if (kb !== undefined) return 1;
    return a.person.part.localeCompare(b.person.part, 'ko') || a.person.name.localeCompare(b.person.name, 'ko'); });
}


// 인적사항 파일(9월 최종 파일 또는 지난달 받은 엑셀)에서 사람별 인적사항·사진 읽기 — 브라우저 안에서만 읽고 어디에도 올리지 않음
async function readInfoFile(file) {
  const ab = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(ab);
  const xwb = XLSX.read(ab, { type: 'array', bookSheets: false });
  const rd = async p => zip.file(p) ? zip.file(p).async('string') : '';
  const wbXml = await rd('xl/workbook.xml'), wbRels = await rd('xl/_rels/workbook.xml.rels');
  const unesc = s => s.replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  const resolve = (base, t) => { if (t.startsWith('/')) return t.slice(1); const parts = base.split('/'); parts.pop(); t.split('/').forEach(s => { if (s === '..') parts.pop(); else if (s !== '.') parts.push(s); }); return parts.join('/'); };
  const relsOf = async p => { const x = await rd(p.replace(/([^/]+)$/, '_rels/$1.rels')); const o = {}; for (const m of x.matchAll(/<Relationship\b[^>]*>/g)) { const id = /Id="([^"]*)"/.exec(m[0]), tg = /Target="([^"]*)"/.exec(m[0]); if (id && tg) o[id[1]] = resolve(p, unesc(tg[1])); } return o; };
  const wbR = await relsOf('xl/workbook.xml');
  const sheetPath = {};
  for (const m of wbXml.matchAll(/<sheet\b[^>]*>/g)) { const n = /name="([^"]*)"/.exec(m[0]), id = /r:id="([^"]*)"/.exec(m[0]); if (n && id && wbR[id[1]]) sheetPath[unesc(n[1])] = wbR[id[1]]; }
  const nk = s => String(s || '').replace(/\s+/g, '');
  const KEYS = { 연락처: 'phone', 휴대폰: 'phone', 주소: 'addr', 결혼유무: 'marry', 가족사항: 'family', 직무: 'job', 담당업무: 'job' };
  const out = {};
  for (const sn of xwb.SheetNames) {
    const sh = xwb.Sheets[sn]; if (!sh) continue;
    const v = a => { const c = sh[a]; return c ? (c.w !== undefined ? c.w : c.v) : ''; };
    if (nk(v('D1')) !== '성명') continue;               // 인사평가표 양식 시트만
    const name = nk(v('F1')); if (!name) continue;
    const o = {};
    for (let r = 1; r <= 5; r++) [['D', 'F'], ['J', 'L']].forEach(([lc, vc]) => { const k = KEYS[nk(v(lc + r))]; if (k && !o[k]) { const val = String(v(vc + r) || '').trim(); if (val) o[k] = val; } });
    // 사진: B~C열 위쪽(1~5행)에 걸린 그림
    try {
      const sp = sheetPath[sn];
      if (sp) {
        const sx = await rd(sp), sr = await relsOf(sp);
        const dm = /<drawing\b[^>]*r:id="([^"]*)"/.exec(sx);
        if (dm && sr[dm[1]]) {
          const dp = sr[dm[1]], dx = await rd(dp), dr = await relsOf(dp);
          for (const a of dx.matchAll(/<(?:xdr:)?(?:twoCellAnchor|oneCellAnchor)\b[\s\S]*?<\/(?:xdr:)?(?:twoCellAnchor|oneCellAnchor)>/g)) {
            const col = +(/<(?:xdr:)?col>(\d+)</.exec(a[0]) || [0, 99])[1], row = +(/<(?:xdr:)?row>(\d+)</.exec(a[0]) || [0, 99])[1];
            const em = /r:embed="([^"]*)"/.exec(a[0]);
            if (em && col >= 1 && col <= 2 && row <= 4 && dr[em[1]]) {
              const ext = (dr[em[1]].split('.').pop() || '').toLowerCase().replace('jpg', 'jpeg');
              if (['png', 'jpeg', 'gif'].includes(ext) && zip.file(dr[em[1]])) { o.photo = { ext, data: await zip.file(dr[em[1]]).async('uint8array') }; break; }
            }
          }
        }
      }
    } catch (e) { /* 사진은 없어도 진행 */ }
    out[name] = o;
  }
  return out;
}

// 엑셀 받기: 1) 인사평가현황(보고 순서표 모양, 총점)  2) 사람별 인사평가표(개선 양식, 값으로 채움 + 그래프 2개)
async function buildWorkbook(month, items, list, order, hist, info, opts) {
  const side = !opts || opts.side !== false;   // 오른쪽 그래프·업무데이터(P~Y) 포함 여부
  const maxCol = side ? 25 : 14;
  if (!window.ExcelJS || !window.JSZip) throw new Error('엑셀 기능을 불러오지 못했습니다. 새로고침(Ctrl+F5) 후 다시 시도하세요.');
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(Uint8Array.from(atob(TPL_B64), c => c.charCodeAt(0)).buffer);
  const tpl = wb.getWorksheet('사원');
  const font = { name: '굴림', size: 9 }, bold = { name: '굴림', size: 9, bold: true };
  const thin = { style: 'thin' }, border = { top: thin, left: thin, bottom: thin, right: thin };
  const center = { horizontal: 'center', vertical: 'middle', wrapText: true };
  const [y, m] = month.split('-');
  const nk = s => String(s || '').replace(/\s+/g, '');
  const recBy = {}; list.forEach(x => recBy[nk(x.person.name)] = x);
  const ordBy = {}; (order || []).forEach(r => { if (r['이름']) ordBy[nk(r['이름'])] = r; });

  // ---------- 1) 인사평가현황 ----------
  if (order && order.length) {
    const ws = wb.addWorksheet('인사평가현황', { views: [{ showGridLines: false }] });
    ws.columns = [{ width: 12 }, { width: 8 }, { width: 10 }, { width: 11 }, { width: 11 }, { width: 8 }, { width: 3 },
                  { width: 12 }, { width: 8 }, { width: 10 }, { width: 11 }, { width: 11 }, { width: 8 }];
    ws.getCell('A1').value = `● 조립팀 인사평가현황(${y}년${m}월)`; ws.getCell('A1').font = { name: '굴림', size: 12, bold: true };
    const heads = ['파트', '직급', '이름', '사번', '계약월', '총점'];
    [1, 8].forEach(c0 => heads.forEach((h, i) => { const c = ws.getCell(3, c0 + i); c.value = h; c.font = bold; c.border = border; c.alignment = center; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2EFDA' } }; }));
    const sides = { '왼쪽': [], '오른쪽': [] };
    order.forEach(r => { const s = sides[r['위치']] || sides['왼쪽']; let b = s.find(q => q.name === r['블록']); if (!b) { b = { name: r['블록'], rows: [] }; s.push(b); } if (r['이름']) b.rows.push(r); });
    let total = 0;
    const draw = (blocks, c0) => {
      let row = 4;
      blocks.forEach(b => {
        const n = Math.max(b.rows.length, 1);
        ws.getCell(row, c0).value = `${b.name}\n(${b.rows.length}명)`;
        if (n > 1) ws.mergeCells(row, c0, row + n - 1, c0);
        for (let i = 0; i < n; i++) {
          const r = b.rows[i] || {};
          const x = r['이름'] ? recBy[nk(r['이름'])] : null;
          const tot = x && x.rec && x.rec['합계'] !== '' && x.rec['합계'] !== undefined ? Number(x.rec['합계']) : '';
          const vals = [null, r['직급'] || '', r['이름'] || '', r['사번'] ? (isFinite(r['사번']) ? Number(r['사번']) : r['사번']) : '', r['계약월'] ? new Date(r['계약월'] + 'T00:00:00') : '', tot];
          for (let k = 0; k < 6; k++) {
            const c = ws.getCell(row + i, c0 + k);
            if (k > 0) c.value = vals[k];
            c.font = k === 5 ? bold : font; c.border = border; c.alignment = center;
            if (k === 4) c.numFmt = 'yyyy-mm-dd';
          }
          ws.getRow(row + i).height = 15;
        }
        ws.getCell(row, c0).font = bold;
        total += b.rows.length;
        row += n + 1;
      });
      return row;
    };
    draw(sides['왼쪽'], 1);
    const end = draw(sides['오른쪽'], 8);
    const tl = ws.getCell(end, 8), tv = ws.getCell(end, 10);
    ws.mergeCells(end, 8, end + 1, 9); ws.mergeCells(end, 10, end + 1, 11);
    tl.value = '조립팀 총원'; tv.value = total;
    [tl, tv].forEach(c => { c.font = bold; c.alignment = center; });
    for (let rr = end; rr <= end + 1; rr++) for (let cc = 8; cc <= 11; cc++) ws.getCell(rr, cc).border = border;
    ws.pageSetup = { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
  }

  // ---------- 2) 사람별 인사평가표 ----------
  const cp = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
  const tplMerges = (tpl.model.merges || []).map(String);
  const parseR = a => { const mm = /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(a); return mm && { c1: mm[1], r1: +mm[2], c2: mm[3], r2: +mm[4] }; };
  const copyCell = (ws, tr, tc, r, c, keepVal) => {
    const s = tpl.getCell(tr, tc), d = ws.getCell(r, c);
    d.style = cp(s.style) || {};
    if (keepVal && s.value !== null && s.value !== undefined && !(s.value && s.value.formula)) d.value = s.value;
    return d;
  };
  const copyRow = (ws, tr, r, keepVal) => {
    for (let c = 1; c <= maxCol; c++) copyCell(ws, tr, c, r, c, keepVal);
    ws.getRow(r).height = tpl.getRow(tr).height;
  };
  const med = { style: 'medium' };
  const used = new Set();
  const sheetName = n => { let s = String(n).replace(/[\[\]:*?\/\\']/g, '').slice(0, 31) || '이름없음', k = s, i = 2; while (used.has(k)) k = s.slice(0, 28) + '_' + i++; used.add(k); return k; };
  const monthsCols = monthCols(month);
  const numOr = v => { const n = num(v); return n === null ? null : n; };
  const chartJobs = [];

  sortByOrder(list, order || []).forEach(x => {
    const p = x.person, r = x.rec || {}, o = exportRows(month, [x])[0], ord = ordBy[nk(p.name)] || {};
    const its = usedItems(items, p);
    const plus = its.filter(it => it.sign > 0), minus = its.filter(it => it.sign < 0);
    const nRows = plus.length + 1 + minus.length;          // 항목 + 가점 1줄
    const d = nRows - 7;                                   // 원본 양식은 9~15행(7줄)
    const name = sheetName(p.name);
    const ws = wb.addWorksheet(name, { views: [{ showGridLines: false }], properties: p.role === '파트장' ? { tabColor: { argb: 'FFFFC000' } } : {} });  // 파트장 시트 탭 색 (9월 파일과 같게)
    ws.pageSetup = cp(tpl.pageSetup); ws.pageSetup.printArea = undefined;
    tpl.columns.forEach((col, i) => { if (i >= maxCol) return; const c = ws.getColumn(i + 1); c.width = col.width; if (col.hidden) c.hidden = true; });

    // 1~8행: 인적사항·제목·머리줄
    for (let tr = 1; tr <= 8; tr++) copyRow(ws, tr, tr, true);
    // 항목 줄
    let row = 9;
    const groups = []; plus.forEach(it => { const g = groups.find(q => q.name === it.group); g ? g.items.push(it) : groups.push({ name: it.group, items: [it] }); });
    const itemRow = (it, tr, isMinus) => {
      copyRow(ws, tr, row, false);
      if (!isMinus) { // 항목명 칸은 첫 줄(C9) 모양으로 통일
        const cs = cp(tpl.getCell(9, 3).style) || {}; cs.border = { top: row === 9 ? med : thin, bottom: thin, left: thin, right: thin };
        ws.getCell(row, 3).style = cs; ws.getCell(row, 4).style = cp(cs);
      }
      ws.mergeCellsWithoutStyle(row, 3, row, 4); ws.mergeCellsWithoutStyle(row, 6, row, 13);
      ws.getCell(row, 3).value = it.name;
      ws.getCell(row, 5).value = isMinus ? '감점' : (num(it.max) ?? it.max);
      ws.getCell(row, 6).value = it.desc;
      const v = num(r['점수' + it.no]);
      ws.getCell(row, 14).value = v === null ? null : (isMinus ? -Math.abs(v) : v);
      ws.getRow(row).height = 33;
      row++;
    };
    groups.forEach(g => {
      const r0 = row;
      g.items.forEach((it, i) => itemRow(it, i === 0 ? 9 : 10, false));
      for (let c = 2; c <= 14; c++) { const cell = ws.getCell(row - 1, c); cell.border = Object.assign({}, cell.border, { bottom: med }); }
      ws.getCell(r0, 2).value = g.name; ws.getCell(r0, 2).style = Object.assign(cp(tpl.getCell(9, 2).style), { border: { left: med, right: thin, top: med, bottom: med } });
      if (row - 1 > r0) ws.mergeCellsWithoutStyle(r0, 2, row - 1, 2);
    });
    // 가점 줄 (엑셀에서 직접 입력)
    copyRow(ws, 14, row, false);
    ws.mergeCellsWithoutStyle(row, 3, row, 4); ws.mergeCellsWithoutStyle(row, 6, row, 13);
    ws.getCell(row, 2).value = '추가평가'; ws.getCell(row, 3).value = '미래성과평가'; ws.getCell(row, 5).value = '가점';
    ws.getCell(row, 6).value = '신규 서비스 개발 및 개선, 업무 프로세스 개선, 업무 지식 공유 및 업데이트';
    ws.getRow(row).height = 33; row++;
    // 감점 줄
    minus.forEach(it => { itemRow(it, 15, true); ws.getCell(row - 1, 2).value = it.group; });
    const lastItem = row - 1;

    // 16행 이후: 총점·이력·총평 (d줄만큼 밀어서 복사)
    for (let tr = 16; tr <= 26; tr++) copyRow(ws, tr, tr + d, true);
    tplMerges.forEach(a => { const q = parseR(a); if (!q) return; if (q.r2 <= 8) ws.mergeCellsWithoutStyle(a); else if (q.r1 >= 16) ws.mergeCellsWithoutStyle(`${q.c1}${q.r1 + d}:${q.c2}${q.r2 + d}`); });
    // 데이터 확인(목록) L1, L4
    ws.getCell('L1').dataValidation = { type: 'list', allowBlank: true, formulae: ['"정규직,계약직"'] };
    ws.getCell('L4').dataValidation = { type: 'list', allowBlank: true, formulae: ['"기 혼,미 혼"'] };

    // 인적사항 (개인정보는 웹에 없으므로 빈칸)
    ws.getCell('F1').value = p.name;
    ws.getCell('F2').value = p.role || '사원';
    if (ord['계약월']) ws.getCell('F3').value = new Date(String(ord['계약월']).slice(0, 10) + 'T00:00:00');
    ws.getCell('L1').value = ord['직급'] === '계약직' ? '계약직' : '정규직';
    const pi = (info && info[nk(p.name)]) || null;
    if (pi) {
      if (pi.job) ws.getCell('L2').value = pi.job;
      if (pi.phone) ws.getCell('L3').value = pi.phone;
      if (pi.family) ws.getCell('F4').value = pi.family;
      if (pi.marry) ws.getCell('L4').value = pi.marry;
      if (pi.addr) ws.getCell('F5').value = pi.addr;
      if (pi.photo) { const id = wb.addImage({ buffer: pi.photo.data, extension: pi.photo.ext }); ws.addImage(id, 'B1:C5'); }
    }

    // 총점 = 항목 합계 수식 (가점 넣으면 자동 반영)
    const tot = num(r['합계']);
    ws.getCell(16 + d, 14).value = { formula: `SUM(N9:N${lastItem})`, result: tot === null ? 0 : tot };

    // 1~12월 이력
    const h = (hist && hist[nk(p.name)]) || {};

      [cs, cq].forEach(c => { c.fill = mc.last ? { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } } : { type: 'pattern', pattern: 'none' }; });
    });

    // 월간 총평
    const rr = 23 + d;
    ws.getCell(rr, 3).value = r['관리자'] || null;
    ws.getCell(rr + 1, 3).value = o.월목표 === '' ? null : Number(o.월목표);
    ws.getCell(rr + 2, 3).value = o.결과 === '' ? null : Number(o.결과);
    ws.getCell(rr + 3, 3).value = o.달성률 === '' ? null : Number(o.달성률);
    ws.getCell(rr + 3, 3).numFmt = '0.0%';
    ws.getCell(rr, 5).value = r['업무평가1'] || null;
    ws.getCell(rr + 1, 5).value = r['업무평가2'] || null;
    ws.getCell(rr + 2, 5).value = r['건강관리'] || null;
    ws.getCell(rr + 3, 5).value = r['특이사항'] || null;

    // 오른쪽 업무 데이터 (P~Y)
    const blk = [[o.총수량, o.총수량순위, o.일평균, o.개인목표, o.달성률], [o.근무일수, o.당일연차, o.지각, o.조퇴, o.결근], [o.품질지적, o.지시불이행, o.미오발송, o.오조립, o.파손]];
    if (side) blk.forEach((vals, i) => vals.forEach((v, j) => {
      const c = ws.getCell(rr + i, 17 + 2 * j);
      c.value = v === '' || v === null || v === undefined ? null : Number(v);
      c.numFmt = (i === 0 && j === 4) ? '0.0%' : (i === 0 && (j === 0 || j === 2)) ? '0.00' : '0;-0;"-"';
    }));

    // 바깥 테두리 굵게 통일 (인적사항 1~5행, 평가표 7행~총평 끝)
    const setB = (r, c, k) => { const cell = ws.getCell(r, c); cell.border = Object.assign({}, cell.border, { [k]: med }); };
    [[1, 5], [7, 26 + d]].forEach(([a, b]) => {
      for (let r = a; r <= b; r++) { setB(r, 2, 'left'); setB(r, 14, 'right'); }
      for (let c = 2; c <= 14; c++) { setB(a, c, 'top'); setB(b, c, 'bottom'); }
    });
    if (side) chartJobs.push({ name, r18: 18 + d, r19: 19 + d, r21: 21 + d });
  });
  wb.removeWorksheet(tpl.id);

  const buf = await wb.xlsx.writeBuffer();
  if (!chartJobs.length) return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  return addCharts(buf, chartJobs);
}

function drawingXml() {

async function addCharts(buf, jobs) {
  const zip = await JSZip.loadAsync(buf);
  const wbXml = await zip.file('xl/workbook.xml').async('string');
  const wbRels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  let ct = await zip.file('[Content_Types].xml').async('string');
  const unesc = s => s.replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  const sheetFile = {};
  for (const mt of wbXml.matchAll(/<sheet [^>]*?name="([^"]*)"[^>]*?r:id="([^"]*)"/g)) {
    const rel = new RegExp(`<Relationship[^>]*Id="${mt[2]}"[^>]*>`).exec(wbRels) || [''];
    const tg = /Target="([^"]*)"/.exec(rel[0]);
    if (tg) sheetFile[unesc(mt[1])] = 'xl/' + tg[1].replace(/^\/?xl\//, '');
  }
  let n = 0, add = '';
  const EMPTY_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
  const CHART_CT = 'application/vnd.openxmlformats-officedocument.drawingml.chart+xml';
  for (const j of jobs) {
    const sf = sheetFile[j.name]; if (!sf || !zip.file(sf)) continue;
    n++;
    const c1 = 2 * n - 1, c2 = 2 * n;
    zip.file(`xl/charts/chart${c1}.xml`, chartXml('월별 평가점수', j.name, j.r18, j.r19, '1F6FB2', '0" 점"', '0"점"', '<c:max val="105"/><c:min val="50"/>'));
    zip.file(`xl/charts/chart${c2}.xml`, chartXml('월별 평균수량', j.name, j.r18, j.r21, 'D1662B', '0.0" 대"', '0.0"대"', ''));
    add += `<Override PartName="/xl/charts/chart${c1}.xml" ContentType="${CHART_CT}"/><Override PartName="/xl/charts/chart${c2}.xml" ContentType="${CHART_CT}"/>`;
    const chartRels = `<Relationship Id="rIdCh1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${c1}.xml"/><Relationship Id="rIdCh2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${c2}.xml"/>`;
    const relPath = sf.replace(/worksheets\/([^/]+)$/, 'worksheets/_rels/$1.rels');
    let rels = zip.file(relPath) ? await zip.file(relPath).async('string') : EMPTY_RELS;
    let sx = await zip.file(sf).async('string');
    const exist = /<drawing\b[^>]*r:id="([^"]*)"/.exec(sx);
    const rel = exist && new RegExp(`<Relationship\\b[^>]*Id="${exist[1]}"[^>]*>`).exec(rels);
    const tg = rel && /Target="([^"]*)"/.exec(rel[0]);
    if (tg) { // 사진 때문에 그림판이 이미 있으면 거기에 그래프를 붙임
      const dp = tg[1].startsWith('/') ? tg[1].slice(1) : 'xl/' + tg[1].replace(/^\.\.\//, '');
      const drp = dp.replace(/([^/]+)$/, '_rels/$1.rels');
      let dx = await zip.file(dp).async('string');
      const pre = (/<(\w+):wsDr\b/.exec(dx) || [0, 'xdr'])[1];
      let anchors = /<xdr:wsDr[^>]*>([\s\S]*)<\/xdr:wsDr>/.exec(drawingXml())[1].replace(/cNvPr id="(\d)"/g, 'cNvPr id="100$1"');
      if (pre !== 'xdr') anchors = anchors.replace(/<(\/?)xdr:/g, `<$1${pre}:`);
            if (!/xmlns:a=/.test((/<\w+:wsDr\b[^>]*>/.exec(dx) || [''])[0])) dx = dx.replace(new RegExp(`<${pre}:wsDr\\b`), `<${pre}:wsDr xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"`);

    zip.file(dn, drawingXml());
    zip.file(`xl/drawings/_rels/chartdrw${n}.xml.rels`, EMPTY_RELS.replace('</Relationships>', chartRels + '</Relationships>'));
    zip.file(relPath, rels.replace('</Relationships>', `<Relationship Id="rIdChartDrw" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/chartdrw${n}.xml"/></Relationships>`));
    if (!/xmlns:r=/.test(sx.slice(0, 600))) sx = sx.replace('<worksheet ', '<worksheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');

}

<script>/* ============================================================
 * 조립팀 업무데이터 — 화면
 * ============================================================ */
(function () {
  'use strict';
  const C = window.Core;
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const f2 = v => (v == null || !isFinite(v)) ? '-' : (Math.round(v * 100) / 100).toFixed(2);
  const pct = v => (v == null || !isFinite(v)) ? '-' : (Math.round(v * 1000) / 10).toFixed(1) + '%';
  const ymLabel = ym => ym ? (ym.slice(2, 4) + '년 ' + (+ym.slice(5, 7)) + '월') : '';
  const dLabel = s => { const d = new Date(s + 'T00:00:00'); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + C.WD[d.getDay()] + ')'; };
  const APP = $('#app');

  const S = {
    token: sessionStorage.getItem('tk') || '', me: null, periods: [], today: C.ymd(new Date()),
    view: 'input', target: null, date: null, day: null, dirty: false, saving: false, timer: null,
    monthYm: null, manageYm: null, manageGroup: '',
  };

  // ------------------------------------------------ 공통
  function toast(msg, err) {
    const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = ''), err ? 3800 : 2200);
  }
  // 같은 요청을 다시 보내도 결과가 같은 것만 자동 재시도
  const SAFE_RETRY = new Set(['me', 'lvGet', 'getDay', 'saveDay', 'deleteDay', 'getMonth', 'getPeriodDays', 'setTarget', 'listUsers', 'listDates', 'ping', 'login', 'logout', 'register', 'backup']);
  const API_HEADERS = () => { const h = { apikey: SB_KEY, 'Content-Type': 'application/json' }; if (/^eyJ/.test(SB_KEY)) h.Authorization = 'Bearer ' + SB_KEY; return h; };
  function perf(action, ms, sms) {
    const el = $('#perf'); if (!el || !S.me || S.me.role !== '관리자') return;
    el.textContent = '응답 ' + (ms / 1000).toFixed(2) + '초' + (sms != null ? ' (서버 ' + (sms / 1000).toFixed(2) + ')' : '') + ' · ' + action;
  }
  async function api(action, data) {
    if (!SB_URL || SB_URL.indexOf('__') === 0) throw new Error('설치가 끝나지 않았습니다: index.html 의 SB_URL / SB_KEY 를 설정하세요');
    const tk0 = S.token;
    const body = JSON.stringify({ req: Object.assign({ action, token: tk0 }, data || {}) });
    const tries = SAFE_RETRY.has(action) ? 3 : 1;
    let res = null, last = '', fatal = '';
    for (let t = 0; t < tries && !res && !fatal; t++) {
      if (t) await new Promise(r => setTimeout(r, 600 * t + Math.random() * 400));
      const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 20000), t0 = performance.now();
      try {
        const r = await fetch(SB_URL + '/rest/v1/rpc/api', { method: 'POST', headers: API_HEADERS(), body, signal: ac.signal });
        const txt = await r.text(); let j = null;
        try { j = JSON.parse(txt); } catch (e) { }
        if (r.ok && j && typeof j === 'object' && 'ok' in j) { res = j; perf(action, performance.now() - t0, j._ms); }
        else if (r.status === 401 || r.status === 403) fatal = '서버 접속 키가 맞지 않습니다 (index.html 의 SB_KEY 확인)';
        else if (r.status === 404) fatal = '서버 기능이 설치되지 않았습니다 (Supabase SQL 설치 확인)';
        else { last = 'server'; console.warn('[업무데이터] 서버 응답 오류', r.status, txt.slice(0, 300)); }
      } catch (e) { last = navigator.onLine === false ? 'offline' : e.name === 'AbortError' ? 'timeout' : 'net'; console.warn('[업무데이터] 연결 오류', e); }
      finally { clearTimeout(tm); }
    }
    if (fatal) throw new Error(fatal);
    if (!res) {
      if (last === 'offline') throw new Error('인터넷이 끊겼습니다. 연결을 확인해 주세요');
      if (tries === 1) throw new Error('서버 연결이 잠시 불안정합니다. 결과를 확인한 뒤 다시 눌러주세요');
      throw new Error('서버 연결이 잠시 불안정합니다 (자동 재시도 ' + tries + '회 실패). 잠시 후 다시 해주세요');
    }
    if (!res.ok) {
      // 로그아웃 뒤 늦게 도착한 응답(예전 토큰)은 무시 : 새 로그인 화면 입력이 지워지지 않도록
      if (tk0 && tk0 === S.token && /로그인이 (필요|만료)/.test(res.msg || '')) {
        // 로그인 만료 때 저장 못 한 입력은 잠시 보관했다가 다시 로그인하면 복구
        try { if (S.dirty && S.day && S.day.canEdit) sessionStorage.setItem('pending', JSON.stringify({ uid: who().id, date: S.date, doc: S.day.doc })); } catch (e) { }
        logout(true);
      }
      throw new Error(res.msg || '오류');
    }
    return res;
  }
  function modal(html, onMount, cls) {
    const bg = document.createElement('div'); bg.className = 'modal-bg' + (/\bdrawer\b/.test(cls || '') ? ' dr' : '');
    bg.innerHTML = '<div class="modal ' + (cls || '') + '">' + html + '</div>';
    document.body.appendChild(bg);
    const close = () => bg.remove();
    bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
    onMount && onMount(bg, close);
    return close;
  }
  function confirmBox(msg, okText) {

  function impStatus(x, all, existing) {
    if (!x.date) return { k: 'bad', t: '날짜 확인 필요', dis: true };
    if (!periodOf(x.date)) return { k: 'bad', t: '월 기간 없음', dis: true };
    if (all.filter(y => y.date === x.date).length > 1) return { k: 'warn', t: '날짜 중복', dis: false, off: true };
    if (x.date > S.today) return { k: 'warn', t: '미래 날짜 — 시트 이름 확인', dis: false, off: true };
    if (existing.has(x.date)) return { k: 'warn', t: '이미 웹에 있음', dis: false, off: true, exist: true };
    return { k: 'ok', t: '새로 넣음', dis: false };
  }
  function matchUser(fname, users) {
    const base = fname.replace(/\.[^.]+$/, '').replace(/\s+/g, '');
    let best = [], len = 0;
    users.forEach(u => { const n = u.name.replace(/\s+/g, ''); if (n && base.indexOf(n) >= 0) { if (n.length > len) { best = [u]; len = n.length; } else if (n.length === len) best.push(u); } });
    return best.length === 1 ? best[0] : null;
  }
  async function existingFor(uid, items) {
    const ds = items.map(x => x.date).filter(Boolean).sort();
    if (!ds.length || !uid) return new Set();
    const en = ds[ds.length - 1], st = ds[0] < C.addDays(en, -85) ? C.addDays(en, -85) : ds[0];
    return new Set((await api('listDates', { userId: uid, start: st, end: en })).dates);
  }

  function importXlsx() {

      items.sort((a, b) => (a.date || '9') < (b.date || '9') ? -1 : 1);
      const u = who(), valid = items.map(x => x.date).filter(Boolean).sort();

          const st = valid[0] < C.addDays(valid[valid.length - 1], -85) ? C.addDays(valid[valid.length - 1], -85) : valid[0];
          existing = new Set((await api('listDates', { userId: u.id, start: st, end: valid[valid.length - 1] })).dates);

  function showImport(fname, u, items, existing) {

      if (!x.date) return { k: 'bad', t: '날짜 확인 필요', dis: true };
      if (!periodOf(x.date)) return { k: 'bad', t: '월 기간 없음 (기간 설정 필요)', dis: true };
      if (all.filter(y => y.date === x.date).length > 1) return { k: 'warn', t: '날짜 중복 — 하나만 선택', dis: false, off: true };
      if (x.date > S.today) return { k: 'warn', t: '미래 날짜 — 시트 이름 확인', dis: false, off: true };
      if (existing.has(x.date)) return { k: 'warn', t: '이미 웹에 있음 — 체크하면 덮어씀', dis: false, off: true };
      return { k: 'ok', t: '새로 넣음', dis: false };
    };
    items.forEach(x => { const s = st(x, items); x.on = !s.dis && !s.off; });
    const rowsHtml = () => items.map((x, i) => {
      const s = st(x, items), c = C.calcDay(x.doc, 0, minsOf(x.date));

      <div style="max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px">
      <table class="list imp"><thead><tr><th><input type="checkbox" id="iall"></th><th>시트</th><th>날짜</th><th>구분</th><th class="num">주문</th><th class="num">평가평균</th><th>상태</th></tr></thead><tbody id="ibody">${rowsHtml()}</tbody></table></div>
      <div class="row" style="margin-top:10px"><span class="muted" id="icnt"></span><span style="flex:1"></span><span class="progress hide" id="ipg"><i></i></span><span class="muted" id="ipt"></span></div>
      <div class="acts"><button data-c>닫기</button><button class="primary" data-s>가져오기</button></div>`, (bg, close) => {

            }

            $('#ibody', bg).innerHTML = rowsHtml(); bind(); cnt();
          };
        });
      };
      bind(); cnt();
      $('#iall', bg).onchange = e => { items.forEach(x => { if (!st(x, items).dis) x.on = e.target.checked; }); $('#ibody', bg).innerHTML = rowsHtml(); bind(); cnt(); };

        const sel = items.filter(x => x.on && x.date);

        const dup = sel.map(x => x.date).filter((d, i, a) => a.indexOf(d) !== i);

          try { await api('saveDay', { userId: u.id, date: x.date, doc: x.doc, sum: C.daySummary(x.doc, minsOf(x.date)) }); ok++; existing.add(x.date); x.on = false; }
          catch (e) { fails.push(dLabel(x.date) + ': ' + e.message); }
          $('#ipg i', bg).style.width = ((i + 1) / sel.length * 100) + '%';
        }

        $('#ibody', bg).innerHTML = rowsHtml(); bind(); cnt(); btn.disabled = false;
        if (fails.length) toast('일부 실패: ' + fails[0], true); else toast(ok + '일을 가져왔습니다');
      };

  }

  // ---- 숫자 선택판 (클릭으로 숫자 고르기, 직접 입력도 가능) ----
  let padFor = null, padHold = false, padBig = false;
  function showPad(inp) {
    const np = $('#np'); padFor = inp;
    const isQ = inp.dataset.f === 'q';
    const label = isQ ? '수량' : (C.COL[inp.dataset.n].label.replace('\n', '') + ' 개수');
    const max = padBig ? 50 : 20, cur = String(inp.value);
    let h = '<div class="t"><b>' + esc(label) + '</b><span>클릭 또는 숫자 입력</span></div><div class="gp">';
    for (let k = 1; k <= max; k++) h += '<button data-v="' + k + '" class="' + (String(k) === cur ? 'cur' : '') + '">' + k + '</button>';
    h += '<button class="clr" data-v="">지우기</button><button class="more" data-more>' + (padBig ? '1~20만 보기' : '21~50 더보기') + '</button></div>';
    np.innerHTML = h;
    const r = inp.getBoundingClientRect();
    np.classList.add('show');
    const ph = np.offsetHeight, pw = np.offsetWidth;
    let top = r.bottom + 2; if (top + ph > window.innerHeight - 6) top = r.top - ph - 2;
    let left = r.left; if (left + pw > window.innerWidth - 6) left = window.innerWidth - pw - 6;
    np.style.top = top + 'px'; np.style.left = left + 'px';
  }
  function hidePad() { $('#np').classList.remove('show'); padFor = null; }
  (function initPad() {
    const np = $('#np');
    np.addEventListener('mousedown', e => { padHold = true; e.preventDefault(); });
    np.addEventListener('mouseup', () => setTimeout(() => (padHold = false), 0));
    np.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || !padFor) return;
      if (b.hasAttribute('data-more')) { padBig = !padBig; return showPad(padFor); }
      const inp = padFor;
      inp.value = b.dataset.v;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      hidePad(); inp.blur();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePad(); });
    document.addEventListener('scroll', () => padFor && document.activeElement === padFor && showPad(padFor), true);
  })();

  function colIdx(c) { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; }

  function onGridInput(e) {
    const t = e.target, tr = t.closest('tr'); if (!tr) return;
    const r = S.day.doc.rows[+tr.dataset.i];
    if (t.dataset.f === 'q') { r.q = t.value.trim() === '' ? '' : C.num(t.value); }
    else if (t.dataset.f === 'memo') { r.memo = t.value; tr.querySelector('td.o').classList.toggle('memo', !!t.value); }
    else if (t.dataset.f === 'o') { r.o = t.value; }
    else if (t.dataset.n) {
      if (!String(r.o).trim() && t.value) { toast('주문번호부터 입력하세요', true); t.value = ''; return; }
      const v = C.num(t.value); if (v) r.m[t.dataset.n] = v; else delete r.m[t.dataset.n];
      t.parentNode.classList.toggle('on', !!v);
    }
    changed();
  }
  function onGridChange(e) {
    const t = e.target; if (t.dataset.f !== 'o') return;
    const tr = t.closest('tr'), r = S.day.doc.rows[+tr.dataset.i];
    const v = C.normOrder(t.value); t.value = v; r.o = v;
    const q = tr.querySelector('input[data-f="q"]');
    if (v && (r.q === '' || r.q == null)) { r.q = 1; q.value = 1; }
    if (!v) { if (r.q !== '' || Object.keys(r.m).length) clearRow(+tr.dataset.i, true); }
    changed();
  }
  function toggle(td) {
    const tr = td.closest('tr'), i = +tr.dataset.i, r = S.day.doc.rows[i], c = td.dataset.c, x = C.COL[c];
    if (!String(r.o).trim()) return toast('주문번호부터 입력하세요', true);
    if (r.q === '' || r.q == null) return toast('수량을 먼저 입력하세요', true);
    if (x.kind !== 'type' && !C.EXCLUSIVE.type.some(k => r.m[k]) && !r.m[c]) return toast('조립구분(일반~반조)을 먼저 선택하세요', true);
    if (r.m[c]) { delete r.m[c]; if (x.kind === 'type' && !C.EXCLUSIVE.type.some(k => r.m[k])) { /* 조립구분 해제 */ } }
    else {
      const ex = C.EXCLUSIVE[x.kind];
      if (ex) ex.forEach(k => { if (r.m[k]) { delete r.m[k]; const o = tr.querySelector(`td.mk[data-c="${k}"]`); o && (o.classList.remove('on'), (o.textContent = '')); } });
      r.m[c] = 1;

  }
  async function clearRow(i, silent) {
    const r = S.day.doc.rows[i];
    if (!silent && (String(r.o).trim() || Object.keys(r.m).length) && !(await confirmBox((i + 1) + '번 줄의 데이터를 지울까요?', '지우기'))) return;
    S.day.doc.rows[i] = { o: '', q: '', m: {}, memo: '' };

    const D = S.day, MN = C.minsMap(minsOf(S.date)), c = C.calcDay(D.doc, D.target, MN);
    const rate = c.c8 == null ? 0 : Math.max(0, c.c8), w = Math.min(100, rate * 100);

  // 저장
  function changed() {
    S.dirty = true; refreshCalc(); showSaveState();
    clearTimeout(S.timer); S.timer = setTimeout(() => saveNow(), 2500);
  }
  function showSaveState(err) {
    const el = $('#ss'); if (!el) return;
    if (err) { el.className = 'save-state err'; el.textContent = '⚠ 저장 실패 — ' + err; return; }
    if (S.saving) { el.className = 'save-state ing'; el.textContent = '저장 중…'; return; }
    if (S.dirty) { el.className = 'save-state ing'; el.textContent = '수정됨 (곧 자동 저장)'; return; }
    el.className = 'save-state';
    el.textContent = S.day && S.day.savedAt ? '✓ 저장됨 ' + S.day.savedAt.slice(5, 16) + (S.day.savedBy && S.day.savedBy !== who().name ? ' (' + S.day.savedBy + ')' : '') : '아직 저장 안 됨';
  }
  async function saveNow(manual) {
    clearTimeout(S.timer);
    if (!S.day || !S.day.canEdit) return true;
    if (!S.dirty && !manual) return true;
    if (S.saving) { await new Promise(r => setTimeout(r, 300)); return saveNow(manual); }
    S.saving = true; showSaveState();
    const doc = S.day.doc;
    const clean = Object.assign({}, doc, { rows: doc.rows.filter(r => String(r.o).trim() || r.memo).map(r => ({ o: r.o, q: r.q, m: r.m, memo: r.memo || undefined })) });
    const snapshotDirty = JSON.stringify(doc);
    try {
      const r = await api('saveDay', { userId: who().id, date: S.date, doc: clean, sum: C.daySummary(clean, minsOf(S.date)) });
      S.day.savedAt = r.savedAt; S.day.savedBy = r.savedBy; S.day.exists = true;
      if (S.day.pc) S.day.pc.days[S.date] = { doc: JSON.parse(JSON.stringify(clean)), at: r.savedAt, by: r.savedBy };
      if (JSON.stringify(doc) === snapshotDirty) S.dirty = false;
      S.saving = false; showSaveState();
      if (manual) toast('저장했습니다');
      return true;
    } catch (e) {
      S.saving = false; showSaveState(e.message); toast('저장 실패: ' + e.message, true);
      return false;
    }
  }

  function monthChart(daily, target) {

  // ---- 인원 명단 (조직도) : 등록 허용 명단 ----
  const RS_COLS = [['name', '이름'], ['grp', '그룹'], ['title', '직책'], ['rank', '직급'], ['level', '레벨'], ['status', '상태'], ['job', '세부직무'], ['empno', '사번']];
  const RS_HEAD = { '이름': 'name', '직급': 'rank', '사번': 'empno', '그룹': 'grp', '직책': 'title', '레벨': 'level', '상태': 'status', '세부직무': 'job', '순번': 'seq' };
  let _xlsxP = null;
  const loadXLSX = () => window.XLSX ? Promise.resolve(window.XLSX) : (_xlsxP = _xlsxP || new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => ok(window.XLSX); sc.onerror = () => { _xlsxP = null; no(new Error('엑셀 읽기 도구를 불러오지 못했습니다 (인터넷 확인)')); }; document.head.appendChild(sc);
  }));
  const normName = v => String(v == null ? '' : v).replace(/\s+/g, '');
  // 조직도 파일 → [{name, grp, ...}] : '조립팀' 시트(없으면 '이름' 머리글이 있는 첫 시트)
  async function readRosterFile(f) {
    const X = await loadXLSX();
    const wb = X.read(new Uint8Array(await f.arrayBuffer()), { type: 'array' });
    const names = wb.SheetNames.includes('조립팀') ? ['조립팀'].concat(wb.SheetNames.filter(n => n !== '조립팀')) : wb.SheetNames;
    for (const sn of names) {
      const aoa = X.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
      const hi = aoa.slice(0, 6).findIndex(r => r.some(v => String(v).trim() === '이름'));
      if (hi < 0) continue;
      const col = {}; aoa[hi].forEach((v, i) => { const k = RS_HEAD[String(v).trim()]; if (k && col[k] === undefined) col[k] = i; });
      const rows = [], bad = [];
      aoa.slice(hi + 1).forEach((r, i) => {
        const raw = String(r[col.name] == null ? '' : r[col.name]).trim(); if (!raw) return;
        const o = {}; Object.keys(col).forEach(k => { const v = r[col[k]]; o[k] = v == null ? '' : String(v).trim(); });
        o.name = raw;
        if (!/^[가-힣A-Za-z0-9]{2,10}$/.test(normName(raw))) bad.push((hi + i + 2) + '행 "' + raw + '"'); else rows.push(o);
      });
      return { sheet: sn, rows, bad };
    }
    throw new Error("'이름' 머리글이 있는 시트를 찾지 못했습니다 (조직도 '조립팀' 시트)");
  }

      <div class="fld"><label>이름 (관리툴 이름 그대로)</label><input id="rf_name" value="${esc(v.disp || v.name || '')}" autocomplete="off"></div>
      <div class="fld"><label>그룹</label><select id="rf_grp">${(GL.includes(v.grp) || !v.grp ? GL : [v.grp].concat(GL)).map(g => `<option ${g === v.grp ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></div>
      <div class="row" style="gap:8px">${[['title', '직책'], ['rank', '직급'], ['level', '레벨']].map(([k, l]) => `<div class="fld" style="flex:1"><label>${l}</label><input id="rf_${k}" value="${esc(v[k] || '')}"></div>`).join('')}</div>
      <div class="row" style="gap:8px">${[['status', '상태'], ['job', '세부직무'], ['empno', '사번']].map(([k, l]) => `<div class="fld" style="flex:1"><label>${l}</label><input id="rf_${k}" value="${esc(v[k] || '')}"></div>`).join('')}</div>
      ${x && x.acct ? '<div class="note">이름을 바꿔도 이미 있는 계정 이름은 그대로입니다. 계정 이름은 [인원 관리]에서 따로 바꾸세요.</div>' : ''}
      <div class="acts"><button data-c>취소</button><button class="primary" data-s>저장</button></div>`, (bg, close) => {
      $('[data-c]', bg).onclick = close;
      $('[data-s]', bg).onclick = async () => {
        const row = {}; ['name', 'grp', 'title', 'rank', 'level', 'status', 'job', 'empno'].forEach(k => (row[k] = $('#rf_' + k, bg).value.trim()));
        try { S._roster = await api('rosterSave', { mode: 'put', old: x ? x.name : '', row }); close(); toast(row.name + ' 저장'); after(); } catch (e) { toast(e.message, true); }
      };
    });
  }
  // 월 백업 : 가장 오래된 달은 [마감 + 백업 후 변경 없음]일 때만 지울 수 있음
  async function drawBackup() {
    const box = $('#bkbox'); if (!box) return;
    let r; try { r = await api('bkList'); } catch (e) { box.innerHTML = '<div class="warn">' + esc(e.message) + '</div>'; return; }
    const st = x => [x.period ? '업무 ' + x.period : '', x.hr === null || x.hr === undefined ? '' : (x.hr ? '인사평가 마감' : '인사평가 진행'), x.lvClosed ? '연차 마감' : ''].filter(Boolean).join(' · ') || '-';
    box.innerHTML = `<div style="max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table class="list bktbl"><thead><tr><th>달</th><th>상태</th><th class="num">일일</th><th class="num">연차</th><th class="num">평가</th><th>마지막 백업</th><th></th></tr></thead><tbody>
      ${r.months.slice().reverse().map(x => `<tr><td><b>${ymLabel(x.ym)}</b>${x.oldest ? ' <span class="muted">(가장 오래됨)</span>' : ''}</td><td class="muted">${esc(st(x))}</td>
        <td class="num">${x.days}</td><td class="num">${x.leaves}</td><td class="num">${x.hrRecs}</td>
        <td>${x.backupAt ? esc(x.backupAt.slice(5, 16)) + ' · ' + esc(x.backupBy) + (x.changed ? ' <b class="t-lo">· 바뀜 → 다시 백업</b>' : '') : '<span class="muted">없음</span>'}</td>
        <td><button data-bk="${x.ym}">⬇ 백업</button>${x.oldest ? ` <button class="danger" data-bd="${x.ym}" ${x.canDelete ? '' : 'disabled title="가장 오래된 달 · 지난 달 · 마감 · 백업 후 변경 없음일 때만"'}>이 달 지우기</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">데이터가 없습니다</td></tr>'}
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><span class="muted" style="flex:1">지우기는 가장 오래된 지난 달이 마감되고 백업한 뒤 바뀐 내용이 없을 때만 켜집니다.</span>
        <label class="btn-file"><input type="file" id="bkfile" accept=".json" hidden><span>백업 파일로 복원…</span></label></div>`;
    $$('[data-bk]', box).forEach(b => (b.onclick = async () => {
      const ym = b.dataset.bk; b.disabled = true;
      try {
        const x = await api('bkMonth', { ym }); delete x.ok; delete x._ms;
        saveBlob(new Blob([JSON.stringify(x)], { type: 'application/json' }), '업무데이터_월백업_' + ym + '_' + S.today + '.json');
        toast(ymLabel(ym) + ' 백업을 받았습니다 (일일 ' + x.days.length + ' · 연차 ' + x.leaves.length + ' · 평가 ' + x.hrRec.length + ')'); drawBackup();
      } catch (e) { toast(e.message, true); b.disabled = false; }
    }));
    $$('[data-bd]', box).forEach(b => (b.onclick = () => modal(`<h3 style="color:var(--red)">${ymLabel(b.dataset.bd)} 지우기</h3>
      <div style="line-height:1.6">이 달의 <b>일일 입력 · 목표 · 기간 · 연차 · 토요근무 · 인사평가 · 근태</b>가 서버에서 지워집니다.<br>받아 둔 백업 파일로만 되살릴 수 있습니다. 계속하려면 <b>삭제</b>라고 입력하세요.</div>
      <div class="fld" style="margin-top:10px"><input id="cf" placeholder="삭제"></div><div class="acts"><button data-c>취소</button><button class="danger" data-s>지우기</button></div>`, (bg, close) => {
      $('[data-c]', bg).onclick = close;
      $('[data-s]', bg).onclick = async () => {
        try { const x = await api('bkDelete', { ym: b.dataset.bd, confirm: $('#cf', bg).value.trim() }); S.periods = x.periods; S._mcache = {}; S.pc = {}; close(); toast(ymLabel(x.deleted) + '을(를) 지웠습니다'); renderSettings(); }
        catch (e) { toast(e.message, true); }
      };
    })));
    $('#bkfile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      let data; try { data = JSON.parse(await f.text()); } catch (err) { return toast('백업 파일을 읽지 못했습니다', true); }
      if (!data || data.app !== '조립팀 업무데이터' || !data.ym) return toast('업무데이터 백업 파일이 아닙니다', true);
      modal(`<h3>${ymLabel(data.ym)} 복원</h3><div style="line-height:1.6">백업 시각 ${esc(data.at || '')}<br>일일 ${(data.days || []).length}건 · 연차 ${(data.leaves || []).length}건 · 평가 ${(data.hrRec || []).length}건을 되살립니다. 지금 있는 같은 기록은 백업 내용으로 바뀝니다.<br>계속하려면 <b>복원</b>이라고 입력하세요.</div>
        <div class="fld" style="margin-top:10px"><input id="cf" placeholder="복원"></div><div class="acts"><button data-c>취소</button><button class="primary" data-s>복원</button></div>`, (bg, close) => {
        $('[data-c]', bg).onclick = close;
        $('[data-s]', bg).onclick = async () => {
          try { const x = await api('bkRestore', { data, confirm: $('#cf', bg).value.trim() }); S.periods = x.periods; S._mcache = {}; S.pc = {}; close(); toast(`${ymLabel(x.ym)} 복원 : 일일 ${x.days}건${x.skipped ? ' (계정 없는 ' + x.skipped + '건 제외)' : ''} · 연차 ${x.leaves} · 평가 ${x.hr}`); renderSettings(); }
          catch (err) { toast(err.message, true); }
        };
      });
    };
  }
  const nextYmOf = ym => { let [y, m] = ym.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return y + '-' + C.pad(m); };
  const addDaysStr = (s, k) => C.addDays(s, k);
  function bindPeriodPanel() {
    const upd = r => { S.periods = r.periods; S.manageYm = null; S.mMode = 'month'; S._mcache = {}; S.pc = {}; renderSettings(); };
    const refreshAfterFail = async () => { try { const m = await api('me'); S.periods = m.periods; S.manageYm = null; renderSettings(); } catch (e) { } };
    const b = id => $('#' + id);
    if (b('popen')) b('popen').onclick = async () => {
      try { upd(await api('openPeriod', { ym: b('pym').value, start: b('pst').value })); toast('기간을 시작했습니다'); } catch (e) { toast(e.message, true); }
    };
    if (b('pclose')) b('pclose').onclick = async () => {
      const ym = b('pym').value, st = b('pst').value, en = b('pen').value;
      if (!en) return toast('마감일을 선택하세요', true);
      if (!(await confirmBox(`<b>${ymLabel(ym)}</b> (${st} ~ ${en}) 을 마감합니다.<br>다음 달은 ${C.addDays(en, 1)} 부터 자동으로 시작됩니다.`, '마감'))) return;
      try { upd(await api('closePeriod', { ym, start: st, end: en })); toast('마감했습니다'); } catch (e) { toast(e.message, true); }
    };
    if (b('pedit')) b('pedit').onclick = async () => {
      try { upd(await api('editOpen', { ym: b('pym').value, start: b('pst').value })); toast('수정했습니다'); } catch (e) { toast(e.message, true); }
    };
    if (b('pcancel')) b('pcancel').onclick = async () => {
      if (!(await confirmBox('가장 최근 마감을 취소하고 그 달을 다시 진행 상태로 돌립니다.<br>그 뒤에 자동으로 열렸던 다음 달 기간은 삭제됩니다 (입력 데이터는 지워지지 않음).', '마감 취소'))) return;
      try { upd(await api('cancelClose')); toast('마감을 취소했습니다'); } catch (e) { toast(e.message, true); }
    };
    b('padd').onclick = async () => {
      try { upd(await api('addPastPeriod', { ym: b('aym').value, start: b('ast').value, end: b('aen').value })); toast('지난 달 기간을 추가했습니다'); } catch (e) { toast(e.message, true); refreshAfterFail(); }
    };
    if (b('pwipe')) b('pwipe').onclick = () => modal(`<h3 style="color:var(--red)">데이터 전체 삭제</h3>
      <div style="line-height:1.6">모든 인원의 <b>입력 데이터, 월 목표, 월 기간</b>이 전부 삭제됩니다 (연차·토요 자료는 그대로). 계정(이름·비밀번호)은 남습니다.<br>되돌릴 수 없습니다. 계속하려면 <b>전체삭제</b> 라고 입력하세요.</div>
      <div class="fld" style="margin-top:10px"><input id="cf" placeholder="전체삭제"></div>
      <div class="acts"><button data-c>취소</button><button class="danger" data-s>삭제</button></div>`, (bg, close) => {
      $('[data-c]', bg).onclick = close;
      $('[data-s]', bg).onclick = async () => {
        try { upd(await api('deleteAllData', { confirm: $('#cf', bg).value })); close(); toast('전체 삭제했습니다'); } catch (e) { toast(e.message, true); }
      };
    });
  }

  // ------------------------------------------------ 시작
  // 매니저·관리자 : 관리 목록을 뒤에서 미리 받아 둠 → [관리] 누르면 바로 보임
  function prefetchManage() {
    const ym = (curPeriod() || {}).ym; if (!ym || !isManager()) return;
    const key = 'M|' + ym; S._mcache = S._mcache || {}; S._mpf = S._mpf || {};
    if (S._mcache[key] || S._mpf[key]) return;
    const tk = S.token;
    S._mpf[key] = api('listUsers', { ym }).then(r => { if (tk !== S.token) return null; if (!S._mcache[key]) S._mcache[key] = r; return r; }).catch(() => null).finally(() => { delete S._mpf[key]; });
  }
  async function boot(pre) {
    if (!S.token) return renderLogin();
    try {
      const r = pre && pre.me ? pre : await api('me', { withDay: true });
      S.me = r.me; S.periods = r.periods; S.today = r.today || S.today; S.rates = r.rates || [];
      S.pc = {};
      if (r.day && r.day.period) S.pc[pcKey(r.me.id, r.day.period.ym)] = { t: Date.now(), period: r.day.period, target: r.day.target, canEdit: r.day.canEdit, canSetTarget: r.day.canSetTarget, days: r.day.days || {} };
      let d0 = S.today;
      try { const pend = JSON.parse(sessionStorage.getItem('pending') || 'null'); if (pend && pend.uid === S.me.id && pend.date) d0 = pend.date; } catch (e) { }
      const pend0 = d0 !== S.today;
      const v0 = isManager() && !pend0 ? 'dash' : 'input';
      S.layout = null; shell(layoutOf(v0)); go(v0, { date: d0 });
      if (isManager()) setTimeout(() => { prefetchManage(); if (window.Leave) window.Leave.prefetch().then(updateBadge).catch(() => { }); }, 600);
    } catch (e) { if (S.token) { toast(e.message, true); } renderLogin(); }
  }
  if (window.Leave) window.Leave.init({ api, modal, toast, confirmBox, esc, $, $$, S, saveBlob, go, updateBadge, isManager });
  if (window.HR) window.HR.init({ api, modal, toast, confirmBox, S, saveBlob, C, minsYm, minsOf, dLabel });
  boot();
})();
</script>
</body>
</html>
