<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조립팀 업무데이터</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#1d2430;--sub:#5f6b7a;--line:#d9dee6;--line2:#eef1f5;
  --blue:#1f5fbf;--blue-soft:#e8f0fc;--yellow:#fff3a3;--yellow-ink:#6b5800;--red:#c62828;--red-soft:#fdecec;
  --green:#1e7a3c;--green-soft:#e6f4ea;--head:#f7f8fa;--memo:#b4c6e7;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Gulim,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9edf2;color:var(--ink);font-family:var(--font);font-size:13.5px}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 12px}
button:hover{border-color:#aab4c3}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--red);border-color:#f0c4c4}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #8fb3ee;outline-offset:-1px;border-color:#8fb3ee}
.hide{display:none!important}
/* 상단 */
header{position:sticky;top:0;z-index:30;background:#1f2a3a;color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;height:48px}
header .logo{font-weight:700;font-size:15px;letter-spacing:-.3px;white-space:nowrap}
header nav{display:flex;gap:2px;margin-left:8px}
header nav button{background:transparent;border:0;color:#c7d0dc;padding:14px 14px;border-radius:0;border-bottom:3px solid transparent}
header nav button.on{color:#fff;border-bottom-color:#6ea2f5;font-weight:700}
header .me{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
header .me b{font-size:16px}
header .me .tag{font-size:11px;background:#3a4a60;border-radius:10px;padding:2px 8px}
header .me button{background:transparent;color:#c7d0dc;border-color:#3a4a60;padding:4px 10px}
.proxy{background:#fff4d6;border-bottom:1px solid #f0d58a;padding:8px 16px;display:flex;gap:10px;align-items:center;font-weight:700;color:#6b4e00}
main{padding:14px 16px 40px;max-width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--line2);color:var(--sub)}
.chip.open{background:var(--green-soft);color:var(--green)}
.chip.closed{background:var(--red-soft);color:var(--red)}
.chip.none{background:#fff0e0;color:#a15c00}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .date{font-size:15px;font-weight:700;padding:5px 8px}
.save-state{font-size:12px;color:var(--sub);min-width:120px}
.save-state.err{color:var(--red);font-weight:700}
.save-state.ing{color:var(--blue)}
/* 요약 */
.stats{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:10px}
.stat{background:#fff;border:1px solid #c9d0da;border-radius:8px;padding:7px 12px}
.stat .k{font-size:12.5px;color:#46505e;font-weight:600}
.stat .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--sub);font-weight:400;margin-left:3px}
.bar{height:6px;border-radius:3px;background:var(--line2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#f2c200}
.bar i.hi{background:#0070c0}.bar i.lo{background:#e53935}
.inputs{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;padding:9px 14px;border-color:#c9d0da}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:12px;color:#46505e;font-weight:600}
.fld .ro{padding:6px 2px;font-weight:700;font-variant-numeric:tabular-nums}
.fld input.min{width:66px;text-align:right;background:#fffbe6}
.sep{width:1px;align-self:stretch;background:var(--line)}
/* 표 */
.gridwrap{background:#fff;border:1px solid #b9c2cf;border-radius:8px;overflow:auto;max-height:calc(100vh - 340px);min-height:320px}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
table.grid th,table.grid td{border-right:1px solid #d3dae3;border-bottom:1px solid #dde2e9;padding:0;height:30px;text-align:center;white-space:nowrap}
table.grid thead th{position:sticky;background:#e9edf2;z-index:3;font-weight:700;color:#1d2430}
table.grid thead tr:nth-child(1) th{top:0;height:28px;font-size:13px;border-bottom:1px solid #b9c2cf}
table.grid thead tr:nth-child(2) th{top:28px;height:38px;white-space:pre-line;line-height:1.15;font-size:12.5px}
table.grid thead tr:nth-child(3) th{top:66px;height:20px;font-size:11px;color:#46505e;font-weight:400;border-bottom:2px solid #6b7686}
/* 구역 색 */
.g0{--gh:hsl(212,62%,84%);--gb:hsl(212,70%,96.5%)}.g1{--gh:hsl(172,45%,80%);--gb:hsl(172,55%,96%)}
.g2{--gh:hsl(24,80%,84%);--gb:hsl(24,85%,96.5%)}.g3{--gh:hsl(196,60%,82%);--gb:hsl(196,70%,96.5%)}
.g4{--gh:hsl(140,42%,82%);--gb:hsl(140,50%,96.5%)}.g5{--gh:hsl(262,48%,86%);--gb:hsl(262,60%,97%)}
.g6{--gh:hsl(338,60%,87%);--gb:hsl(338,70%,97%)}.g7{--gh:hsl(12,62%,86%);--gb:hsl(12,70%,97%)}
.g8{--gh:hsl(96,40%,82%);--gb:hsl(96,50%,96.5%)}.g9{--gh:hsl(290,40%,86%);--gb:hsl(290,50%,97%)}
.g10{--gh:hsl(0,55%,87%);--gb:hsl(0,65%,97%)}
table.grid thead th.gc{background:var(--gh)}
table.grid tbody td.gc{background-color:var(--gb)}
table.grid .gs{border-left:2px solid #6b7686}
table.grid .stk{position:sticky;z-index:2;background-color:#fff}
table.grid thead .stk{z-index:5;background:#dfe5ec}
table.grid .c0{left:0;width:28px;min-width:28px}
table.grid .c1{left:28px;width:30px;min-width:30px;color:#46505e;font-size:12px}
table.grid .c2{left:58px;width:118px;min-width:118px}
table.grid .c3{left:176px;width:50px;min-width:50px;border-right:2px solid #6b7686}
table.grid tbody td.c2,table.grid tbody td.c3{background-color:#fffbe6}
table.grid td input{border:0;border-radius:0;width:100%;height:29px;background:transparent;text-align:center;padding:0 4px;font-size:13px;color:#1d2430}
table.grid td input:focus{outline:2px solid #1f5fbf;outline-offset:-2px;background:#fff}
table.grid td.o input{text-align:left;font-variant-numeric:tabular-nums;letter-spacing:.3px;font-weight:600}
table.grid tbody td.o.memo{background-color:var(--memo)}
table.grid td.mk{width:36px;min-width:36px;cursor:pointer;user-select:none;font-weight:800;font-size:14px}
table.grid td.mk:hover{outline:2px solid #1f5fbf;outline-offset:-2px}
table.grid tbody td.mk.on{background-color:#ffd43b;color:#3d3000}
table.grid td.n{width:36px;min-width:36px}
table.grid td.n input{color:#0b3f86;font-weight:800;font-size:14px}
table.grid tbody td.n.on{background-color:#bcd6ff}
table.grid td.memo-c{min-width:170px;text-align:left}
table.grid td.memo-c input{text-align:left;font-weight:400}
table.grid tbody tr:nth-child(even) td{background-image:linear-gradient(rgba(30,45,70,.055),rgba(30,45,70,.055))}
table.grid tbody tr.b5 td{border-bottom:2px solid #8792a3}
table.grid tbody tr:hover td{background-image:linear-gradient(rgba(31,95,191,.13),rgba(31,95,191,.13))}
table.grid td.x button{border:0;background:transparent;color:#9aa4b2;padding:0;width:100%;height:29px}
table.grid td.x button:hover{color:var(--red)}
table.grid tfoot td{position:sticky;background:#e9edf2;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;z-index:2;border-top:2px solid #6b7686}
table.grid tfoot tr:nth-child(1) td{bottom:28px;height:28px}
table.grid tfoot tr:nth-child(2) td{bottom:0;height:28px;color:#1f5fbf;border-top:1px solid #c9d0da}
table.grid tfoot td.stk{z-index:4;background:#dfe5ec}
table.grid.ro td.mk{cursor:default}
.below{display:flex;gap:10px;align-items:center;margin-top:8px}
/* 일반 표 */
table.list{border-collapse:collapse;width:100%;background:#fff}
table.list th,table.list td{border-bottom:1px solid var(--line2);padding:8px 10px;text-align:left;white-space:nowrap}
table.list th{background:var(--head);font-size:12px;color:var(--sub);position:sticky;top:0}
table.list td.num,table.list th.num{text-align:right;font-variant-numeric:tabular-nums}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:#f5f8ff}
.sat{color:#1f5fbf}.sun{color:var(--red)}
/* 로그인 */
.login{max-width:380px;margin:9vh auto 0}
.login h1{font-size:20px;margin:0 0 4px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:10px 14px;color:var(--sub)}
.tabs button.on{border-bottom-color:var(--blue);color:var(--ink);font-weight:700}
.login .fld{margin-bottom:10px}
.login input,.login select{width:100%;padding:9px 10px;font-size:15px}
.login .pin{letter-spacing:8px;font-size:18px}
.login button.primary{width:100%;padding:11px;font-size:15px;margin-top:6px}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:12px}
/* 모달/토스트 */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;padding:20px;width:360px;max-width:92vw}
.modal h3{margin:0 0 12px;font-size:16px}
.modal .fld{margin-bottom:10px}.modal input,.modal select{width:100%}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2a3a;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s}
table.rt td{padding:4px 8px}table.rt input{padding:4px 6px}table.rt input.rm{width:70px;text-align:right}table.rt input.rtp{width:100%;min-width:380px}table.rt input.chg{background:#fff4c2;border-color:#e0b400;font-weight:700}
.gtbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:8px 12px;background:#fffbe6;border:1px solid #f0e2a8;border-radius:8px;font-size:13px}.gtbar select{padding:3px 6px}
.chks{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 0}.chks label{display:flex;align-items:center;gap:5px;font-size:14px;color:inherit;margin:0}
#perf{position:fixed;right:10px;bottom:6px;font-size:11px;color:#8a94a6;z-index:5;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:var(--red)}
.section-t{font-size:15px;font-weight:700;margin:18px 0 8px}
.lock{background:var(--red-soft);color:var(--red);border:1px solid #f3c7c7;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-weight:700}
.warn{background:#fff4e0;color:#8a5300;border:1px solid #f1d39c;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.progress{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;width:220px}
.progress i{display:block;height:100%;background:var(--blue);width:0}

/* 숫자 선택판 */
#np{position:fixed;z-index:150;background:#fff;border:1px solid #6b7686;border-radius:8px;box-shadow:0 8px 24px rgba(20,30,50,.25);padding:6px;display:none;width:236px}
#np.show{display:block}
#np .t{font-size:11.5px;color:#46505e;margin:0 2px 5px;display:flex;justify-content:space-between}
#np .gp{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#np button{padding:0;height:32px;font-size:14px;font-weight:700;border-color:#c9d0da;border-radius:5px}
#np button:hover{background:#1f5fbf;color:#fff;border-color:#1f5fbf}
#np button.cur{background:#bcd6ff;border-color:#1f5fbf}
#np button.clr{grid-column:span 2;font-size:12.5px;color:var(--red);font-weight:600}
#np button.more{grid-column:span 3;font-size:12.5px;font-weight:600;color:#46505e}
table.grid td.n{position:relative}
table.grid.pad tbody tr:hover td.n::after,table.grid.pad tbody tr:hover td.c3::after{content:"▾";position:absolute;right:2px;bottom:1px;font-size:9px;color:#7d8898;pointer-events:none}
table.grid td.n input,table.grid tbody td.c3 input{cursor:pointer}

/* 개인목표 에너지바 */
.energy{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #c9d0da;border-radius:8px;padding:8px 14px;margin-bottom:10px}
.energy .el{display:flex;align-items:center;gap:8px;white-space:nowrap}
.energy .el b{font-size:14px}.energy .el span{font-size:12px;color:#46505e;font-weight:600}
.energy .el select{font-weight:700;background:#fffbe6}
.energy .eb{flex:1;position:relative;height:30px;border-radius:15px;background:#e6eaf0;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.energy .eb i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:15px;transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.energy .eb i.hi{background:linear-gradient(90deg,#1e63c4,#2f86f0)}
.energy .eb i.mid{background:linear-gradient(90deg,#f2b705,#ffd84d)}
.energy .eb i.lo{background:linear-gradient(90deg,#d32f2f,#f0625d)}
.energy .eb span{position:absolute;inset:0;display:flex;align-items:center;padding-left:14px;font-weight:700;font-size:13.5px;color:#1d2430;text-shadow:0 0 3px rgba(255,255,255,.9)}
.energy .eb em{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed rgba(29,36,48,.35)}
.energy .eb em.m90{left:90%}.energy .eb em.m50{left:50%}
.energy .ep{font-size:26px;font-weight:800;min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.energy .ep.hi{color:#1e63c4}.energy .ep.mid{color:#b58800}.energy .ep.lo{color:#d32f2f}.energy .ep.none{color:#9aa4b2}
.stats{grid-template-columns:repeat(5,minmax(120px,1fr))!important}
.stats.s6{grid-template-columns:repeat(6,minmax(120px,1fr))!important}
/* 제목 설명 말풍선 */
#tip{position:fixed;z-index:160;max-width:340px;background:#1f2a3a;color:#fff;border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.28);pointer-events:none;display:none;white-space:normal}
#tip.show{display:block}
#tip .tm{color:#ffd84d;font-weight:700;margin-left:4px}
#tip div{margin-top:3px;color:#dfe6ef}
table.grid thead th[data-tip]{cursor:help}
table.grid thead th.hastip{text-decoration:underline dotted #46505e;text-underline-offset:3px}

/* 관리 화면 */
.seg{display:inline-flex;border:1px solid #b9c2cf;border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;background:#fff;color:#46505e;font-weight:600}
.seg button+button{border-left:1px solid #b9c2cf}
.seg button.on{background:#1f2a3a;color:#fff}
.sumrow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:10px}
.sumrow>div{background:#fff;border:1px solid #c9d0da;border-radius:8px;padding:8px 12px;display:flex;flex-direction:column}
.sumrow span{font-size:12px;color:#46505e;font-weight:600}.sumrow b{font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.sumrow em{font-style:normal;font-size:12px;color:#46505e}
.t-hi{color:#1e63c4}.t-lo{color:#d32f2f}
table.mlist th.sort{cursor:pointer;user-select:none}table.mlist th.sort:hover{color:#1d2430}table.mlist th.on{color:#1f5fbf}
table.mlist td{padding:7px 10px}table.mlist tbody tr:nth-child(even) td{background:#f7f9fb}table.mlist tbody tr:hover td{background:#eaf1fc}
table.mlist td.acts{white-space:nowrap}table.mlist td.acts button{padding:4px 9px;margin-right:4px;font-size:12.5px}
.rtag{font-size:11px;background:#e6ebf2;color:#46505e;border-radius:9px;padding:1px 7px;margin-left:3px;font-weight:600}
.mini{display:inline-block;width:70px;height:8px;border-radius:4px;background:#e6eaf0;overflow:hidden;vertical-align:middle;margin-right:7px}
.mini i{display:block;height:100%}
.mini i.r-hi,.legend i.r-hi{background:#2f7be6}.mini i.r-mid,.legend i.r-mid{background:#f2c200}.mini i.r-lo,.legend i.r-lo{background:#e5484d}.legend i.r-no{background:#dfe4ea}
.r-hit{color:#1e63c4}.r-midt{color:#9a7400}.r-lot{color:#d32f2f}
.legend{display:flex;gap:16px;align-items:center;margin:0 0 8px;font-size:12.5px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
table.bd{border-collapse:separate;border-spacing:0;font-size:12.5px}
table.bd th,table.bd td{border-right:1px solid #e1e6ec;border-bottom:1px solid #e1e6ec;text-align:center;padding:0;height:34px;min-width:42px;font-variant-numeric:tabular-nums}
table.bd thead th{position:sticky;top:0;background:#e9edf2;z-index:2;font-weight:700;height:40px;line-height:1.1}
table.bd thead th small{display:block;font-size:10.5px;font-weight:400;color:#46505e}
table.bd thead th.sat,table.bd thead th.sat small{color:#1f5fbf}table.bd thead th.sun,table.bd thead th.sun small{color:#d32f2f}
table.bd .bn{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:0 10px;min-width:130px;border-right:2px solid #8792a3}
table.bd thead .bn{z-index:3;background:#dfe5ec}
table.bd .bn small{display:block;font-size:11px;color:#46505e}
table.bd .bt{background:#f4f6f9;min-width:66px;padding:0 6px}
table.bd thead .bt{background:#dfe5ec}
table.bd td[data-d]{cursor:pointer;font-weight:700}
table.bd td[data-d]:hover{outline:2px solid #1f2a3a;outline-offset:-2px}
table.bd td.r-hi{background:#cfe0fb;color:#0d3f8f}table.bd td.r-mid{background:#fff0b3;color:#6b5200}table.bd td.r-lo{background:#fdd3d3;color:#9b1c1c}table.bd td.r-no{background:#eef1f5}
table.bd td.e{background:#fff}
table.bd tfoot td{position:sticky;bottom:0;background:#e9edf2;font-weight:700;border-top:2px solid #8792a3}
table.bd tfoot .bn{z-index:3;background:#dfe5ec}
details.pp{margin-top:12px}details.pp>summary{cursor:pointer;font-size:15px;font-weight:700;padding:8px 2px;list-style:revert}details.pp>.card{margin-top:6px}
.modal.wide{width:min(900px,94vw)}.modal.md{width:min(480px,94vw)}.modal .acts button{white-space:nowrap}
table.imp td{padding:5px 10px}table.imp input[type=date]{padding:3px 5px}
.ist.ok{color:var(--green);font-weight:700}.ist.warn{color:#a15c00;font-weight:700}.ist.bad{color:var(--red);font-weight:700}
.energy .tgv{font-size:15px;padding:3px 10px;background:#eef1f5;border-radius:6px}
table.mlist select.mtg{padding:3px 4px;font-weight:700;background:#fffbe6}
table.bimp td{padding:6px 8px}table.bimp td.bfn{max-width:300px;overflow:hidden;text-overflow:ellipsis}
table.bimp select.bus{max-width:190px}table.bimp select.bus.miss{border-color:var(--red);background:var(--red-soft)}
table.bimp tr.bdet>td{background:#f7f9fb;padding:8px 10px 12px 40px}table.bimp .bdt{padding:3px 8px;font-size:12px}
.modal input[type=checkbox]{width:auto;margin:0}

/* 연차·토요 */
.red{color:var(--red)!important;font-weight:700}
.lvbar .lvym{font-size:16px;min-width:96px;text-align:center}
.lvlegend{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:8px;font-size:12px}

  // ---- 하루 계산 (엑셀 날짜 시트 1~10행과 동일) ----
  function calcDay(doc, target, mins) {
    const M = minsMap(mins), rt = c => M[c] / 30;
    const r10 = {}, r9 = {}, t = {}; let gq = 0;
    COLS.forEach(x => (r10[x.c] = 0));
    ['C', 'D', 'E', 'F', 'G'].forEach(c => (r9[c] = 0));
    (doc.rows || []).forEach(row => {
      // 엑셀 매크로와 동일 : 주문번호와 수량이 모두 있어야 계산
      if (!row || String(row.o || '').trim() === '' || row.q === '' || row.q == null) return;
      const q = num(row.q), m = row.m || {};
      let typeCol = null, score = 0;
      for (const c of EXCLUSIVE.type) if (m[c]) { typeCol = c; r10[c] += q; break; }
      COLS.forEach(x => {
        if (x.kind === 'type') return;
        const v = m[x.c];
        if (!v) return;
        const n = x.kind === 'ship' ? 1 : x.kind === 'num' ? num(v) : q;
        r10[x.c] += n; score += rt(x.c) * n;
        if (typeCol) t[x.c] = (t[x.c] || 0) + n;          // 조립구분이 있는 줄의 개수 (점수 바뀌어도 다시 계산할 수 있게)
      });
      if (typeCol) {
        if (typeCol === 'G') { score += q * 0.1; gq += q; }
        r9[typeCol] += score;
      }
    });
    const o = doc.other || {};
    const otherMin = OTHER.reduce((s, [k]) => s + num(o[k]), 0);
    const w7 = otherMin / 30;
    const sumType = r9.C + r9.D + r9.E + r9.F + r9.G;

    const g2 = r10.C + r10.D + r10.E;
    const e4 = Math.max(0, num(doc.ot) - (doc.meal === 'O' ? 10 : 0));

    return { r9, r10, t, gq, w7, e2, g2, e4, f6, f7, c8, otherMin, qty: g2, orders: (doc.rows || []).filter(r => r && String(r.o || '').trim()).length };

  function sumDay(s, mins) {
    if (!s || !s.t) return { e2: num(s && s.e2), f7: num(s && s.f7) };

    for (const c in s.t) sc += num(s.t[c]) * (M[c] || 0) / 30;
    const w7 = OTHER.reduce((a, [k]) => a + num((s.o || {})[k]), 0) / 30;
    const e2 = sc + w7, f6 = num(s.d) + num(s.h7) / 60 / 8.5;

  function calcMonth(items, target, mins) {
    const M = minsMap(mins);
    items = items.slice().sort((a, b) => a.date < b.date ? -1 : 1).slice(0, MAX_DAYS);
    let c4 = 0, d4 = 0; const osum = {}; OTHER.forEach(([k]) => (osum[k] = 0));
    const r10 = {}; COLS.forEach(x => (r10[x.c] = 0));
    let sumAU = 0, sumAV = 0, sumAW = 0, otCount = 0;

  async function buildXlsx(JSZip, templateB64, info) {
    // info: {name, ym:'2026-11', target, days:[{date, doc}]}
    const tpl = await JSZip.loadAsync(templateB64, { base64: true });

    ownFirst.sort((a, b) => (b.own - a.own));

      {
        if (duty.some(u => u.d === sd)) continue;
        const nc = 41 + 2 * bi; let o = 0;
        for (let r = 7; r <= 32; r++) {

          let a = dateOf(c[colL(nc + 1) + r], ym);
          if (a && (diffDays(sd, a) < -5 || diffDays(sd, a) > 8)) { warn.push(s.name + ' ' + nm + ' 대체휴무 ' + a + ' 범위 밖 → 비움'); a = null; }

      let o = 0;
      for (let r = 3; r <= 22; r++) { const nm = str(C[colL(11 + 2 * k) + r]); if (!nm) continue; const st = get(nm); duty.push({ d, s: st.id, o: o++, a: null }); }
    }
    if (planDates.length) {
      const cnt = {}; planDates.forEach(d => (cnt[ymOf(d)] = (cnt[ymOf(d)] || 0) + 1));

    const ix = index({ staff: Object.values(staff), leaves, duty, kv: {} });
    const calOnly = [], seenC = new Set();
    for (const { s, ym } of months) {
      excelBlocks(ym).forEach((b, bi) => b.days.slice(0, 5).forEach((d, di) => {
        if (!d) return;
        const have = new Set((ix.byDate[d] || []).map(l => ix.S[l.s].name));
        for (let k = 0; k < 2; k++) for (let r = 0; r < 8; r++) {
          const raw = str(s.cells[colL(4 + 3 * di + k) + (7 + 9 * bi + r)]); if (!raw) continue;
          const nm = raw.replace(/\((훈|오전|오후)\)$/, '');
          const key = d + '|' + nm;
          if (!have.has(nm) && !seenC.has(key)) { seenC.add(key); calOnly.push({ d, name: nm, train: /\(훈\)$/.test(raw), sheet: s.name }); }
        }
      }));
    }
    return {
      staff: order.map(n => staff[n]), leaves, duty,
      kv: { slots, managers, batches },

  }

<script>/* ============================================================
 * 연차·토요근무 화면 (v16)
 *  - 인원 : 우리 파트 달력 + 연차 신청 + 토요근무 바꾸기 요청
 *  - 파트 매니저 : 파트 신청 확인 → [최종 확인] 한 번으로 관리자에게
 *  - 관리자·연차 권한자 : 확정 · 토요 배정 · 바꾸기 반영 · 마감
 * ============================================================ */
(function () {
  'use strict';
  const LC = window.LeaveCore;
  let A = null;
  const L = { tab: null, ym: null, data: null, year: null, ix: null, drag: null, part: '', showPend: true, counts: null };
  const GRADES = ['파트장', 'A', 'B', 'C', 'D', '정리', '안정화', '출력', '매니저', '영상', '계약', '육아휴직', '병가휴가', '근무제외'];
  const OFFS = ['', '직무제외', '계약', '육아휴직', '병가', '근무제외'];
  const REASONS = ['개인정비', '병원 진료', '건강검진', '경조사', '가족 행사', '여행', '이사', '예비군 훈련', '민방위 훈련'];
  const PARTS = ['1그룹', '2그룹', '3그룹', '4그룹', '라인', '제조', '안정화', '지원·출력·기타'];
  const partOf = g => PARTS.includes(g) ? g : '지원·출력·기타';
  const md = d => (+d.slice(5, 7)) + '/' + (+d.slice(8, 10));
  const mdw = d => md(d) + '(' + LC.WD[LC.dow(d)] + ')';
  const ymLab = ym => ym.slice(0, 4) + '년 ' + (+ym.slice(5)) + '월';
  const nextYm = (ym, k) => { const d = LC.toD(ym + '-01'); d.setMonth(d.getMonth() + k); return LC.ymOf(LC.ymd(d)); };
  const stOf = l => l.st || '확정';
  const isPend = l => stOf(l) !== '확정';
  const ST = { 신청: ['req', '파트 확인 전'], 파트확인: ['mgr', '관리자 확정 대기'], 확정: ['ok', '확정'] };

  function init(app) { A = app; }
  // 다른 사람이 신청·확인한 내용이 보이도록 20초 지난 자료는 다시 받음
  async function load(year, force) {
    if (!force && L.data && L.year === year && Date.now() - (L.at || 0) < 20000) return;
    const tk = A.S.token, r = await A.api('lvGet', { year });
    if (tk !== A.S.token) throw new Error('로그인이 바뀌었습니다');      // 로그아웃 뒤 늦게 온 응답은 버림
    L.data = r; L.year = year; L.at = Date.now(); reindex();
  }
  const D = () => L.data;
  const kv = () => L.data.kv || {};
  const me = () => A.S.me;
  const myStaff = () => D().me;
  const ownedGroups = () => Object.keys(D().owners || {}).filter(g => (D().owners[g] || []).includes(me().name));
  const isClosed = ym => (D().closed || []).includes(ym);
  function visibleLeaves() { return L.showPend || !D().all ? D().leaves : D().leaves.filter(l => !isPend(l)); }
  function reindex() {
    L.ix = LC.index(Object.assign({}, L.data, { leaves: visibleLeaves() }));
    L.counts = calcCounts();
    if (A && A.updateBadge) A.updateBadge();
  }
  const staffById = id => (L.ix.S || {})[id];
  const staffList = () => D().staff.slice().sort((a, b) => LC.ko(a.name, b.name));
  const capOf = d => { const c = (kv().caps || {})[LC.dow(d)]; return c ? +c : 0; };
  const isMgr = name => L.ix.managers.has(name);
  const satColor = sat => { let i = LC.tableSaturdays(LC.ymOf(sat)).indexOf(sat); if (i < 0) i = LC.tableSaturdays(nextYm(LC.ymOf(sat), -1)).indexOf(sat); return 'wk' + (i < 0 ? 0 : i % 5); };

  // ------------------------------------------------------------ 숫자 (메뉴 빨간 숫자 · 대시보드)
  function calcCounts() {
    const d = L.data; if (!d) return null;
    const S = {}; (d.staff || []).forEach(s => (S[s.id] = s));
    const own = new Set(ownedGroups());
    const confirmWait = d.canEdit ? d.leaves.filter(l => stOf(l) === '파트확인').length : 0;
    const partWait = d.leaves.filter(l => stOf(l) === '신청' && S[l.s] && own.has(S[l.s].grp)).length;
    const swaps = d.canEdit ? (d.swaps || []).filter(w => w.st === '요청').length : 0;
    const H = LC.holidayMap(d.kv);
    const offList = (date, groups) => {
      const names = [];
      d.leaves.forEach(l => { if (!isPend(l) && l.d1 <= date && l.d2 >= date && S[l.s] && (!groups || !groups.length || groups.includes(S[l.s].grp))) names.push(S[l.s].name); });
      (d.duty || []).forEach(u => { if (u.a === date && S[u.s] && (!groups || !groups.length || groups.includes(S[u.s].grp))) names.push(S[u.s].name); });
      return names;
    };
    return { canEdit: d.canEdit, confirmWait, partWait, swaps, mine: confirmWait + swaps + partWait, H, off: date => new Set(offList(date)), offCount: (date, groups) => new Set(offList(date, groups)).size };
  }
  async function prefetch() {
    const y = +String(A.S.today).slice(0, 4);
    if (!L.data || L.year !== y) await load(y);
    return L.counts;
  }

  // ------------------------------------------------------------ 화면 틀
  async function render(main, tab) {
    L.main = main;
    if (tab) L.tab = tab === 'swap' ? 'conf' : tab;
    L.ym = L.ym || A.S.today.slice(0, 7);
    const y = +L.ym.slice(0, 4);
    if (!L.data || L.year !== y) {
      main.innerHTML = (A.isManager() ? '<div class="ph"><h1>연차 · 토요</h1></div>' : '') + '<div class="muted" style="padding:30px">불러오는 중…</div>';
      try { await load(y); } catch (e) { main.innerHTML = '<div class="warn" style="margin:20px">' + A.esc(e.message) + '</div>'; return; }
      return draw();
    }
    draw();
    if (Date.now() - (L.at || 0) >= 3000) {                          // 먼저 보여주고 뒤에서 새로 받아 다시 그림
      try { await load(y, true); } catch (e) { return; }
      if (A.S.view === 'leave' && L.main === main && document.body.contains(main) && !document.querySelector('.modal-bg')) draw();
    }
  }
  function tabsFor() {
    const d = D();
    if (!d.all) return [['cal', '우리 파트 달력'], ['sum', '내 합계']];
    const t = [];
    if (d.canEdit) t.push(['conf', '확정 대기', L.counts.confirmWait + L.counts.swaps]);
    if (ownedGroups().length) t.push(['part', '파트 신청 확인', L.counts.partWait]);
    t.push(['cal', '달력'], ['rec', '사유 기록부'], ['sat', '토요근무'], ['sum', '개인별 합계']);
    if (d.canEdit) t.push(['set', '인원 · 설정']);
    return t;
  }
  function draw() {
    const d = D(), own = !d.all, main = L.main, tabs = tabsFor();
    if (!L.tab || !tabs.some(t => t[0] === L.tab)) L.tab = tabs[0][0] === 'conf' && !tabs[0][2] ? 'cal' : tabs[0][0];
    const closed = isClosed(L.ym), side = A.isManager();
    main.innerHTML = `
      ${side ? '<div class="ph lvph"><h1>연차 · 토요</h1>' : '<div class="toolbar lvbar">'}
        <button id="lvp" aria-label="이전 달">◀</button><b class="lvym">${ymLab(L.ym)}</b><button id="lvn" aria-label="다음 달">▶</button><button id="lvt">이번 달</button>
        ${closed ? '<span class="chip closed">🔒 마감</span>' : ''}
        <span style="flex:1"></span>
        ${d.canEdit ? '<button id="lvimp" title="기존 연차관리 엑셀(xlsm)을 읽어 전체를 바꿉니다">원본 엑셀 가져오기</button>' : ''}
        ${!own ? `<button id="lvxl">⬇ 엑셀 (${String(L.year).slice(2)}년 전체)</button>` : ''}
        ${d.canEdit ? '<button class="primary" id="lvadd">+ 연차 등록</button>' : ''}
        ${own && myStaff() ? '<button class="primary big" id="lvreq">+ 연차 신청</button>' : ''}
      </div>
      <nav class="lvtabs">${tabs.map(([k, t, n]) => `<button data-lt="${k}" class="${L.tab === k ? 'on' : ''}">${t}${n ? ' <b>' + n + '</b>' : ''}</button>`).join('')}</nav>
      <div id="lvbody" class="${side ? 'pgb' : ''}"></div>`;
    const go = k => { const ny = +nextYm(L.ym, k).slice(0, 4); L.ym = nextYm(L.ym, k); if (ny !== L.year) render(main); else draw(); };
    A.$('#lvp').onclick = () => go(-1); A.$('#lvn').onclick = () => go(1);
    A.$('#lvt').onclick = () => { L.ym = A.S.today.slice(0, 7); render(main); };
    A.$$('[data-lt]').forEach(b => (b.onclick = () => { L.tab = b.dataset.lt; draw(); }));
    if (A.$('#lvimp')) A.$('#lvimp').onclick = importXlsx;
    if (A.$('#lvxl')) A.$('#lvxl').onclick = exportXlsx;
    if (A.$('#lvadd')) A.$('#lvadd').onclick = () => leaveModal({ d1: A.S.today, d2: A.S.today });
    if (A.$('#lvreq')) A.$('#lvreq').onclick = () => requestModal({ d1: A.S.today, d2: A.S.today });
    ({ conf: drawConf, part: drawPart, cal: drawCal, rec: drawRec, sat: drawSat, sum: drawSum, set: drawSet })[L.tab]();
  }
  const body = () => A.$('#lvbody');
  const refresh = () => { reindex(); draw(); };

  // ------------------------------------------------------------ 조사 기간 안내 (월말 마지막 주)
  function surveyBanner() {
    const t = A.S.today, ym = t.slice(0, 7), last = LC.monthLast(ym);
    let mon = last; while (LC.dow(mon) !== 1) mon = LC.addDays(mon, -1);
    if (t < mon) return '';
    const nx = nextYm(ym, 1);
    return `<div class="lvsurvey">📣 지금은 <b>${ymLab(nx)} 연차 조사 기간</b>입니다 (${md(mon)} ~ ${md(last)}) · ${+nx.slice(5)}월에 쉴 날을 이번 주 안에 신청해 주세요</div>`;
  }

  // ------------------------------------------------------------ 달력
  function chipHtml(x, own) {
    const l = x.l, s = x.s || {}, st = stOf(l), mine = myStaff() && l.s === myStaff().id;
    const cls = 'lv' + (st === '신청' ? ' req' : st === '파트확인' ? ' mgr' : '') + (l.t ? ' tr' : '') + (own && mine ? ' me' : '');
    const tip = `${s.name || ''} ${md(l.d1)}${l.d2 !== l.d1 ? '~' + md(l.d2) : ''}${l.h ? ' ' + l.h + ' 반차' : ''} · ${ST[st][1]}${l.r ? ' · ' + l.r : ''}`;
    return `<span class="${cls}" data-l="${l.id}" title="${A.esc(tip)}">${A.esc(s.name || '?')}${l.t ? '(훈)' : ''}${l.h ? '<i>' + l.h + '</i>' : ''}</span>`;
  }
  function drawCal() {
    const d = D(), own = !d.all, ym = L.ym, H = L.ix.H, weeks = LC.screenWeeks(ym);
    const pf = s => !L.part || (s && partOf(s.grp) === L.part);
    let html = own ? surveyBanner() : `
      <div class="lvfilter"><span class="lb">파트</span>${[''].concat(PARTS).map(p => `<button data-pt="${p}" class="pill${L.part === p ? ' on' : ''}">${p || '전체'}</button>`).join('')}
        <span style="flex:1"></span>
        <label class="lvchk"><input type="checkbox" id="lvsp" ${L.showPend ? 'checked' : ''}> 확정 전 신청도 보기</label></div>`;
    html += `<div class="lvlegend"><span class="lv">확정</span><span class="lv req">파트 확인 전</span><span class="lv mgr">관리자 확정 대기</span><span class="lv tr">훈련</span>${own ? '<span class="lv me">나</span>' : ''}
      <span class="lb" style="margin-left:10px">토요근무 · 대체휴무 (같은 주 같은 색)</span>${LC.tableSaturdays(ym).map((x, i) => `<span class="sw wk${i}">${md(x)}</span>`).join('')}
      <span style="flex:1"></span><span class="muted">${d.canEdit ? '날짜를 끌어서 연차 등록 · 이름을 누르면 수정' : own && myStaff() ? '날짜를 끌어서 연차 신청 · 이름을 누르면 내용 보기' : '이름을 누르면 내용 보기'}</span></div>`;
    html += `<div class="lvcal2"><div class="lvhd2">${['월', '화', '수', '목', '금', '토'].map(w => `<div class="${w === '토' ? 'sat' : ''}">${w}요일${w === '토' ? '' : '<div class="sub"><span>연차</span><span>대체</span></div>'}</div>`).join('')}</div>`;
    weeks.forEach(days => {
      html += '<div class="lvwk2">';
      days.forEach((dd, i) => {
        const other = LC.ymOf(dd) !== ym, hol = H[dd];
        if (i === 5) {
          const list = (L.ix.duty[dd] || []).map(u => ({ u, s: staffById(u.s) })).filter(x => x.s && pf(x.s));
          html += `<div class="lvd2 sat${other ? ' other' : ''}" data-sat="${dd}" title="누르면 명단·대체휴무일 보기"><div class="hd"><b class="dn">${md(dd)}</b>${hol ? `<span class="hn">${A.esc(hol)}</span>` : ''}${list.length ? `<span class="sb ${satColor(dd)}">토요근무 ${list.length}명</span>` : ''}</div>
            ${list.length ? `<div class="rw">${list.map(x => `<span class="sw ${satColor(dd)}${own && myStaff() && x.s.id === myStaff().id ? ' me' : ''}">${A.esc(x.s.name)}</span>`).join('')}</div>` : other ? '' : '<div class="satc none">미배정</div>'}</div>`;
          return;
        }
        const c = LC.dayCell(L.ix, dd), cap = d.all ? capOf(dd) : 0, over = cap && c.off > cap;
        const lv = c.lv.filter(x => pf(x.s)), al = c.al.filter(x => pf(x.s));
        html += `<div class="lvd2${other ? ' other' : ''}${hol ? ' hol' : ''}${over ? ' over' : ''}" data-d="${dd}">
          <div class="hd"><b class="dn">${md(dd)}</b>${hol ? `<span class="hn">${A.esc(hol)}</span>` : ''}${d.all && L.part ? (lv.length + al.length ? `<span class="n">휴무 ${lv.length + al.length}</span>` : '') : d.all && (c.off || cap) ? `<span class="n${over ? ' red' : ''}">휴무 ${c.off}${cap ? '/' + cap : ''}</span>` : ''}</div>
          <div class="dbody"><div class="rw">${lv.map(x => chipHtml(x, own)).join('')}</div>
          <div class="rw ar">${al.map(x => `<span class="sw ${satColor(x.u.d)}${own && myStaff() && x.u.s === myStaff().id ? ' me' : ''}" data-u="${x.u.d}|${x.u.s}" title="${A.esc(x.name)} · ${md(x.u.d)} 토요근무의 대체휴무">${A.esc(x.name)}</span>`).join('')}</div></div></div>`;
      });
      html += '</div>';
    });
    html += '</div>';
    if (d.all) html += calSummary(pf);
    if (own) html = `<div class="lvown"><div class="lvownc">${html}</div><aside class="lvmine">${mineHtml()}</aside></div>`;
    body().innerHTML = html;
    A.$$('[data-pt]').forEach(b => (b.onclick = () => { L.part = b.dataset.pt; drawCal(); }));
    if (A.$('#lvsp')) A.$('#lvsp').onchange = e => { L.showPend = e.target.checked; reindex(); drawCal(); };
    A.$$('.lvcal2 [data-l]').forEach(el => (el.onclick = ev => { ev.stopPropagation(); const l = d.leaves.find(x => x.id === el.dataset.l); if (l) leaveModal({ edit: l }); }));
    A.$$('.lvcal2 [data-u]').forEach(el => (el.onclick = ev => { ev.stopPropagation(); const [sd, sid] = el.dataset.u.split('|'); A.toast((staffById(sid) || {}).name + ' : ' + mdw(sd) + ' 토요근무 → ' + mdw(el.closest('[data-d]').dataset.d) + ' 대체휴무'); }));
    A.$$('.lvcal2 [data-sat]').forEach(el => (el.onclick = () => satList(el.dataset.sat, pf)));
    A.$$('[data-gt]').forEach(b => (b.onclick = () => { L.tab = b.dataset.gt; draw(); }));
    A.$$('[data-sp]').forEach(b => (b.onclick = () => { L.part = b.dataset.sp; drawCal(); }));
    if (own) bindMine();
    if (d.canEdit || (own && myStaff())) bindDrag(d.canEdit ? (a, b) => leaveModal({ d1: a, d2: b }) : (a, b) => requestModal({ d1: a, d2: b }));
  }
  // 달력 아래 요약 (관리자·매니저) : 파트 버튼을 누르면 그 파트 기준
  function calSummary(pf) {
    const d = D(), ym = L.ym, H = L.ix.H, f = LC.monthFirst(ym), last = LC.monthLast(ym), c = L.counts || {};
    const inM = d.leaves.filter(l => l.d2 >= f && l.d1 <= last && staffById(l.s));
    const mine = inM.filter(l => pf(staffById(l.s)));
    const days = list => list.reduce((a, l) => a + LC.leaveDays(l, H, f, last), 0);
    const fmt = n => String(Math.round(n * 10) / 10);
    const ok = mine.filter(l => !isPend(l)), req = mine.filter(l => stOf(l) === '신청'), mg = mine.filter(l => stOf(l) === '파트확인');
    // ② 파트별 (확정 기준)
    const byP = PARTS.map(p => [p, days(inM.filter(l => !isPend(l) && partOf(staffById(l.s).grp) === p))]);
    const mx = Math.max(1, ...byP.map(x => x[1]));
    // ③ 토요근무
    const sats = LC.monthSaturdays(ym).map(sd => { const u = (L.ix.duty[sd] || []).filter(x => pf(staffById(x.s))); return { sd, n: u.length, noAlt: u.filter(x => !x.a).length }; });
    const noAlt = sats.reduce((a, x) => a + x.noAlt, 0);
    // ④ 주의할 날
    const wd = []; for (let x = f; x <= last; x = LC.addDays(x, 1)) if (LC.isWork(x, H)) {
      const cell = LC.dayCell(L.ix, x), n = cell.lv.filter(y => pf(y.s)).length + cell.al.filter(y => pf(y.s)).length, cap = L.part ? 0 : capOf(x);
      wd.push({ x, n, over: cap && cell.off > cap, cap });
    }
    const over = wd.filter(x => x.over), top = wd.slice().sort((a, b) => b.n - a.n || LC.ko(a.x, b.x)).filter(x => x.n).slice(0, 3);
    // ⑤ 처리할 것
    const todo = [];
    if (d.canEdit && c.confirmWait) todo.push(`<button data-gt="conf" class="sm">확정 대기 <b>${c.confirmWait}</b>건 →</button>`);
    if (d.canEdit && c.swaps) todo.push(`<button data-gt="conf" class="sm">토요 바꾸기 요청 <b>${c.swaps}</b>건 →</button>`);
    if (c.partWait) todo.push(`<button data-gt="part" class="sm">우리 파트 확인 전 <b>${c.partWait}</b>건 →</button>`);
    const ttl = (t, sub) => `<div class="st">${t}${sub ? `<span class="muted">${sub}</span>` : ''}</div>`;
    return `<div class="lvsum">
      <div class="card">${ttl(ymLab(ym) + ' 연차', L.part ? A.esc(L.part) : '전체')}
        <div class="big"><b>${fmt(days(ok))}</b>일 <span class="muted">확정 ${ok.length}건</span></div>
        <div class="row"><span class="lv req">파트 확인 전</span><span><b>${req.length}</b>건</span><span class="muted">${fmt(days(req))}일</span></div>
        <div class="row"><span class="lv mgr">관리자 확정 대기</span><span><b>${mg.length}</b>건</span><span class="muted">${fmt(days(mg))}일</span></div></div>
      <div class="card">${ttl('파트별 사용', '확정 · 일')}
        ${byP.map(([p, n]) => `<div class="pbar${L.part === p ? ' on' : ''}" data-sp="${L.part === p ? '' : p}" title="누르면 ${L.part === p ? '전체' : p} 보기"><span>${p}</span><i><em style="width:${n / mx * 100}%"></em></i><b>${fmt(n)}</b></div>`).join('')}</div>
      <div class="card">${ttl('토요근무', '주별 인원')}
        ${sats.map((x, i) => `<div class="row"><span class="sw ${satColor(x.sd)}">${mdw(x.sd)}</span><span><b>${x.n}</b>명</span>${x.noAlt ? `<span class="muted">대체 미정 ${x.noAlt}</span>` : ''}</div>`).join('') || '<div class="muted">토요일 없음</div>'}
        ${noAlt ? `<div class="warnl">대체휴무 미정 ${noAlt}명</div>` : '<div class="okl">✓ 대체휴무 모두 정해짐</div>'}</div>
      <div class="card">${ttl('주의할 날', L.part ? '' : '상한 넘는 날')}
        ${L.part ? '' : over.length ? over.map(x => `<div class="row"><b class="red">${mdw(x.x)}</b><span>휴무 ${x.n}/${x.cap}</span></div>`).join('') : '<div class="okl">✓ 상한 넘는 날 없음</div>'}
        <div class="sub">휴무 많은 날</div>${top.map(x => `<div class="row"><b>${mdw(x.x)}</b><span>${x.n}명</span></div>`).join('') || '<div class="muted">없음</div>'}</div>
      <div class="card">${ttl('처리할 것')}
        ${todo.length ? `<div class="todo2">${todo.join('')}</div>` : '<div class="okl">✓ 처리할 것이 없습니다</div>'}
        ${isClosed(ym) ? '<div class="muted" style="margin-top:8px">🔒 ' + ymLab(ym) + ' 마감됨</div>' : ''}</div>
    </div>`;
  }
  // 토요일 명단 (달력에서 토요일을 누르면)
  function satList(sd, pf) {
    const d = D(), list = (L.ix.duty[sd] || []).map(u => ({ u, s: staffById(u.s) })).filter(x => x.s && pf(x.s));
    const by = {}; list.forEach(x => { const p = partOf(x.s.grp) || '기타'; (by[p] = by[p] || []).push(x); });
    A.modal(`<h3>${mdw(sd)} 토요근무 ${list.length}명</h3>
      ${list.length ? Object.keys(by).map(p => `<div class="satg"><b>${A.esc(p)}</b><div class="rw">${by[p].map(x => `<span class="sw al${myStaff() && x.s.id === myStaff().id ? ' me' : ''}" title="${x.u.a ? '대체휴무 ' + md(x.u.a) : '대체휴무 미정'}">${A.esc(x.s.name)}${x.u.a ? ' <i>' + md(x.u.a) + '</i>' : ''}</span>`).join('')}</div></div>`).join('') : '<div class="muted" style="padding:10px 0">배정된 인원이 없습니다</div>'}
      <div class="muted" style="font-size:12px;margin-top:6px">이름 옆 날짜 = 대체휴무일</div>
      <div class="acts">${d.canEdit ? '<button data-go>토요근무 탭에서 고치기</button>' : ''}<button class="primary" data-n>닫기</button></div>`, (bg, close) => {
      A.$('[data-n]', bg).onclick = close;
      if (A.$('[data-go]', bg)) A.$('[data-go]', bg).onclick = () => { close(); L.tab = 'sat'; L.satFocus = sd; draw(); };
    }, 'md');
  }
  function bindDrag(open) {
    const cells = A.$$('.lvcal2 .lvd2[data-d]');
    const paint = () => { const [a, b] = L.drag ? [L.drag.a, L.drag.b].sort() : ['', '']; cells.forEach(c => c.classList.toggle('selc', !!L.drag && c.dataset.d >= a && c.dataset.d <= b)); };
    cells.forEach(c => {
      c.onmousedown = ev => { if (ev.button !== 0 || ev.target.closest('[data-l],[data-u]')) return; ev.preventDefault(); L.drag = { a: c.dataset.d, b: c.dataset.d }; paint(); };
      c.onmouseenter = () => { if (L.drag) { L.drag.b = c.dataset.d; paint(); } };
    });
    document.onmouseup = () => { if (!L.drag) return; const [a, b] = [L.drag.a, L.drag.b].sort(); L.drag = null; paint(); if (A.$('.lvcal2')) open(a, b); };
  }

  // ------------------------------------------------------------ 인원 : 내 신청 내역 · 내 토요근무
  function mineHtml() {
    const d = D(), my = myStaff();
    if (!my) return '<div class="card lvmc"><b>연차 인원표에 이름이 없습니다</b><div class="muted" style="margin-top:6px;line-height:1.6">로그인 이름과 연차 인원표의 이름이 같아야 신청할 수 있습니다. 관리자에게 문의하세요.</div></div>';
    const today = A.S.today, from = LC.addDays(today, -40);
    const mine = d.leaves.filter(l => l.s === my.id && l.d2 >= from).sort((a, b) => LC.ko(b.d1, a.d1)).slice(0, 8);
    const duty = (d.duty || []).filter(u => u.s === my.id && u.d >= LC.addDays(today, -7)).sort((a, b) => LC.ko(a.d, b.d)).slice(0, 6);
    const sw = (d.swaps || []).filter(w => w.s === my.id);
    const owners = (d.owners || {})[my.grp] || [];
    return `<div class="card lvmc"><div class="lvmt"><b>내 신청 내역</b><span class="muted">${owners.length ? A.esc(my.grp) + ' 확인 : ' + A.esc(owners.join(', ')) : '담당 매니저 없음 → 바로 관리자'}</span></div>
      ${mine.length ? mine.map(l => { const st = stOf(l); return `<div class="lvmi"><div class="t"><b>${mdw(l.d1)}${l.d2 !== l.d1 ? ' ~ ' + mdw(l.d2) : ''}${l.h ? ' ' + l.h : ''}</b><span class="muted">${LC.leaveDays(l, L.ix.H)}일</span><span style="flex:1"></span><span class="lst ${ST[st][0]}">${ST[st][1]}</span></div>
        <div class="r">${A.esc(l.r || '')}</div>${l.n ? `<div class="nt">💬 ${A.esc(l.n)}</div>` : ''}${st === '신청' && !isClosed(LC.ymOf(l.d1)) ? `<div class="a"><button data-cx="${l.id}" class="sm">신청 취소</button></div>` : ''}</div>`; }).join('') : '<div class="muted" style="padding:10px 0">최근 신청이 없습니다</div>'}
    </div>
    <div class="card lvmc"><div class="lvmt"><b>내 토요근무</b></div>
      ${duty.length ? duty.map(u => { const w = sw.find(x => x.d === u.d && x.st === '요청'), done = sw.filter(x => x.d === u.d && x.st !== '요청').pop();
        return `<div class="lvmd"><span class="sw ${satColor(u.d)}" style="font-weight:800">${mdw(u.d)}</span><span class="muted">${u.a ? '대체 ' + mdw(u.a) : '대체휴무 미정'}</span><span style="flex:1"></span>
          ${w ? `<span class="lst mgr" title="${A.esc(swapText(w))}">요청중</span><button data-wx="${w.id}" class="sm">취소</button>` : isClosed(LC.ymOf(u.d)) ? '<span class="muted">🔒 마감</span>' : u.d >= today ? `<button data-sw="${u.d}" class="sm">바꾸기 요청</button>` : ''}</div>${done && !w ? `<div class="nt">${done.st === '반영' ? '✓ 반영됨' : '✕ 반려'} : ${A.esc(swapText(done))}${done.n ? ' · ' + A.esc(done.n) : ''}</div>` : ''}`; }).join('') : '<div class="muted" style="padding:10px 0">배정된 토요근무가 없습니다</div>'}
    </div>`;
  }
  function swapText(w) {
    const o = staffById(w.o);
    return w.k === 'move' ? md(w.d) + ' → ' + md(w.to) + ' 로 옮기기' : w.k === 'swap' ? md(w.d) + ' ↔ ' + (o ? o.name : '?') + (w.od ? ' (' + md(w.od) + ')' : '') + ' 맞바꾸기' : md(w.d) + ' 대체휴무 → ' + md(w.to);
  }
  function bindMine() {
    const d = D();
    A.$$('[data-cx]').forEach(b => (b.onclick = async () => {
      const l = d.leaves.find(x => x.id === b.dataset.cx);
      if (!(await A.confirmBox(mdw(l.d1) + (l.d2 !== l.d1 ? ' ~ ' + mdw(l.d2) : '') + ' 신청을 취소할까요?', '신청 취소'))) return;
      try { await A.api('lvCancel', { id: l.id }); d.leaves = d.leaves.filter(x => x.id !== l.id); A.toast('신청을 취소했습니다'); refresh(); } catch (e) { A.toast(e.message, true); }
    }));
    A.$$('[data-sw]').forEach(b => (b.onclick = () => swapModal(b.dataset.sw)));
    A.$$('[data-wx]').forEach(b => (b.onclick = async () => {
      if (!(await A.confirmBox('토요근무 바꾸기 요청을 취소할까요?', '요청 취소'))) return;
      try { await A.api('lvSwapCancel', { id: b.dataset.wx }); d.swaps = d.swaps.filter(x => x.id !== b.dataset.wx); A.toast('요청을 취소했습니다'); refresh(); } catch (e) { A.toast(e.message, true); }
    }));
  }

  // ------------------------------------------------------------ 인원 : 연차 신청 창
  function requestModal(o) {
    const d = D(), my = myStaff(); if (!my) return A.toast('연차 인원표에 이름이 없습니다. 관리자에게 문의하세요', true);
    const owners = (d.owners || {})[my.grp] || [];
    A.modal(`<h3>연차 신청 <span class="muted" style="font-size:13px;font-weight:400">${A.esc(my.name)} · ${A.esc(my.grp)}</span></h3>
      <div class="row" style="gap:10px;flex-wrap:nowrap">
        <div class="fld"><label>시작일</label><input type="date" id="rqd1" value="${o.d1}"></div>

  // ------------------------------------------------------------ 파트 매니저 : 파트 신청 확인
  function drawPart() {
    const d = D(), groups = ownedGroups(), f = LC.monthFirst(L.ym), l = LC.monthLast(L.ym), H = L.ix.H;
    const inG = x => { const s = staffById(x.s); return s && groups.includes(s.grp); };
    const pend = d.leaves.filter(x => stOf(x) === '신청' && inG(x));
    const list = pend.filter(x => x.d2 >= f && x.d1 <= l).sort((a, b) => LC.ko(a.d1, b.d1) || LC.ko((staffById(a.s) || {}).name, (staffById(b.s) || {}).name));
    const other = {}; pend.filter(x => !(x.d2 >= f && x.d1 <= l)).forEach(x => (other[LC.ymOf(x.d1)] = (other[LC.ymOf(x.d1)] || 0) + 1));
    const sent = d.leaves.filter(x => stOf(x) !== '신청' && inG(x) && x.rb && x.d2 >= f && x.d1 <= l);
    const gOff = date => d.leaves.filter(x => x.d1 <= date && x.d2 >= date && inG(x)).length + (d.duty || []).filter(u => u.a === date && inG(u)).length;
    const peak = x => { let m = 0; for (let t = x.d1; t <= x.d2; t = LC.addDays(t, 1)) if (LC.isWork(t, H)) m = Math.max(m, gOff(t)); return m; };
    const days = []; for (let t = f; t <= l; t = LC.addDays(t, 1)) if (LC.dow(t) >= 1 && LC.dow(t) <= 5) days.push(t);
    const gl = groups.join(' · ');
    body().innerHTML = `<div class="lvpart">
      <div>
        <section class="card lvsec"><div class="lvst"><b>${A.esc(gl)} ${ymLab(L.ym)} 연차 신청 ${list.length}건</b><span class="muted">전체를 훑어보고, 인원과 조율한 건만 날짜를 고친 뒤 아래 [최종 확인] 한 번</span></div>
          ${Object.keys(other).length ? `<div class="lvw" style="margin:0 0 10px">다른 달에도 확인 전 신청이 있습니다 : ${Object.keys(other).sort().map(m => `<a href="#" data-gm="${m}">${ymLab(m)} ${other[m]}건</a>`).join(' · ')}</div>` : ''}
          <table class="list lvtbl"><thead><tr><th>이름</th>${groups.length > 1 ? '<th>파트</th>' : ''}<th>기간</th><th class="num">일수</th><th>사유</th><th>신청일</th><th class="num">그날 파트 휴무</th><th></th></tr></thead><tbody>
          ${list.map(x => { const s = staffById(x.s) || {}, pk = peak(x); return `<tr><td><b>${A.esc(s.name || '?')}</b></td>${groups.length > 1 ? `<td>${A.esc(s.grp || '')}</td>` : ''}<td>${mdw(x.d1)}${x.d2 !== x.d1 ? ' ~ ' + mdw(x.d2) : ''}${x.h ? ' ' + x.h : ''}${x.t ? ' <span class="tag tr">훈</span>' : ''}</td>
            <td class="num">${LC.leaveDays(x, H)}</td><td class="rs">${A.esc(x.r || '')}${x.n ? '<div class="nt">💬 ' + A.esc(x.n) + '</div>' : ''}</td><td class="muted">${A.esc((x.at || '').slice(5, 10).replace('-', '/'))}</td>
            <td class="num"><span class="cnt ${pk >= 3 ? 'hi' : ''}">${pk}명${pk >= 3 ? ' ⚠' : ''}</span></td><td><button class="sm" data-pe="${x.id}">날짜 수정</button></td></tr>`; }).join('') || `<tr><td colspan="8" class="muted" style="padding:18px">${ymLab(L.ym)} 확인할 신청이 없습니다</td></tr>`}
          </tbody></table>
          <div class="lvgo"><div><b>확인이 끝나면 아래 버튼을 한 번만 누르세요</b><span class="muted">${list.length}건이 한꺼번에 관리자에게 넘어갑니다 · 이후에 들어온 신청은 여기에 다시 모입니다</span></div>
            <button class="primary big" id="pcf" ${list.length ? '' : 'disabled'}>✓ ${A.esc(gl)} 최종 확인 → 관리자에게 (${list.length}건)</button></div>
        </section>
        <section class="card lvsec"><div class="lvst"><b>이미 넘긴 신청 ${sent.length}건</b><span class="muted">관리자 확정 대기 ${sent.filter(x => stOf(x) === '파트확인').length} · 확정 ${sent.filter(x => stOf(x) === '확정').length}</span></div>
          <div class="muted" style="line-height:1.8">${sent.map(x => A.esc((staffById(x.s) || {}).name) + ' ' + md(x.d1) + (x.d2 !== x.d1 ? '~' + md(x.d2) : '') + (stOf(x) === '확정' ? ' ✓' : '')).join(' · ') || '없음'}</div></section>
      </div>
      <aside class="card lvsec lvmini"><div class="lvst"><b>${A.esc(gl)} ${+L.ym.slice(5)}월 휴무 현황</b></div><span class="muted" style="font-size:12.5px">신청 · 확인 · 확정 · 대체휴무 모두 포함</span>
        <div class="mgrid">${['월', '화', '수', '목', '금'].map(w => `<b>${w}</b>`).join('')}${(() => { const lead = days.length ? LC.dow(days[0]) - 1 : 0, cells = []; for (let i = 0; i < lead; i++) cells.push('<span></span>'); days.forEach(t => { const n = gOff(t), h = H[t]; cells.push(`<span class="mc ${h ? 'hol' : n >= 3 ? 'h3' : n === 2 ? 'h2' : n === 1 ? 'h1' : ''}" title="${h ? A.esc(h) : ''}"><small>${md(t)}</small>${h ? '휴일' : n ? n + '명' : '-'}</span>`); }); return cells.join(''); })()}</div></aside>
    </div>`;
    A.$$('[data-gm]').forEach(a => (a.onclick = e => { e.preventDefault(); const ny = +a.dataset.gm.slice(0, 4); L.ym = a.dataset.gm; if (ny !== L.year) render(L.main); else draw(); }));
    A.$$('[data-pe]').forEach(b => (b.onclick = () => partEditModal(d.leaves.find(x => x.id === b.dataset.pe))));
    if (A.$('#pcf')) A.$('#pcf').onclick = async () => {
      if (!(await A.confirmBox(`<b>${A.esc(gl)} ${ymLab(L.ym)} 신청 ${list.length}건</b>을 최종 확인하고 관리자에게 넘깁니다.<br><span class="muted">넘긴 뒤에는 인원이 직접 취소할 수 없습니다.</span>`, '최종 확인'))) return;
      try { const r = await A.api('lvPartConfirm', { ids: list.map(x => x.id) }); list.forEach(x => { x.st = '파트확인'; x.pb = me().name; }); A.toast(r.n + '건을 관리자에게 넘겼습니다'); refresh(); } catch (e) { A.toast(e.message, true); }
    };
  }
  function partEditModal(x) {
    const s = staffById(x.s) || {};

      <div class="muted" style="margin-bottom:8px">원래 신청 : ${mdw(x.d1)}${x.d2 !== x.d1 ? ' ~ ' + mdw(x.d2) : ''}${x.h ? ' ' + x.h : ''} · ${A.esc(x.r || '')}</div>
      <div class="row" style="gap:10px;flex-wrap:nowrap"><div class="fld"><label>시작일</label><input type="date" id="pe1" value="${x.d1}"></div><div class="fld"><label>종료일</label><input type="date" id="pe2" value="${x.d2}"></div>
        <div class="fld"><label>구분</label><select id="peh"><option value="">종일</option><option ${x.h === '오전' ? 'selected' : ''}>오전</option><option ${x.h === '오후' ? 'selected' : ''}>오후</option></select></div></div>
      <div class="fld"><label>메모 <span class="muted">(인원 화면에 보임)</span></label><input id="pen" maxlength="100" placeholder="예) 13일은 오후 반차로 조율"></div>
      <div class="acts"><button data-n>취소</button><button class="primary" data-y>저장</button></div>`, (bg, close) => {

      A.$('[data-y]', bg).onclick = async () => {

        try { const r = await A.api('lvPartEdit', { id: x.id, d1: v('#pe1'), d2: v('#pe2'), half: v('#peh'), note: v('#pen').trim() }); Object.assign(x, r.leaves[0]); close(); A.toast('날짜를 고쳤습니다'); refresh(); } catch (e) { A.toast(e.message, true); }
      };

  }

  // ------------------------------------------------------------ 관리자 : 확정 대기 · 토요 바꾸기 · 마감
  function drawConf() {
    const d = D(), f = LC.monthFirst(L.ym), l = LC.monthLast(L.ym), H = L.ix.H;
    const inM = x => x.d2 >= f && x.d1 <= l, pf = x => !L.part || partOf((staffById(x.s) || {}).grp) === L.part;
    const wait = d.leaves.filter(x => stOf(x) === '파트확인' && inM(x)), pre = d.leaves.filter(x => stOf(x) === '신청' && inM(x));
    const otherM = {}; d.leaves.filter(x => stOf(x) === '파트확인' && !inM(x)).forEach(x => (otherM[LC.ymOf(x.d1)] = (otherM[LC.ymOf(x.d1)] || 0) + 1));
    const list = wait.filter(pf).sort((a, b) => LC.ko(a.d1, b.d1));
    const peak = x => { let m = 0, cap = 0; for (let t = x.d1; t <= x.d2; t = LC.addDays(t, 1)) if (LC.isWork(t, H)) { const n = LC.dayCell(L.ix, t).off; if (n >= m) { m = n; cap = capOf(t); } } return { m, cap }; };
    const byPart = {}; wait.forEach(x => { const p = partOf((staffById(x.s) || {}).grp); byPart[p] = (byPart[p] || 0) + 1; });
    const prePart = {}; pre.forEach(x => { const p = partOf((staffById(x.s) || {}).grp); prePart[p] = (prePart[p] || 0) + 1; });
    const swaps = (d.swaps || []).filter(w => w.st === '요청').sort((a, b) => LC.ko(a.d, b.d));
    const overDays = []; for (let t = f; t <= l; t = LC.addDays(t, 1)) if (LC.isWork(t, H)) { const c = capOf(t), n = LC.dayCell(L.ix, t).off; if (c && n > c) overDays.push(md(t) + ' ' + n + '/' + c); }
    const emptySat = LC.monthSaturdays(L.ym).filter(s => !(L.ix.duty[s] || []).length);
    const closed = isClosed(L.ym), ready = !wait.length && !pre.length;
    body().innerHTML = `<div class="lvconf"><div>
      <div class="lvfilter"><span class="lb">파트</span>${[''].concat(PARTS).map(p => `<button data-pt="${p}" class="pill${L.part === p ? ' on' : ''}">${p || '전체'} ${p ? (byPart[p] || 0) : wait.length}${p && prePart[p] ? ' <small>· 확인 전 ' + prePart[p] + '</small>' : ''}</button>`).join('')}</div>
      ${Object.keys(otherM).length ? `<div class="lvw" style="margin:0 0 10px">다른 달 확정 대기 : ${Object.keys(otherM).sort().map(m => `<a href="#" data-gm="${m}">${ymLab(m)} ${otherM[m]}건</a>`).join(' · ')}</div>` : ''}
      <section class="card lvsec" style="padding:0;overflow:auto"><table class="list lvtbl"><thead><tr><th><input type="checkbox" id="cfa" aria-label="모두 선택"></th><th>이름</th><th>파트</th><th>기간</th><th class="num">일수</th><th>사유</th><th>파트 확인</th><th class="num">그날 전체</th><th></th></tr></thead><tbody>
        ${list.map(x => { const s = staffById(x.s) || {}, pk = peak(x), ov = pk.cap && pk.m > pk.cap; return `<tr><td><input type="checkbox" class="cfc" value="${x.id}" aria-label="선택"></td><td><b class="${isMgr(s.name) ? 'mgrt' : ''}">${A.esc(s.name || '?')}</b></td><td>${A.esc(s.grp || '')}</td>
          <td>${mdw(x.d1)}${x.d2 !== x.d1 ? ' ~ ' + mdw(x.d2) : ''}${x.h ? ' ' + x.h : ''}${x.t ? ' <span class="tag tr">훈</span>' : ''}</td><td class="num">${LC.leaveDays(x, H)}</td>
          <td class="rs">${A.esc(x.r || '')}${x.n ? '<div class="nt">💬 ' + A.esc(x.n) + '</div>' : ''}</td><td class="muted">✓ ${A.esc(x.pb || '')}</td>
          <td class="num"><span class="cnt ${ov ? 'hi' : ''}">${pk.m}${pk.cap ? '/' + pk.cap : ''}</span></td>
          <td style="white-space:nowrap"><button class="sm" data-ce="${x.id}">수정</button> <button class="sm primary" data-c1="${x.id}">확정</button></td></tr>`; }).join('') || `<tr><td colspan="9" class="muted" style="padding:18px">${ymLab(L.ym)}${L.part ? ' ' + L.part : ''} 확정 대기 없음</td></tr>`}
      </tbody></table>
      <div class="lvgo"><span class="muted" style="flex:1">상한 넘는 날은 빨간 숫자 · [수정]으로 날짜를 바꾸면 인원 화면에 "조정 메모"가 보입니다</span><button id="cfs">선택한 건 확정</button><button class="primary" id="cfall" ${list.length ? '' : 'disabled'}>${L.part ? A.esc(L.part) + ' ' : ''}전체 확정 (${list.length}건)</button></div></section>
      ${pre.length ? `<details class="lvpre"><summary>파트 확인 전 신청 ${pre.length}건 <span class="muted">(${Object.keys(prePart).map(p => p + ' ' + prePart[p]).join(' · ')}) — 필요하면 여기서 바로 확정 가능</span></summary>
        <div class="muted" style="line-height:1.9;padding:8px 2px">${pre.map(x => `<a href="#" data-ce="${x.id}">${A.esc((staffById(x.s) || {}).name || '?')} ${md(x.d1)}${x.d2 !== x.d1 ? '~' + md(x.d2) : ''}</a>`).join(' · ')}</div></details>` : ''}
    </div>
    <div class="lvside">
      <section class="card lvsec"><div class="lvst"><b>토요근무 바꾸기 요청 ${swaps.length}건</b></div>
        ${swaps.map(w => { const s = staffById(w.s) || {}; return `<div class="swc"><div><b>${A.esc(s.name || '?')}</b> <span class="muted">${A.esc(s.grp || '')}</span></div><div>${A.esc(swapText(w))}</div>${w.r ? `<div class="muted" style="font-size:12.5px">${A.esc(w.r)}</div>` : ''}
          <div class="a"><button class="sm danger" data-wn="${w.id}">반려</button><button class="sm primary" data-wy="${w.id}">반영</button></div></div>`; }).join('') || '<div class="muted">없음</div>'}
      </section>
      <section class="card lvsec"><div class="lvst"><b>${ymLab(L.ym)} 마감</b>${closed ? '<span class="chip closed">🔒 마감됨</span>' : ''}</div>
        <div class="ck ${pre.length ? 'bad' : 'ok'}">${pre.length ? '⚠' : '✓'} 파트 확인 전 신청 ${pre.length}건</div>
        <div class="ck ${wait.length ? 'bad' : 'ok'}">${wait.length ? '⚠' : '✓'} 확정 대기 ${wait.length}건</div>
        <div class="ck ${overDays.length ? 'warn' : 'ok'}">${overDays.length ? '⚠ 상한 넘는 날 : ' + overDays.join(', ') : '✓ 상한 넘는 날 없음'}</div>
        <div class="ck ${emptySat.length ? 'warn' : 'ok'}">${emptySat.length ? '⚠ 토요근무 비어 있는 주 : ' + emptySat.map(md).join(', ') : '✓ 토요근무 배정 완료'}</div>
        <div class="muted" style="font-size:12.5px;margin:8px 0">팀장님께 보고한 뒤 마감하세요. 마감하면 그 달 연차·토요근무를 아무도 고칠 수 없습니다 (마감 풀기로 해제).</div>
        ${closed ? '<button id="lvopen">마감 풀기</button>' : `<button class="primary" id="lvclose" ${ready ? '' : 'disabled title="확정 대기·확인 전 신청을 먼저 처리하세요"'}>🔒 ${ymLab(L.ym)} 연차 마감</button>`}
      </section>
    </div></div>`;
    A.$$('[data-pt]').forEach(b => (b.onclick = () => { L.part = b.dataset.pt; drawConf(); }));
    A.$$('[data-gm]').forEach(a => (a.onclick = e => { e.preventDefault(); const ny = +a.dataset.gm.slice(0, 4); L.ym = a.dataset.gm; if (ny !== L.year) render(L.main); else draw(); }));
    A.$$('[data-ce]').forEach(b => (b.onclick = e => { e.preventDefault(); leaveModal({ edit: d.leaves.find(x => x.id === b.dataset.ce) }); }));
    const confirm = async ids => {
      if (!ids.length) return A.toast('확정할 건을 고르세요', true);
      try { const r = await A.api('lvConfirm', { ids }); ids.forEach(id => { const x = d.leaves.find(y => y.id === id); if (x) x.st = '확정'; }); A.toast(r.n + '건 확정'); refresh(); } catch (e) { A.toast(e.message, true); }
    };
    A.$$('[data-c1]').forEach(b => (b.onclick = () => confirm([b.dataset.c1])));
    if (A.$('#cfa')) A.$('#cfa').onchange = e => A.$$('.cfc').forEach(c => (c.checked = e.target.checked));
    A.$('#cfs').onclick = () => confirm(A.$$('.cfc:checked').map(c => c.value));
    A.$('#cfall').onclick = async () => { if (await A.confirmBox((L.part || '전체') + ' ' + list.length + '건을 확정합니다.', '확정')) confirm(list.map(x => x.id)); };
    const swapDo = (id, ok) => {
      const run = async note => {
        try { const r = await A.api('lvSwapDo', { id, ok, note }); const i = d.swaps.findIndex(x => x.id === id); d.swaps[i] = r.swap; if (ok) await load(L.year, true); A.toast(ok ? '반영했습니다 (토요 명단이 바뀌었습니다)' : '반려했습니다'); refresh(); } catch (e) { A.toast(e.message, true); }
      };
      if (ok) return run('');
      A.modal(`<h3>바꾸기 요청 반려</h3><div class="fld"><label>반려 이유 <span class="muted">(인원 화면에 보임)</span></label><input id="wnr" maxlength="100" placeholder="예) 그날 인원 부족"></div>
        <div class="acts"><button data-n>취소</button><button class="danger" data-y>반려</button></div>`, (bg, close) => {
        A.$('[data-n]', bg).onclick = close; A.$('[data-y]', bg).onclick = () => { const v = A.$('#wnr', bg).value.trim(); close(); run(v); };
      }, 'md');
    };
    A.$$('[data-wy]').forEach(b => (b.onclick = () => swapDo(b.dataset.wy, true)));
    A.$$('[data-wn]').forEach(b => (b.onclick = () => swapDo(b.dataset.wn, false)));
    const setClose = async close => {
      if (close && !(await A.confirmBox(`<b>${ymLab(L.ym)} 연차·토요근무를 마감</b>합니다.<br><span class="muted">마감 후에는 신청·수정·토요 배정이 모두 막힙니다.${overDays.length || emptySat.length ? '<br>⚠ 점검 항목에 경고가 있습니다.' : ''}</span>`, '마감'))) return;
      try { const r = await A.api('lvClose', { ym: L.ym, close }); d.closed = r.closed; A.toast(close ? '마감했습니다' : '마감을 풀었습니다'); draw(); } catch (e) { A.toast(e.message, true); }
    };
    if (A.$('#lvclose')) A.$('#lvclose').onclick = () => setClose(true);
    if (A.$('#lvopen')) A.$('#lvopen').onclick = () => setClose(false);
  }

  // ------------------------------------------------------------ 사유 기록부 (파트별 8칸 · 엑셀은 원본 3구역)
  function drawRec() {
    const d = D(), f = LC.monthFirst(L.ym), l = LC.monthLast(L.ym), H = L.ix.H;
    const satCnt = {}; LC.monthSaturdays(L.ym).forEach(sd => (L.ix.duty[sd] || []).forEach(u => (satCnt[u.s] = (satCnt[u.s] || 0) + 1)));
    const Z = {}; PARTS.forEach(p => (Z[p] = []));
    visibleLeaves().filter(x => x.d2 >= f && x.d1 <= l).forEach(x => { const s = staffById(x.s); if (s) Z[partOf(s.grp)].push({ x, s }); });
    const q = (L.recQ || '').trim();
    const box = p => {
      const list = Z[p].filter(it => !q || it.s.name.includes(q) || (it.x.r || '').includes(q)).sort((a, b) => LC.ko(a.s.name, b.s.name) || LC.ko(a.x.d1, b.x.d1));
      const days = list.filter(it => !isPend(it.x)).reduce((a, it) => a + LC.leaveDays(it.x, H, f, l), 0);
      return `<div class="card lvz2"><div class="lvzt"><b>${p}</b><span class="muted">${list.length}건 · 확정 ${days}일</span></div><table class="list"><thead><tr><th>이름</th><th>기간</th><th>사유</th><th class="num">일수</th><th class="num">토요</th></tr></thead><tbody>
        ${list.map(it => `<tr class="click" data-l="${it.x.id}"><td><b class="${isMgr(it.s.name) ? 'mgrt' : ''}">${A.esc(it.s.name)}</b>${isPend(it.x) ? ` <span class="lst ${ST[stOf(it.x)][0]}">${stOf(it.x) === '신청' ? '확인 전' : '대기'}</span>` : ''}</td><td>${md(it.x.d1)}${it.x.d2 !== it.x.d1 ? '~' + md(it.x.d2) : ''}${it.x.h ? ' ' + it.x.h : ''}${it.x.t ? ' <span class="tag tr">훈</span>' : ''}</td><td class="rs">${A.esc(it.x.r || '')}</td>
          <td class="num"><b>${LC.leaveDays(it.x, H, f, l)}</b></td><td class="num">${satCnt[it.s.id] || ''}</td></tr>`).join('') || '<tr><td colspan="5" class="muted" style="padding:14px">없음</td></tr>'}</tbody></table></div>`;
    };
    body().innerHTML = `<div class="toolbar"><input id="lvq" placeholder="이름·사유 검색" value="${A.esc(q)}" style="width:200px"><span class="muted">일수 = 이 달 안의 평일 수 (공휴일 제외, 반차 0.5) · 토요 = 이 달 토요근무 횟수 · 엑셀은 원본 양식(3구역) 그대로</span></div>
      <div class="lvzs2">${PARTS.map(box).join('')}</div>`;
    A.$('#lvq').oninput = e => { L.recQ = e.target.value; const pos = e.target.selectionStart; drawRec(); const i = A.$('#lvq'); i.focus(); i.setSelectionRange(pos, pos); };
    A.$$('.lvz2 tr[data-l]').forEach(tr => (tr.onclick = () => leaveModal({ edit: d.leaves.find(x => x.id === tr.dataset.l) })));
  }

  // ------------------------------------------------------------ 토요근무
  const batchDates = ym => ((kv().batches || {})[ym] || LC.monthSaturdays(ym)).slice().sort();
  const cumScore = weeks => { const sc = {}, y = weeks[0] ? weeks[0].slice(0, 4) : String(L.year); (D().duty || []).forEach(u => { if (!weeks.includes(u.d) && u.d.slice(0, 4) === y) sc[u.s] = (sc[u.s] || 0) + 1; }); return sc; };
  function drawSat() {
    const d = D(), can = d.canEdit && !isClosed(L.ym), weeks = batchDates(L.ym), H = L.ix.H;
    const cnt = {}; weeks.forEach(w => (L.ix.duty[w] || []).forEach(u => (cnt[u.s] = (cnt[u.s] || 0) + 1)));
    const sc = cumScore(weeks);
    const roster = d.staff.filter(s => s.roster);
    const A_ = LC.makeAssigner({ roster, slots: kv().slots || [], weeks, lists: Object.fromEntries(weeks.map(w => [w, (L.ix.duty[w] || []).map(u => u.s)])), score: sc });
    const sm = A_.summary();
    const pendSw = (d.swaps || []).filter(w => w.st === '요청');

      return { s, days, half: lv.filter(x => x.h).length, tr, pend, sat: du.length, alt: du.filter(u => u.a).length, grant: s.grant, rem: s.grant != null ? s.grant - days : null, n: all.length };

        <div style="max-height:60vh;overflow:auto"><table class="list"><thead><tr><th>기간</th><th class="num">일수</th><th>사유</th><th>상태</th></tr></thead><tbody>

  async function exportXlsx() {

  window.Leave = { init, render, prefetch, counts: () => L.counts, reset: () => { L.data = null; L.year = null; L.counts = null; L.tab = null; L.ym = null; L.part = ''; } };

<script>/* 인사평가 계산 (예전 구글 앱스 스크립트 Code.gs 의 buildMonth_ · items_ · orderRows_ 를 그대로 옮김) */

  // 서버 hrMonth 응답 → { items, list:[{person, data, refs, notes, rec}] }  (Code.gs buildMonth_ + getPart_ 와 같은 결과)
  function build(resp) {
    const its = items(resp.items);
    const cfg = resp.cfg || {};
    const targets = {};
    (cfg['등급목표'] || []).forEach(r => { targets[str(r['등급']).toUpperCase()] = num(r['목표수량']); });

      const d = {

        총수량순위: r ? (rk.t || null) : null,
        일평균: r ? num(r['평가평균']) : null,

        지시불이행: r ? num(r['지시불이행']) || 0 : null,
        미발송: r ? num(r['미발송']) || 0 : null,
        오발송: r ? num(r['오발송']) || 0 : null,
        오조립: r ? num(r['오조립']) || 0 : null,
        파손: r ? num(r['파손']) || 0 : null
