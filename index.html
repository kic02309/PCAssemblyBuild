  // 저장
  function changed() {
    S.dirty = true; refreshCalc(); showSaveState();
    clearTimeout(S.timer); S.timer = setTimeout(() => saveNow(), 2500);
  }
  function showSaveState(err) {
    const el = $('#ss'); if (!el) return;
    if (err) { el.className = 'save-state err'; el.textContent = '⚠ 저장 실패 — ' + err; return; }
    if (S.saving) { el.className = 'save-state ing'; el.textContent = '저장 중…'; return; }
    if (S.dirty) { el.className = 'save-state ing'; el.textContent = '수정됨 (곧 자동 저장)'; return; }
    el.className = 'save-state';
    el.textContent = S.day && S.day.savedAt ? '✓ 저장됨 ' + S.day.savedAt.slice(5, 16) + (S.day.savedBy && S.day.savedBy !== who().name ? ' (' + S.day.savedBy + ')' : '') : '아직 저장 안 됨';
  }
  async function saveNow(manual) {
    clearTimeout(S.timer);
    if (!S.day || !S.day.canEdit) return true;
    if (!S.dirty && !manual) return true;
    if (S.saving) { await new Promise(r => setTimeout(r, 300)); return saveNow(manual); }
    S.saving = true; showSaveState();
    const doc = S.day.doc;
    const clean = Object.assign({}, doc, { rows: doc.rows.filter(r => String(r.o).trim() || r.memo).map(r => ({ o: r.o, q: r.q, m: r.m, memo: r.memo || undefined })) });
    const snapshotDirty = JSON.stringify(doc);
    try {
      const r = await api('saveDay', { userId: who().id, date: S.date, doc: clean, sum: C.daySummary(clean, minsOf(S.date)) });
      S.day.savedAt = r.savedAt; S.day.savedBy = r.savedBy; S.day.exists = true;
      if (S.day.pc) S.day.pc.days[S.date] = { doc: JSON.parse(JSON.stringify(clean)), at: r.savedAt, by: r.savedBy };
      if (JSON.stringify(doc) === snapshotDirty) S.dirty = false;
      S.saving = false; showSaveState();
      if (manual) toast('저장했습니다');
      return true;
    } catch (e) {
      S.saving = false; showSaveState(e.message); toast('저장 실패: ' + e.message, true);
      return false;
    }
  }
  async function delDay() {
    if (!(await confirmBox(dLabel(S.date) + ' 데이터를 통째로 삭제할까요?<br><span class="muted">엑셀로 받을 때 이 날짜 시트가 빠집니다.</span>', '삭제'))) return;
    try { await api('deleteDay', { userId: who().id, date: S.date }); if (S.day.pc) delete S.day.pc.days[S.date]; S.dirty = false; toast('삭제했습니다'); loadDay(S.date); }
    catch (e) { toast(e.message, true); }
  }
  // 창을 닫을 때 저장 안 된 내용이 있으면 마지막으로 한 번 더 보냄 (keepalive)
  function flushOnClose() {
    if (!S.dirty || !S.day || !S.day.canEdit || !S.token) return;
    const doc = S.day.doc;
    const clean = Object.assign({}, doc, { rows: doc.rows.filter(r => String(r.o).trim() || r.memo).map(r => ({ o: r.o, q: r.q, m: r.m, memo: r.memo || undefined })) });
    try { fetch(SB_URL + '/rest/v1/rpc/beacon?apikey=' + encodeURIComponent(SB_KEY), { method: 'POST', keepalive: true, body: JSON.stringify({ action: 'saveDay', token: S.token, userId: who().id, date: S.date, doc: clean, sum: C.daySummary(clean, minsOf(S.date)) }) }); S.dirty = false; } catch (e) { }
  }
  window.addEventListener('pagehide', flushOnClose);
  window.addEventListener('beforeunload', e => { if (S.dirty) { flushOnClose(); } });

  async function makeXlsxBlob(user, ym, target, days) {
    const z = await C.buildXlsx(JSZip, TEMPLATE_B64, { name: user.name, ym, target, days, mins: minsYm(ym), tips: (rateSet(ym) || {}).tips });

  function saveBlob(blob, name) {

      <div class="fld"><label>권한${self ? ' (본인 권한은 바꿀 수 없음)' : ''}</label><select id="eu_r" ${self ? 'disabled' : ''}>${opt(['일반', '매니저', '관리자'], u.role)}</select></div>
      <div class="fld" id="eu_mgw"><label>담당 그룹 (매니저가 보고 고칠 수 있는 그룹)</label>
        <div class="chks">${C.GROUP_LIST.map(g => `<label><input type="checkbox" value="${g}" ${mg0.includes(g) ? 'checked' : ''}>${g}</label>`).join('')}</div></div>
      <div class="fld"><label class="lvchk" style="font-size:14px;color:inherit"><input type="checkbox" id="eu_la" ${u.la || u.role === '관리자' ? 'checked' : ''} ${u.role === '관리자' ? 'disabled' : ''}> 연차·토요근무 입력 권한 <span class="muted" style="font-size:12px">(관리자는 항상 가능)</span></label></div>
      <div class="muted" style="line-height:1.6">· 그룹을 바꾸면 지난 기록까지 새 그룹 매니저에게 보이고, 이전 그룹 매니저에게는 안 보입니다.<br>· 입력한 데이터는 그대로 이 사람에게 남습니다.</div>
      <div class="acts" style="justify-content:space-between">
        <div style="display:flex;gap:8px">${u.role !== '관리자' ? '<button data-pin>비밀번호 초기화</button>' : ''}${u.role === '일반' ? '<button class="danger" data-del>계정 삭제</button>' : ''}</div>
        <div style="display:flex;gap:8px"><button data-n>취소</button><button class="primary" data-y>저장</button></div>
      </div>`, (bg, close) => {
      const role = $('#eu_r', bg), mgw = $('#eu_mgw', bg);
      const la = $('#eu_la', bg);
      const sync = () => { mgw.classList.toggle('hide', role.value !== '매니저'); la.disabled = role.value === '관리자'; if (la.disabled) la.checked = true; }; sync(); role.onchange = sync;
      const done = msg => { close(); toast(msg); S._mcache = {}; S.pc = {}; renderManage(); };
      $('[data-n]', bg).onclick = close;
      $('[data-y]', bg).onclick = async () => {
        const mg = $$('#eu_mgw .chks input:checked', bg).map(x => x.value);
        try {
          const x = await api('updateUser', { userId: u.id, name: $('#eu_n', bg).value, group: $('#eu_g', bg).value, role: role.value, mg, leaveAdmin: role.value === '관리자' ? !!u.la : la.checked });
          if (self) { S.me.name = x.user.name; S.me.group = x.user.group; shell(); setNav(); }
          done(x.user.name + ' 저장 (' + x.user.group + ' · ' + x.user.role + (x.user.mg.length ? ' · 담당 ' + x.user.mg.join(',') : '') + ')');
        } catch (e) { toast(e.message, true); }
      };
      if ($('[data-pin]', bg)) $('[data-pin]', bg).onclick = async () => {
        if (!(await confirmBox(esc(u.name) + ' 님의 비밀번호를 초기화할까요?<br><span class="muted">다음 로그인 때 입력하는 4자리가 새 비밀번호가 됩니다.</span>', '초기화'))) return;
        try { await api('resetPin', { userId: u.id }); done(u.name + ' 비밀번호 초기화'); } catch (e) { toast(e.message, true); }
      };
      if ($('[data-del]', bg)) $('[data-del]', bg).onclick = async () => {
        const n = (u.items || []).length;
        if (!(await confirmBox('<b>' + esc(u.name) + '</b> (' + esc(u.group) + ') 계정을 삭제할까요?<br><span class="muted">이 사람이 입력한 모든 달의 데이터와 목표도 함께 지워지며 되돌릴 수 없습니다.</span>' + (n ? '<br><b style="color:var(--red)">이번 기간에 입력한 데이터 ' + n + '일이 있습니다.</b>' : ''), '삭제'))) return;
        try { const x = await api('deleteUser', { userId: u.id }); done(u.name + ' 삭제 (데이터 ' + x.rows + '일)'); } catch (e) { toast(e.message, true); }
      };
    }, 'md');
  }
  function renderBoard(r) {
    const list = S._mlist, end = r.range.end > S.today ? S.today : r.range.end, dates = [];
    for (let d = r.range.start; d <= end && dates.length < 100; d = C.addDays(d, 1)) dates.push(d);
    const byU = {}; list.forEach(u => { byU[u.id] = {}; u.items.forEach(it => (byU[u.id][it.date] = it.sum || {})); });
    const cnt = {}; dates.forEach(d => (cnt[d] = list.filter(u => byU[u.id][d]).length));
    $('#mbody').innerHTML = `
      <div class="legend"><span><i class="r-hi"></i>목표 90% 이상</span><span><i class="r-mid"></i>50~90%</span><span><i class="r-lo"></i>50% 이하</span><span><i class="r-no"></i>목표 미설정</span><span class="muted">칸 숫자 = 그날 평가평균 · 칸을 누르면 그날 입력 화면으로 이동</span></div>
      <div class="card board" style="padding:0;overflow:auto;max-height:calc(100vh - ${S.me.period && S.mMode === 'month' ? 350 : 295}px)">
      <table class="bd"><thead><tr><th class="bn">이름</th>${dates.map(d => { const w = new Date(d + 'T00:00:00').getDay(); return `<th class="${w === 6 ? 'sat' : w === 0 ? 'sun' : ''}">${+d.slice(8)}<small>${C.WD[w]}</small></th>`; }).join('')}<th class="bt">근무일</th><th class="bt">평가평균</th><th class="bt">달성률</th></tr></thead><tbody>
      ${list.map(u => `<tr data-u="${u.id}"><td class="bn"><b>${esc(u.name)}</b><small>${esc(u.group)}${u.target ? ' · 목표 ' + u.target : ''}</small></td>${dates.map(d => {
        const s = byU[u.id][d]; if (!s) return `<td class="e" data-d="${d}"></td>`;
        const v = C.sumDay(s, minsOf(d)).f7, rc = u.target ? rateCls(v / u.target) : 'r-no';
        return `<td class="${rc}" data-d="${d}" title="${esc(u.name)} ${dLabel(d)} · 평가평균 ${f2(v)}${u.target ? ' (' + pct(v / u.target) + ')' : ''} · 주문 ${s.n || 0}건">${(Math.round(v * 10) / 10).toFixed(1)}</td>`;
      }).join('')}<td class="bt">${u.items.length ? u.days : '-'}</td><td class="bt"><b>${u.items.length ? f2(u.m.f7) : '-'}</b></td><td class="bt ${u.target && u.items.length ? rateCls(u.m.c8) + 't' : ''}">${u.target && u.items.length ? pct(u.m.c8) : '-'}</td></tr>`).join('') || '<tr><td class="muted" style="padding:24px">표시할 인원이 없습니다</td></tr>'}
      </tbody><tfoot><tr><td class="bn">입력 인원</td>${dates.map(d => `<td>${cnt[d] || ''}</td>`).join('')}<td class="bt" colspan="3"></td></tr></tfoot></table></div>`;
    $$('.bd td[data-d]').forEach(td => (td.onclick = () => { const u = S._mlist.find(x => x.id === td.closest('tr').dataset.u); openUser(u, 'day', td.dataset.d); }));
  }
  async function zipAll(ym) {
    const list = (S._mlist || []).filter(u => u.items.length);
    if (!list.length) return toast('받을 데이터가 없습니다', true);
    if (!(await confirmBox(list.length + '명의 엑셀을 하나의 zip으로 받습니다. 인원이 많으면 몇 분 걸릴 수 있습니다.', '받기'))) return;
    const btn = $('#zip'), pg = $('#pg'), pgt = $('#pgt'); btn.disabled = true; pg.classList.remove('hide');
    const zip = new JSZip(); let done = 0, fails = [];
    for (const u of list) {
      pgt.textContent = done + '/' + list.length + ' ' + u.name;
      try { const mr = await api('getMonth', { userId: u.id, ym }); zip.file(C.fileName(u.name, ym), await makeXlsxBlob(mr.user, ym, mr.target, mr.days)); }
      catch (e) { fails.push(u.name); }
      done++; $('i', pg).style.width = (done / list.length * 100) + '%';
    }
    pgt.textContent = '압축 중…';
    saveBlob(await zip.generateAsync({ type: 'blob' }), ymLabel(ym) + ' 업무데이터' + (S.manageGroup ? '_' + S.manageGroup : '') + '.zip');
    pgt.textContent = fails.length ? '실패: ' + fails.join(', ') : '완료'; btn.disabled = false;
  }

  function periodPanel() {
    const open = S.periods.find(p => p.status === '진행');
    const lastClosed = S.periods.filter(p => p.status === '마감').pop();
    const nextYm = open ? open.ym : (lastClosed ? nextYmOf(lastClosed.ym) : S.today.slice(0, 7));
    return `
    <details class="pp" ${open ? '' : 'open'}><summary>월 기간 설정 · 마감 <span class="muted" style="font-weight:400;font-size:12px">— 현재 ${open ? ymLabel(open.ym) + ' 진행중 (' + open.start + ' 시작)' : '진행 중인 달 없음'} · 기간관리 권한자만 보임</span></summary>
    <div class="card">
      <table class="list" style="margin-bottom:12px"><thead><tr><th>귀속월</th><th>시작일</th><th>마감일</th><th>상태</th></tr></thead><tbody>
      ${S.periods.slice().reverse().map(p => `<tr><td><b>${ymLabel(p.ym)}</b></td><td>${p.start}</td><td>${p.end || '-'}</td><td>${periodChip(p)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">기간 없음</td></tr>'}
      </tbody></table>
      ${open ? `
      <div class="row" style="gap:14px;align-items:flex-end">
        <div class="fld"><label>귀속월</label><input type="month" id="pym" value="${open.ym}"></div>
        <div class="fld"><label>시작일</label><input type="date" id="pst" value="${open.start}"></div>
        <div class="fld"><label>마감일</label><input type="date" id="pen"></div>
        <button class="primary" id="pclose">이 달 마감</button>
        <button id="pedit">귀속월·시작일만 수정</button>
      </div>
      <div class="note">마감하면 그 기간은 일반 인원이 수정할 수 없고(관리자·담당 매니저만 가능), 다음 달이 마감일 다음 날부터 자동으로 열립니다.</div>` : `
      <div class="row" style="gap:14px;align-items:flex-end">
        <div class="fld"><label>귀속월</label><input type="month" id="pym" value="${nextYm}"></div>
        <div class="fld"><label>시작일</label><input type="date" id="pst" value="${lastClosed ? addDaysStr(lastClosed.end, 1) : ''}"></div>
        <button class="primary" id="popen">이 달 시작</button>
      </div>`}
      <div class="row" style="margin-top:14px;gap:10px">
        ${lastClosed ? `<button id="pcancel">최근 마감 취소 (${ymLabel(lastClosed.ym)})</button>` : ''}
        <span style="flex:1"></span>
        <button id="prt" title="항목별 분(점수)과 설명 말풍선을 귀속월부터 바꿉니다">⚙ 항목 점수 설정</button>
        ${S.me.role === '관리자' ? '<button id="pbk" title="선택한 귀속월의 계정·기간·목표·일일 데이터 전체를 파일로 저장 (매달 마감 후 보관 권장)">💾 백업 받기</button>' : ''}
        <button class="danger" id="pwipe">테스트 데이터 전체 삭제</button>
      </div>
      <div class="row" style="gap:14px;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)">
        <b style="align-self:center">지난 달 추가</b>
        <div class="fld"><label>귀속월</label><input type="month" id="aym"></div>
        <div class="fld"><label>시작일</label><input type="date" id="ast"></div>
        <div class="fld"><label>마감일</label><input type="date" id="aen"></div>
        <button id="padd">마감 상태로 추가</button>
        <span class="muted" style="align-self:center">예전 엑셀 데이터를 넣기 위한 지난 기간 (가장 앞 기간보다 이전만)</span>
      </div>
    </div></details>`;
  }
  const nextYmOf = ym => { let [y, m] = ym.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return y + '-' + C.pad(m); };
  const addDaysStr = (s, k) => C.addDays(s, k);
  function bindPeriodPanel() {
    const upd = r => { S.periods = r.periods; S.manageYm = null; S.mMode = 'month'; S._mcache = {}; S.pc = {}; renderManage(); };
    const refreshAfterFail = async () => { try { const m = await api('me'); S.periods = m.periods; S.manageYm = null; renderManage(); } catch (e) { } };
    const b = id => $('#' + id);
    if (b('popen')) b('popen').onclick = async () => {
      try { upd(await api('openPeriod', { ym: b('pym').value, start: b('pst').value })); toast('기간을 시작했습니다'); } catch (e) { toast(e.message, true); }
    };
    if (b('pclose')) b('pclose').onclick = async () => {
      const ym = b('pym').value, st = b('pst').value, en = b('pen').value;
      if (!en) return toast('마감일을 선택하세요', true);
      if (!(await confirmBox(`<b>${ymLabel(ym)}</b> (${st} ~ ${en}) 을 마감합니다.<br>다음 달은 ${C.addDays(en, 1)} 부터 자동으로 시작됩니다.`, '마감'))) return;
      try { upd(await api('closePeriod', { ym, start: st, end: en })); toast('마감했습니다'); } catch (e) { toast(e.message, true); }
    };
    if (b('pedit')) b('pedit').onclick = async () => {
      try { upd(await api('editOpen', { ym: b('pym').value, start: b('pst').value })); toast('수정했습니다'); } catch (e) { toast(e.message, true); }
    };
    if (b('pcancel')) b('pcancel').onclick = async () => {
      if (!(await confirmBox('가장 최근 마감을 취소하고 그 달을 다시 진행 상태로 돌립니다.<br>그 뒤에 자동으로 열렸던 다음 달 기간은 삭제됩니다 (입력 데이터는 지워지지 않음).', '마감 취소'))) return;
      try { upd(await api('cancelClose')); toast('마감을 취소했습니다'); } catch (e) { toast(e.message, true); }
    };
    if (b('prt')) b('prt').onclick = editRates;
    if (b('pbk')) b('pbk').onclick = async () => {
      const ym = S.manageYm || (curPeriod() || {}).ym;
      if (!ym) return toast('귀속월이 없습니다', true);
      try {
        const r = await api('backup', { ym }); delete r.ok; delete r._ms;
        saveBlob(new Blob([JSON.stringify(r)], { type: 'application/json' }), '업무데이터_백업_' + ym + '_' + S.today + '.json');
        toast(ymLabel(ym) + ' 백업 ' + r.days.length + '건을 받았습니다');
      } catch (e) { toast(e.message, true); }
    };
    b('padd').onclick = async () => {
      try { upd(await api('addPastPeriod', { ym: b('aym').value, start: b('ast').value, end: b('aen').value })); toast('지난 달 기간을 추가했습니다'); } catch (e) { toast(e.message, true); refreshAfterFail(); }
    };
    b('pwipe').onclick = () => modal(`<h3 style="color:var(--red)">테스트 데이터 전체 삭제</h3>
      <div style="line-height:1.6">모든 인원의 <b>입력 데이터, 월 목표, 월 기간</b>이 전부 삭제됩니다. 계정(이름·비밀번호)은 남습니다.<br>되돌릴 수 없습니다. 계속하려면 <b>전체삭제</b> 라고 입력하세요.</div>
      <div class="fld" style="margin-top:10px"><input id="cf" placeholder="전체삭제"></div>
      <div class="acts"><button data-c>취소</button><button class="danger" data-s>삭제</button></div>`, (bg, close) => {
      $('[data-c]', bg).onclick = close;
      $('[data-s]', bg).onclick = async () => {
        try { upd(await api('deleteAllData', { confirm: $('#cf', bg).value })); close(); toast('전체 삭제했습니다'); } catch (e) { toast(e.message, true); }
      };
    });
  }

  // ------------------------------------------------ 시작
  // 매니저·관리자 : 관리 목록을 뒤에서 미리 받아 둠 → [관리] 누르면 바로 보임
  function prefetchManage() {
    const ym = (curPeriod() || {}).ym; if (!ym || !isManager()) return;
    const key = 'M|' + ym; S._mcache = S._mcache || {}; S._mpf = S._mpf || {};
    if (S._mcache[key] || S._mpf[key]) return;
    S._mpf[key] = api('listUsers', { ym }).then(r => { if (!S._mcache[key]) S._mcache[key] = r; return r; }).catch(() => null).finally(() => { delete S._mpf[key]; });
  }
  async function boot(pre) {
    if (!S.token) return renderLogin();
    try {
      const r = pre && pre.me ? pre : await api('me', { withDay: true });
      S.me = r.me; S.periods = r.periods; S.today = r.today || S.today; S.rates = r.rates || [];
      S.pc = {};
      if (r.day && r.day.period) S.pc[pcKey(r.me.id, r.day.period.ym)] = { t: Date.now(), period: r.day.period, target: r.day.target, canEdit: r.day.canEdit, canSetTarget: r.day.canSetTarget, days: r.day.days || {} };
      let d0 = S.today;
      try { const pend = JSON.parse(sessionStorage.getItem('pending') || 'null'); if (pend && pend.uid === S.me.id && pend.date) d0 = pend.date; } catch (e) { }
      shell(); go('input', { date: d0 });
      if (isManager()) setTimeout(prefetchManage, 600);
    } catch (e) { if (S.token) { toast(e.message, true); } renderLogin(); }
  }
  if (window.Leave) window.Leave.init({ api, modal, toast, confirmBox, esc, $, $$, S, saveBlob });
  boot();
})();
</script>
</body>
</html>
