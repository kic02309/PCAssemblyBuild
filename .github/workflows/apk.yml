# 조립 검수 카메라 앱(android/) 자동 빌드 → Releases 'apk-latest' 에 APK 올림
# 결과(성공/실패 + 빌드 기록)는 'apk-status' 브랜치에 남김 (작업자가 확인용)
name: build-apk
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK 빌드
        id: build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: 릴리스 올리기
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PCAB-Cam.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest PCAB-Cam.apk -t "조립 검수 카메라 1.0.${{ github.run_number }}" -n "자동 빌드 · ${{ github.sha }}" --latest
      - name: 결과 기록
        if: always()
        run: |
          st="${{ job.status }}"; [ -f PCAB-Cam.apk ] && st=success || { [ "$st" = success ] && st=failure; }
          mkdir -p /tmp/st && cd /tmp/st && git init -q && git checkout -q -b apk-status
          echo "result=$st" > status.txt; echo "run=${{ github.run_number }}" >> status.txt; echo "sha=${{ github.sha }}" >> status.txt; date -u +"at=%Y-%m-%dT%H:%M:%SZ" >> status.txt
          tail -n 400 $GITHUB_WORKSPACE/build.log > build-tail.log 2>/dev/null || echo "(no log)" > build-tail.log
          grep -nE "^e: |error:|FAILURE|What went wrong" -A3 $GITHUB_WORKSPACE/build.log | head -200 > errors.log 2>/dev/null || true
          git add -A && git -c user.name=apk-bot -c user.email=apk-bot@users.noreply.github.com commit -qm "apk status $st #${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-status
