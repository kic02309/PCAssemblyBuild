# 조립QC (2번째 검수 앱 · 비교용) 빌드 — 기존 앱(kr.pcab.cam · apk-latest)은 건드리지 않음
# 빌드할 때만 패키지명 · 앱 이름 · 시작 주소(ui=2)를 바꿔서 따로 설치되게 함 → Releases 'apk-qc' (최신 표시 없음)
name: build-apk-qc
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk-qc.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-qc
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 조립QC 로 바꾸기
        run: |
          sed -i 's/applicationId = "kr.pcab.cam"/applicationId = "kr.pcab.qc"/' android/app/build.gradle.kts
          sed -i 's/android:label="조립 검수"/android:label="조립QC"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#PCAssemblyBuild/?app=cam"#PCAssemblyBuild/?app=cam\&ui=2"#' android/app/src/main/java/kr/pcab/cam/MainActivity.kt
          sed -i 's#PCABCam/${appVersion()}"#PCABCam/${appVersion()} PCABQC/1"#' android/app/src/main/java/kr/pcab/cam/MainActivity.kt
          grep -n 'applicationId' android/app/build.gradle.kts; grep -n 'android:label' android/app/src/main/AndroidManifest.xml; grep -n 'START_URL =' android/app/src/main/java/kr/pcab/cam/MainActivity.kt
          grep -q 'kr.pcab.qc' android/app/build.gradle.kts && grep -q '조립QC' android/app/src/main/AndroidManifest.xml && grep -q 'ui=2' android/app/src/main/java/kr/pcab/cam/MainActivity.kt && grep -q 'PCABQC/1' android/app/src/main/java/kr/pcab/cam/MainActivity.kt
      - name: APK 빌드
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: 릴리스 올리기 (최신 표시 없음)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk JoripQC.apk
          gh release delete apk-qc -y --cleanup-tag || true
          gh release create apk-qc JoripQC.apk -t "조립QC 1.0.${{ github.run_number }}" -n "비교용 · ${{ github.sha }}" --prerelease --latest=false
