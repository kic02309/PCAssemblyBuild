# Supabase 무료 서버는 7일 동안 사용이 없으면 잠깁니다. 매일 아침 한 번 깨워 둡니다 (연휴 대비).
name: keep-server-awake
on:
  schedule:
    - cron: '17 0 * * *'   # 매일 09:17 (한국 시간)
  workflow_dispatch:        # Actions 화면에서 [Run workflow]로 바로 시험
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 깨우기
        run: |
          r=$(curl -sS --retry 3 --retry-delay 20 -X POST "https://yadjslslmprglcquyets.supabase.co/rest/v1/rpc/api" \
                -H "apikey: sb_publishable_5LoR30TsduFp6ivEaKNkXg_58Vbm2ur" -H "Content-Type: application/json" \
                -d '{"req":{"action":"ping"}}')
          echo "$r"
          echo "$r" | grep -q '"ok"[ ]*:[ ]*true'
